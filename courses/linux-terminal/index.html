<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<title>Linux Terminal — learn the shell in a real, working simulator</title>

<style>
  :root{
    --bg:       #140A11;
    --panel:    #1D1018;
    --panel-2:  #251622;
    --rail:     #180D14;
    --term:     #0C0509;
    --border:   #35222F;
    --border-lit:#4C3244;
    --text:     #EADFE6;
    --muted:    #A08E9B;
    --faint:    #6E5D6A;

    --accent:   #C77DFF;
    --accent-dim:#3A2350;
    --green:    #8FD96A;
    --amber:    #E8B84B;
    --red:      #F0655F;
    --cyan:     #62D8D8;
    --blue:     #7AA2F7;

    --mono:'JetBrains Mono', ui-monospace, Consolas, monospace;
    --sans:'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
  }

  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; height:100%; }
  body{
    background:var(--bg); color:var(--text);
    font-family:var(--sans);
    display:flex; flex-direction:column; height:100vh; overflow:hidden;
  }
  ::selection{ background:var(--accent-dim); color:#fff; }

  /* ---------- top bar ---------- */
  .topbar{
    height:48px; flex-shrink:0;
    background:var(--rail); border-bottom:1px solid var(--border);
    display:flex; align-items:center; gap:14px; padding:0 16px;
  }
  .brand{ display:flex; align-items:center; gap:9px; font-weight:600; font-size:14px; }
  .brand .tux{ font-size:16px; }
  .topbar .spacer{ flex:1; }
  .pbar{ width:150px; height:4px; background:var(--border); border-radius:999px; overflow:hidden; }
  .pbar i{ display:block; height:100%; width:0; background:var(--accent); transition:width .35s ease; }
  .ptxt{ font-family:var(--mono); font-size:11px; color:var(--faint); white-space:nowrap; }
  .tbtn{
    font-family:var(--mono); font-size:11px; color:var(--muted);
    background:none; border:1px solid var(--border); border-radius:5px;
    padding:5px 10px; cursor:pointer;
  }
  .tbtn:hover{ color:var(--text); border-color:var(--border-lit); }

  /* ---------- layout ---------- */
  .app{ flex:1; display:flex; min-height:0; }

  .rail{
    width:206px; flex-shrink:0; background:var(--rail);
    border-right:1px solid var(--border); overflow-y:auto; padding:12px 0 30px;
  }
  .rail h4{
    font-family:var(--mono); font-size:10px; letter-spacing:.14em;
    text-transform:uppercase; color:var(--faint);
    margin:0; padding:6px 14px 8px;
  }
  .mbtn{
    width:100%; text-align:left; background:none; border:0;
    border-left:2px solid transparent; padding:8px 14px; cursor:pointer;
    display:flex; gap:9px; align-items:center;
    color:var(--muted); font-family:var(--sans); font-size:12.5px;
    transition:background .12s, color .12s;
  }
  .mbtn:hover{ background:var(--panel); color:var(--text); }
  .mbtn.active{ background:var(--panel); color:var(--text); border-left-color:var(--accent); }
  .mbtn .dot{
    width:13px; height:13px; flex-shrink:0; border-radius:50%;
    border:1.5px solid var(--border-lit);
    display:grid; place-items:center; font-size:8px; color:transparent;
  }
  .mbtn.done .dot{ background:var(--green); border-color:var(--green); color:#12220A; }
  .mbtn .n{ font-family:var(--mono); font-size:10px; color:var(--faint); }

  .lesson{
    width:435px; flex-shrink:0; overflow-y:auto;
    border-right:1px solid var(--border);
    padding:26px 26px 60px; background:var(--bg);
  }
  .term-wrap{ flex:1; min-width:0; display:flex; flex-direction:column; background:var(--term); }

  /* ---------- lesson content ---------- */
  .eyebrow{
    font-family:var(--mono); font-size:10.5px; letter-spacing:.14em;
    text-transform:uppercase; color:var(--accent); margin-bottom:8px;
  }
  .lesson h1{ font-size:22px; line-height:1.25; margin:0 0 10px; letter-spacing:-0.01em; }
  .lesson .lead{ font-size:14px; line-height:1.65; color:var(--muted); margin:0 0 22px; }
  .lesson h2{
    font-size:13.5px; margin:26px 0 9px; font-weight:600;
    display:flex; gap:8px; align-items:baseline;
  }
  .lesson h2 .ix{ font-family:var(--mono); font-size:10px; color:var(--faint); }
  .lesson p{ font-size:13.6px; line-height:1.72; color:#CFC2CB; margin:0 0 12px; }
  .lesson strong{ color:var(--text); font-weight:600; }
  code{
    font-family:var(--mono); font-size:12px;
    background:var(--panel-2); border:1px solid var(--border);
    border-radius:4px; padding:1px 5px; color:var(--accent);
  }
  .lesson ul{ margin:0 0 12px; padding-left:18px; }
  .lesson li{ font-size:13.4px; line-height:1.7; color:#CFC2CB; margin-bottom:5px; }

  .demo{
    background:var(--term); border:1px solid var(--border); border-radius:6px;
    padding:11px 13px; margin:0 0 13px;
    font-family:var(--mono); font-size:11.9px; line-height:1.75;
    white-space:pre-wrap; overflow-x:auto; color:#B8AAB4;
  }
  .demo .p{ color:var(--green); }
  .demo .c{ color:var(--text); }
  .demo .m{ color:var(--faint); }

  .tip{
    border-left:2px solid var(--amber); background:rgba(232,184,75,.055);
    padding:11px 14px; margin:0 0 13px; font-size:13.2px; line-height:1.65; color:#CFC2CB;
  }
  .tip b{ color:var(--amber); }
  .tip.warn{ border-left-color:var(--red); background:rgba(240,101,95,.055); }
  .tip.warn b{ color:var(--red); }

  /* ---------- tasks ---------- */
  .tasks{
    margin-top:26px; border:1px solid var(--border); border-radius:7px;
    background:var(--panel); overflow:hidden;
  }
  .tasks-h{
    padding:10px 14px; border-bottom:1px solid var(--border);
    font-family:var(--mono); font-size:10.5px; letter-spacing:.13em;
    text-transform:uppercase; color:var(--muted);
    display:flex; align-items:center; gap:8px;
  }
  .task{
    display:flex; gap:10px; padding:11px 14px;
    border-top:1px solid var(--border); font-size:13.2px; line-height:1.6;
  }
  .task:first-of-type{ border-top:0; }
  .task .box{
    width:15px; height:15px; flex-shrink:0; margin-top:2px;
    border:1.5px solid var(--border-lit); border-radius:4px;
    display:grid; place-items:center; font-size:9px; color:transparent;
  }
  .task.done .box{ background:var(--green); border-color:var(--green); color:#12220A; }
  .task.done .txt{ color:var(--faint); text-decoration:line-through; }
  .task .txt{ color:#CFC2CB; }
  .task .txt code{ font-size:11.5px; }
  .task-hint{
    font-family:var(--mono); font-size:11px; color:var(--faint);
    margin-top:5px; display:block;
  }

  .navrow{ display:flex; gap:9px; margin-top:22px; }
  .btn{
    font-family:var(--sans); font-size:12.5px; font-weight:600;
    padding:7px 13px; border-radius:6px; cursor:pointer;
    border:1px solid var(--border-lit); background:var(--panel-2); color:var(--text);
  }
  .btn:hover:not(:disabled){ background:#2E1B29; }
  .btn:disabled{ opacity:.4; cursor:not-allowed; }
  .navrow .sp{ flex:1; }

  /* ---------- terminal ---------- */
  .term-bar{
    height:32px; flex-shrink:0; background:var(--panel);
    border-bottom:1px solid var(--border);
    display:flex; align-items:center; gap:8px; padding:0 12px;
    font-family:var(--mono); font-size:11px; color:var(--faint);
  }
  .term-bar .lights{ display:flex; gap:6px; margin-right:5px; }
  .term-bar .lights i{ width:10px; height:10px; border-radius:50%; display:block; }
  .term-bar .spacer{ flex:1; }

  #screen{
    flex:1; overflow-y:auto; padding:14px 16px 4px;
    font-family:var(--mono); font-size:12.8px; line-height:1.6;
    white-space:pre-wrap; word-break:break-word; color:#CFC2CB;
  }
  #screen .prompt{ color:var(--green); }
  #screen .path{ color:var(--blue); }
  #screen .cmd{ color:var(--text); }
  #screen .err{ color:var(--red); }
  #screen .dir{ color:var(--accent); font-weight:500; }
  #screen .lnk{ color:var(--cyan); }
  #screen .exe{ color:var(--green); }
  #screen .dim{ color:var(--faint); }
  #screen .hl{ color:var(--amber); }
  #screen .ok{ color:var(--green); }

  .inputline{
    display:flex; align-items:flex-start; gap:0;
    padding:2px 16px 16px;
    font-family:var(--mono); font-size:12.8px; line-height:1.6;
    flex-shrink:0;
  }
  .inputline .ps1{ color:var(--green); white-space:pre; flex-shrink:0; }
  .inputline .ps1 .path{ color:var(--blue); }
  #cmdin{
    flex:1; background:transparent; border:0; outline:0;
    font-family:var(--mono); font-size:12.8px; line-height:1.6;
    color:var(--text); padding:0; min-width:0;
    caret-color:var(--accent);
  }

  /* ---------- editor overlay (nano / vim) ---------- */
  .ed{
    position:fixed; inset:0; z-index:300;
    background:var(--term); display:none;
    flex-direction:column;
    font-family:var(--mono); font-size:13px;
  }
  .ed.open{ display:flex; }
  .ed-top{
    flex-shrink:0; padding:5px 12px; text-align:center;
    background:var(--text); color:var(--term); font-weight:600; font-size:12.5px;
  }
  .ed-vim .ed-top{ background:var(--panel-2); color:var(--muted); text-align:left; }
  .ed-body{ flex:1; display:flex; min-height:0; }
  .ed-gut{
    flex-shrink:0; padding:8px 8px 8px 12px; text-align:right;
    color:var(--faint); font-size:12.5px; line-height:1.55; user-select:none;
    background:rgba(255,255,255,.015);
    white-space:pre;      /* the numbers are newline-joined — without this they run across */
    overflow:hidden;
  }
  .ed textarea{
    flex:1; background:transparent; border:0; outline:0; resize:none;
    color:var(--text); font-family:var(--mono); font-size:13px; line-height:1.55;
    padding:8px 14px 8px 6px; caret-color:var(--accent);
  }
  .ed-msg{
    flex-shrink:0; padding:3px 12px; min-height:22px;
    color:var(--amber); font-size:12.5px; text-align:center;
  }
  .ed-vim .ed-msg{ text-align:left; }
  .ed-keys{
    flex-shrink:0; display:flex; flex-wrap:wrap; gap:0 18px;
    padding:6px 12px 8px; font-size:12px; color:var(--muted);
  }
  .ed-keys b{
    background:var(--text); color:var(--term);
    padding:0 3px; font-weight:600; margin-right:5px;
  }
  .ed-mode{
    display:inline-block; padding:0 7px; margin-right:8px;
    background:var(--accent); color:#170A14; font-weight:700; font-size:11.5px;
  }
  .ed-mode.insert{ background:var(--green); }
  .ed-cmd{ color:var(--text); }

  .toast{
    position:fixed; right:18px; bottom:18px; z-index:200;
    background:var(--panel); border:1px solid var(--green);
    border-left-width:3px; border-radius:6px;
    padding:11px 15px; font-size:13px; max-width:320px;
    box-shadow:0 6px 26px rgba(0,0,0,.5);
    opacity:0; transform:translateY(8px); pointer-events:none;
    transition:opacity .22s, transform .22s;
  }
  .toast.show{ opacity:1; transform:none; }
  .toast b{ color:var(--green); }

  /* ---------- responsive ---------- */
  @media (max-width:1180px){ .lesson{ width:380px; } }
  @media (max-width:960px){
    body{ overflow:auto; height:auto; }
    .app{ flex-direction:column; }
    .rail{
      width:100%; height:auto; display:flex; overflow-x:auto;
      border-right:0; border-bottom:1px solid var(--border); padding:8px;
    }
    .rail h4{ display:none; }
    .mbtn{ width:auto; white-space:nowrap; border-left:0; border-radius:6px; }
    .mbtn.active{ border-left:0; background:var(--panel-2); }
    .mbtn .lbl{ display:none; }
    .lesson{ width:100%; border-right:0; border-bottom:1px solid var(--border); }
    .term-wrap{ height:76vh; }
  }
  @media (prefers-reduced-motion:reduce){ *{ transition:none !important; } }
</style>

<script>
"use strict";

/* ==========================================================================
   1. Virtual filesystem
   ========================================================================== */

const USER = 'munim', HOST = 'ulearn', GROUP = 'munim';
const HOME = '/home/' + USER;

let FS, CWD, ENV, HISTORY = [], hidx = 0, PREV = HOME;

function D(children, mode){ return { t:'d', mode: mode||0o755, owner:USER, group:GROUP, mtime:Date.now(), children: children||{} }; }
function F(content, mode){ return { t:'f', mode: mode==null?0o644:mode, owner:USER, group:GROUP, mtime:Date.now(), content: content==null?'':content }; }
function L(target){ return { t:'l', mode:0o777, owner:USER, group:GROUP, mtime:Date.now(), target }; }

function seedFS(){
  FS = D({
    bin: D({ bash:F('',0o755), ls:F('',0o755), cat:F('',0o755), grep:F('',0o755) }, 0o755),
    etc: D({
      hostname: F('ulearn\n'),
      hosts: F('127.0.0.1\tlocalhost\n127.0.1.1\tulearn\n'),
      passwd: F('root:x:0:0:root:/root:/bin/bash\nmunim:x:1000:1000:Munim:/home/munim:/bin/bash\n'),
      os_release: F('NAME="Ubuntu"\nVERSION="24.04.1 LTS"\nID=ubuntu\n')
    }, 0o755),
    home: D({
      munim: D({
        '.bashrc': F('# ~/.bashrc\nalias ll="ls -l"\nalias la="ls -a"\nexport EDITOR=nano\n'),
        '.profile': F('# ~/.profile\n'),
        documents: D({
          'notes.txt': F('Remember to water the plants.\nBuy milk.\nFinish the linux course.\n'),
          'todo.md': F('# Todo\n- [x] learn cd\n- [ ] learn find\n- [ ] learn permissions\n'),
          reports: D({
            'q1.csv': F('month,sales,region\njan,120,north\nfeb,340,south\nmar,210,north\napr,90,south\n'),
            'q2.csv': F('month,sales,region\nmay,410,north\njun,180,south\n')
          })
        }),
        projects: D({
          website: D({
            'index.html': F('<h1>Hello</h1>\n'),
            'style.css': F('body { margin: 0; }\n'),
            'deploy.sh': F('#!/bin/bash\necho "deploying..."\n', 0o755)
          }),
          'README.md': F('# Projects\nScratch space for experiments.\n')
        }),
        downloads: D({
          'archive.tar.gz': F('␀binary␀'),
          'photo.jpg': F('␀binary␀'),
          'script.sh': F('#!/bin/bash\necho hi\n', 0o644)
        }),
        'log.txt': F('INFO  server started\nWARN  disk usage 81%\nERROR connection refused\nINFO  retry scheduled\nERROR timeout after 30s\nINFO  recovered\n')
      })
    }, 0o755),
    root: D({}, 0o700),
    tmp: D({}, 0o1777),
    usr: D({ bin: D({ python3:F('',0o755), node:F('',0o755), git:F('',0o755) }), share: D({ doc: D({}) }), local: D({ bin: D({}) }) }),
    var: D({ log: D({ 'syslog': F('Aug 12 10:22:01 ulearn systemd[1]: Started Daily apt.\nAug 12 10:31:44 ulearn kernel: [  0.00] Linux version 6.8.0\n') }), tmp: D({}) }),
    opt: D({}),
    dev: D({ null: F(''), zero: F(''), random: F('') }),
    proc: D({ cpuinfo: F('model name : Virtual CPU @ 2.40GHz\ncores : 4\n'), meminfo: F('MemTotal: 8123456 kB\nMemFree: 3211004 kB\n') })
  }, 0o755);
  CWD = HOME;
  PREV = HOME;
  ENV = { HOME, USER, SHELL:'/bin/bash', PWD:CWD, PATH:'/usr/local/bin:/usr/bin:/bin', LANG:'en_US.UTF-8', EDITOR:'nano', TERM:'xterm-256color' };
}

/* ---------- path handling ---------- */

function normalize(p){
  const abs = p.startsWith('/');
  const out = [];
  for(const part of p.split('/')){
    if(!part || part === '.') continue;
    if(part === '..'){ if(out.length) out.pop(); continue; }
    out.push(part);
  }
  return (abs ? '/' : '') + out.join('/');
}

function absolute(p){
  if(!p) return CWD;
  if(p === '~') return HOME;
  if(p.startsWith('~/')) p = HOME + p.slice(1);
  if(!p.startsWith('/')) p = CWD + '/' + p;
  return normalize(p) || '/';
}

/**
 * Walk a path. Symlinks in the middle are always followed; the final component
 * is followed only when `followFinal` is true — that difference is why
 * `ls -l link` shows the link but `cd link` enters the target.
 */
function walk(path, followFinal, depth){
  depth = depth || 0;
  if(depth > 40) return { err:'ELOOP' };
  const abs = absolute(path);
  if(abs === '/') return { node:FS, parent:null, name:'/', path:'/' };

  const parts = abs.split('/').filter(Boolean);
  let node = FS, parent = null, cur = '';

  for(let i=0;i<parts.length;i++){
    const name = parts[i];
    const last = i === parts.length - 1;
    if(node.t === 'l'){
      const r = walk(node.target.startsWith('/') ? node.target : cur + '/' + node.target, true, depth+1);
      if(r.err) return r;
      node = r.node;
    }
    if(node.t !== 'd') return { err:'ENOTDIR', path:cur };
    const child = node.children[name];
    if(!child) return { err:'ENOENT', parent:node, name, path:cur + '/' + name };
    parent = node;
    cur = cur + '/' + name;
    node = child;
    if(last && node.t === 'l' && followFinal){
      const r = walk(node.target.startsWith('/') ? node.target : cur.replace(/\/[^/]*$/,'') + '/' + node.target, true, depth+1);
      if(r.err) return { err:r.err, parent, name, path:cur, broken:true };
      return { node:r.node, parent, name, path:cur, viaLink:true };
    }
  }
  return { node, parent, name: parts[parts.length-1], path: abs };
}

const exists = p => !walk(p, true).err;
function getNode(p, follow){ const r = walk(p, follow !== false); return r.err ? null : r.node; }

function mkParents(abs){
  const parts = abs.split('/').filter(Boolean);
  let node = FS;
  for(const part of parts){
    if(node.t !== 'd') return null;
    if(!node.children[part]) node.children[part] = D({});
    node = node.children[part];
  }
  return node;
}

/* ---------- formatting ---------- */

function modeStr(node){
  const t = node.t === 'd' ? 'd' : node.t === 'l' ? 'l' : '-';
  const m = node.mode;
  let s = '';
  for(let i=2;i>=0;i--){
    const bits = (m >> (i*3)) & 7;
    s += (bits & 4 ? 'r' : '-') + (bits & 2 ? 'w' : '-') + (bits & 1 ? 'x' : '-');
  }
  return t + s;
}
function sizeOf(node){
  if(node.t === 'd') return 4096;
  if(node.t === 'l') return node.target.length;
  return node.content.length;
}
function isExec(node){ return node.t === 'f' && (node.mode & 0o111); }
function dateStr(ms){
  const d = new Date(ms);
  const M = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][d.getMonth()];
  return M + ' ' + String(d.getDate()).padStart(2,' ') + ' ' +
    String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
}
function humanSize(n){
  if(n < 1024) return n + '';
  const u = ['K','M','G','T'];
  let i = -1; while(n >= 1024 && i < 3){ n /= 1024; i++; }
  return (n < 10 ? n.toFixed(1) : Math.round(n)) + u[i];
}
function esc(s){ return String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }

function colorName(name, node){
  if(node.t === 'd') return `<span class="dir">${esc(name)}</span>`;
  if(node.t === 'l') return `<span class="lnk">${esc(name)}</span>`;
  if(isExec(node)) return `<span class="exe">${esc(name)}</span>`;
  return esc(name);
}
function shortPath(p){ return p === HOME ? '~' : p.startsWith(HOME + '/') ? '~' + p.slice(HOME.length) : p; }

/* ==========================================================================
   2. Command implementations
   ========================================================================== */

const OK = out => ({ out: out == null ? '' : out, code:0 });
const ERR = (msg, code) => ({ out:'', err:msg, code: code == null ? 1 : code });

/** Expand a glob pattern against the filesystem. */
function glob(pattern){
  if(!/[*?\[]/.test(pattern)) return [pattern];
  const abs = absolute(pattern);
  const dirPart = abs.replace(/\/[^/]*$/, '') || '/';
  const base = abs.slice(dirPart.length).replace(/^\//,'');
  const dir = getNode(dirPart, true);
  if(!dir || dir.t !== 'd') return [pattern];
  const rx = new RegExp('^' + base
    .replace(/[.+^${}()|\\]/g, '\\$&')
    .replace(/\*/g, '[^/]*')
    .replace(/\?/g, '[^/]')
    + '$');
  const hits = Object.keys(dir.children)
    .filter(n => rx.test(n) && (base.startsWith('.') || !n.startsWith('.')))
    .sort()
    .map(n => pattern.includes('/') ? pattern.replace(/[^/]*$/, n) : n);
  return hits.length ? hits : [pattern];
}

function readFileAt(p, cmd){
  const r = walk(p, true);
  if(r.err === 'ENOENT') return { e:`${cmd}: ${p}: No such file or directory` };
  if(r.err) return { e:`${cmd}: ${p}: Not a directory` };
  if(r.node.t === 'd') return { e:`${cmd}: ${p}: Is a directory` };
  return { s: r.node.content };
}

/** stdin-or-files helper used by the text tools. */
function inputText(args, stdin, cmd){
  if(args.length){
    const parts = [];
    for(const a of args){
      const r = readFileAt(a, cmd);
      if(r.e) return { e:r.e };
      parts.push(r.s);
    }
    return { s: parts.join('') };
  }
  return { s: stdin || '' };
}

def('ls', {
  cat:'nav', desc:'list directory contents',
  usage:'ls [-l -a -h -R -t -r] [path...]',
  man:'Lists what is in a directory.\n\n  -l  long format: permissions, links, owner, group, size, date\n  -a  include hidden entries (names beginning with a dot)\n  -h  human-readable sizes, e.g. 4.0K instead of 4096\n  -R  recurse into subdirectories\n  -t  sort by modification time, newest first\n  -r  reverse the sort\n\nColour here means something: purple is a directory, cyan is a symlink, green is executable.',
  ex:['ls','ls -l','ls -la','ls -lh /etc','ls documents'],
  run:(a,f)=>{
    const targets = a.length ? a : ['.'];
    const chunks = [];
    for(const t of targets){
      // `ls -l link` describes the LINK; plain `ls link` follows it. That is
      // real ls behaviour, and it is the whole point of the symlink module.
      const r = walk(t, !f.l);
      if(r.err) { chunks.push(`<span class="err">ls: cannot access '${esc(t)}': No such file or directory</span>`); continue; }
      if(r.node.t === 'l'){ chunks.push(longLine(t, r.node, f)); continue; }
      let listing;
      if(r.node.t === 'd'){
        let names = Object.keys(r.node.children);
        if(!f.a) names = names.filter(n => !n.startsWith('.'));
        names.sort();
        if(f.t) names.sort((x,y)=> r.node.children[y].mtime - r.node.children[x].mtime);
        if(f.r) names.reverse();
        listing = renderList(names, r.node, f, r.path);
      } else {
        listing = f.l ? longLine(r.name, r.node, f) : colorName(t, r.node);
      }
      chunks.push((targets.length > 1 && r.node.t === 'd' ? `${esc(t)}:\n` : '') + listing);
      if(f.R && r.node.t === 'd') chunks.push(recurse(r.node, r.path, f));
    }
    return OK(chunks.filter(Boolean).join('\n') + '\n');
  }
});

function longLine(name, node, f){
  const size = f.h ? humanSize(sizeOf(node)) : String(sizeOf(node));
  const links = node.t === 'd' ? 2 + Object.values(node.children).filter(c=>c.t==='d').length : 1;
  return `${modeStr(node)} ${String(links).padStart(2)} ${node.owner.padEnd(6)} ${node.group.padEnd(6)} ${size.padStart(6)} ${dateStr(node.mtime)} ` +
    colorName(name, node) + (node.t === 'l' ? ` <span class="dim">-&gt;</span> ${esc(node.target)}` : '');
}
function renderList(names, dir, f){
  if(!names.length) return '';
  if(f.l){
    const total = names.reduce((s,n)=> s + Math.ceil(sizeOf(dir.children[n])/1024)*4, 0);
    return `total ${total}\n` + names.map(n => longLine(n, dir.children[n], f)).join('\n');
  }
  return names.map(n => colorName(n, dir.children[n])).join('  ');
}
function recurse(dir, path, f){
  const out = [];
  for(const n of Object.keys(dir.children).sort()){
    const c = dir.children[n];
    if(c.t === 'd' && (f.a || !n.startsWith('.'))){
      const p = (path === '/' ? '' : path) + '/' + n;
      let names = Object.keys(c.children);
      if(!f.a) names = names.filter(x=>!x.startsWith('.'));
      out.push(`\n${esc(p)}:\n` + renderList(names.sort(), c, f));
      out.push(recurse(c, p, f));
    }
  }
  return out.filter(Boolean).join('\n');
}

def('tree', {
  cat:'nav', desc:'show a directory as an indented tree',
  usage:'tree [path]',
  man:'Draws the directory structure as a tree. Not installed by default on most systems — you would apt install tree — but it is the fastest way to understand an unfamiliar project.',
  ex:['tree','tree projects'],
  run:(a,f)=>{
    const r = walk(a[0] || '.', true);
    if(r.err) return ERR(`tree: ${a[0]}: No such file or directory`);
    let dirs=0, files=0;
    function draw(node, prefix){
      const names = Object.keys(node.children).filter(n=>f.a||!n.startsWith('.')).sort();
      return names.map((n,i)=>{
        const last = i === names.length-1;
        const c = node.children[n];
        c.t==='d' ? dirs++ : files++;
        const line = prefix + (last?'└── ':'├── ') + colorName(n,c) + (c.t==='l'?` <span class="dim">-&gt;</span> ${esc(c.target)}`:'');
        return line + (c.t==='d' ? '\n' + draw(c, prefix + (last?'    ':'│   ')) : '');
      }).filter(Boolean).join('\n');
    }
    const body = r.node.t === 'd' ? draw(r.node, '') : '';
    return OK(`<span class="dir">${esc(a[0]||'.')}</span>\n` + (body?body+'\n':'') +
      `\n${dirs} director${dirs===1?'y':'ies'}, ${files} file${files===1?'':'s'}\n`);
  }
});

function deepCopy(node){
  if(node.t === 'f') return F(node.content, node.mode);
  if(node.t === 'l') return L(node.target);
  const c = D({}, node.mode);
  for(const k of Object.keys(node.children)) c.children[k] = deepCopy(node.children[k]);
  return c;
}

def('cp', {
  cat:'write', desc:'copy files and directories',
  usage:'cp [-r] source... dest',
  man:'Copies source to destination.\n\n  -r  recursive — required to copy a directory\n\nIf the destination is an existing directory, the sources are copied into it. Otherwise the destination is the new name. cp overwrites silently, so cp -i (interactive) exists for when that matters.',
  ex:['cp notes.txt backup.txt','cp -r projects projects-backup','cp a.txt b.txt documents/'],
  run:(a,f)=>{
    if(a.length < 2) return ERR('cp: missing destination file operand');
    const dest = a[a.length-1], srcs = a.slice(0,-1);
    const dr = walk(dest, true);
    const intoDir = dr.node && dr.node.t === 'd';
    if(srcs.length > 1 && !intoDir) return ERR(`cp: target '${dest}' is not a directory`);
    for(const s of srcs){
      const sr = walk(s, false);
      if(sr.err) return ERR(`cp: cannot stat '${s}': No such file or directory`);
      if(sr.node.t === 'd' && !f.r) return ERR(`cp: -r not specified; omitting directory '${s}'`);
      if(intoDir){ dr.node.children[sr.name] = deepCopy(sr.node); }
      else {
        if(!dr.parent && dr.err) return ERR(`cp: cannot create regular file '${dest}': No such file or directory`);
        const p = dr.parent || walk(dest, false).parent;
        if(!p) return ERR(`cp: cannot create '${dest}'`);
        p.children[dr.name || walk(dest,false).name] = deepCopy(sr.node);

def('ln', {
  cat:'link', desc:'create links between files',
  usage:'ln [-s] target linkname',
  man:'Creates a link.\n\n  ln -s target name   symbolic link (a signpost)\n  ln target name      hard link (a second real name)\n\nA SYMBOLIC link stores a path as text. Follow it and you land on the target. Delete or move the target and the link still exists but points at nothing — a "broken" or "dangling" link. It can cross filesystems and can point at directories.\n\nA HARD link is a second directory entry for the same underlying data. Both names are equally real; deleting one leaves the other perfectly intact, because the data lives until the last name is gone. Hard links cannot cross filesystems and normally cannot point at directories.\n\nThe order trips everyone up: target first, new name second — the same order as cp.',
  ex:['ln -s /var/log/syslog logs','ln -s ../shared/config.json config.json','ln notes.txt notes-hard.txt'],
  run:(a,f)=>{
    if(a.length < 1) return ERR('ln: missing file operand');
    const target = a[0];
    let name = a[1] || target.replace(/.*\//,'');
    const nr = walk(name, false);
    let parent = nr.parent, base = nr.name;
    if(nr.node && nr.node.t === 'd'){ parent = nr.node; base = target.replace(/.*\//,''); }
    else if(nr.node) return ERR(`ln: failed to create link '${name}': File exists`);
    if(!parent) return ERR(`ln: failed to create link '${name}': No such file or directory`);
    if(f.s){ parent.children[base] = L(target); return OK(); }
    const tr = walk(target, true);
    if(tr.err) return ERR(`ln: failed to access '${target}': No such file or directory`);
    if(tr.node.t === 'd') return ERR(`ln: ${target}: hard link not allowed for directory`);
    parent.children[base] = tr.node;   // same object == same data, like a real hard link
    return OK();
  }
});

def('readlink', {
  cat:'link', desc:'print what a symbolic link points at',
  usage:'readlink [-f] link',
  man:'Prints the target stored inside a symbolic link, without following it. readlink -f resolves the whole chain and prints the final absolute path, which is useful when links point at links.',

    if(!a[0]) return ERR('readlink: missing operand');

      // Follow the whole chain and report where it actually lands. walk()

        p = t.startsWith('/') ? t : normalize(p.replace(/\/[^/]*$/,'') + '/' + t);

    }

/* ---------- permissions ---------- */

def('chmod', {
  cat:'perm', desc:'change file permissions',
  usage:'chmod MODE path...',
  man:'Sets who may read, write and execute a file.\n\nOCTAL form: three digits for owner, group, other.\n  4 = read, 2 = write, 1 = execute — add them together.\n  chmod 755 = rwxr-xr-x   owner everything, everyone else read+execute\n  chmod 644 = rw-r--r--   owner read+write, everyone else read\n  chmod 600 = rw-------   owner only\n\nSYMBOLIC form: who (u,g,o,a) then + - = then what (r,w,x).\n  chmod +x script.sh      make executable for everyone\n  chmod u+w,go-w file     owner can write, nobody else\n\nOn a DIRECTORY the bits mean something different: r lists the names, w creates and deletes entries, and x lets you enter it and reach what is inside. A directory you can read but not execute is nearly useless.',
  ex:['chmod +x downloads/script.sh','chmod 644 notes.txt','chmod 700 private','chmod u+w,go-rwx secret.txt'],
  run:(a)=>{
    if(a.length < 2) return ERR('chmod: missing operand');
    const spec = a[0];
    for(const p of a.slice(1)){
      const r = walk(p, true);
      if(r.err) return ERR(`chmod: cannot access '${p}': No such file or directory`);
      if(/^[0-7]{3,4}$/.test(spec)){ r.node.mode = parseInt(spec, 8); continue; }
      const m = spec.match(/^([ugoa]*)([+\-=])([rwx]+)$/);
      if(!m){
        const multi = spec.split(',');
        if(multi.length > 1){ for(const s of multi) CMDS.chmod.run([s, p], {}, {}); continue; }
        return ERR(`chmod: invalid mode: '${spec}'`);
      }
      let who = m[1] || 'a', op = m[2], perms = m[3];
      let mask = 0;
      for(const c of perms) mask |= c === 'r' ? 4 : c === 'w' ? 2 : 1;
      let full = 0;
      if(who.includes('a')) who = 'ugo';
      if(who.includes('u')) full |= mask << 6;
      if(who.includes('g')) full |= mask << 3;
      if(who.includes('o')) full |= mask;
      if(op === '+') r.node.mode |= full;
      else if(op === '-') r.node.mode &= ~full;
      else r.node.mode = full;
    }
    return OK();
  }
});

def('chown', {
  cat:'perm', desc:'change the owner of a file',

  ex:['chown munim notes.txt','sudo chown root:root /etc/hosts'],

});

def('grep', {
  cat:'text', desc:'search for lines matching a pattern',
  usage:'grep [-i -n -v -c -r] pattern [file...]',
  man:'Prints every line that matches a pattern. Probably the most-used command on any Unix system.\n\n  -i  ignore case\n  -n  show line numbers\n  -v  invert — show lines that do NOT match\n  -c  count matches instead of printing them\n  -r  search recursively through a directory\n\nThe pattern is a regular expression, so grep "^ERROR" anchors to the start of the line and grep "e$" to the end.',
  ex:['grep ERROR log.txt','grep -i error log.txt','grep -n WARN log.txt','grep -v INFO log.txt','grep -r sales documents'],
  run:(a,f,ctx)=>{
    if(!a.length) return ERR('usage: grep [OPTION]... PATTERN [FILE]...');
    const pat = a[0], files = a.slice(1);
    let rx; try{ rx = new RegExp(pat, f.i ? 'i' : ''); }catch(e){ return ERR(`grep: invalid pattern`); }
    const hits = [];
    const scan = (text, label) => {
      text.replace(/\n$/,'').split('\n').forEach((line, i) => {
        if(line === '' && !text) return;
        const m = rx.test(line);
        if(f.v ? !m : m){
          const shown = f.v ? esc(line) : esc(line).replace(new RegExp(pat, f.i?'gi':'g'), s=>`<span class="hl">${s}</span>`);
          hits.push((label?`<span class="dim">${esc(label)}:</span>`:'') + (f.n?`<span class="dim">${i+1}:</span>`:'') + shown);
        }
      });
    };
    if(f.r && files.length){
      const walkDir = (node, path) => {
        for(const n of Object.keys(node.children).sort()){
          const c = node.children[n], p = path + '/' + n;
          if(c.t === 'd') walkDir(c, p);
          else if(c.t === 'f' && !c.content.includes('␀')) scan(c.content, p.replace(/^\//,''));
        }
      };
      for(const d of files){
        const r = walk(d, true);
        if(r.err) return ERR(`grep: ${d}: No such file or directory`);
        r.node.t === 'd' ? walkDir(r.node, absolute(d)) : scan(r.node.content, d);
      }
    } else if(files.length){
      for(const p of files){
        const r = readFileAt(p, 'grep');
        if(r.e) return ERR(r.e);
        scan(r.s, files.length > 1 ? p : '');
      }
    } else scan(ctx.stdin || '', '');
    if(f.c) return OK(hits.length + '\n');
    return { out: hits.length ? hits.join('\n') + '\n' : '', code: hits.length ? 0 : 1 };
  }
});

def('sort', {
  cat:'text', desc:'sort lines',
  usage:'sort [-r -n -u] [file]',
  man:'Sorts lines alphabetically by default.\n\n  -n  numerically — so 10 comes after 9, not before it\n  -r  reverse\n  -u  unique — drop duplicates\n\nAlphabetic sorting of numbers is a classic bug: "10" sorts before "9" because it compares character by character. That is what -n fixes.',
  ex:['sort notes.txt','sort -r notes.txt','sort -n numbers.txt','sort -u names.txt'],
  run:(a,f,ctx)=>{
    const r = inputText(a, ctx.stdin, 'sort');
    if(r.e) return ERR(r.e);
    let lines = r.s.replace(/\n$/,'').split('\n');
    lines.sort(f.n ? (x,y)=>parseFloat(x)-parseFloat(y) : (x,y)=>x.localeCompare(y));
    if(f.r) lines.reverse();
    if(f.u) lines = lines.filter((l,i)=>i===0||l!==lines[i-1]);
    return OK(lines.join('\n') + '\n');
  }
});

def('uniq', {
  cat:'text', desc:'collapse repeated adjacent lines',
  usage:'uniq [-c] [file]',
  man:'Removes duplicate lines — but only when they are ADJACENT. That is why you almost always see sort | uniq together: sort brings duplicates next to each other so uniq can see them.\n\n  -c  prefix each line with how many times it occurred',
  ex:['sort names.txt | uniq','sort names.txt | uniq -c'],
  run:(a,f,ctx)=>{
    const r = inputText(a, ctx.stdin, 'uniq');
    if(r.e) return ERR(r.e);
    const lines = r.s.replace(/\n$/,'').split('\n');
    const out = [];
    for(const l of lines){
      if(out.length && out[out.length-1].l === l) out[out.length-1].n++;
      else out.push({ l, n:1 });
    }
    return OK(out.map(o => f.c ? `${String(o.n).padStart(7)} ${o.l}` : o.l).join('\n') + '\n');
  }
});

def('tr', {
  cat:'text', desc:'translate or delete characters',
  usage:'tr SET1 SET2',
  man:'Replaces every character in SET1 with the matching one in SET2. Works only on standard input, so it is always used in a pipe.\n\n  tr a-z A-Z     uppercase everything\n  tr -d " "      delete all spaces',
  ex:['cat notes.txt | tr a-z A-Z','echo "a b c" | tr -d " "'],
  run:(a,f,ctx)=>{
    let s = ctx.stdin || '';
    const expand = set => set.replace(/(.)-(.)/g, (m,x,y)=>{
      let out=''; for(let c=x.charCodeAt(0); c<=y.charCodeAt(0); c++) out += String.fromCharCode(c); return out;
    });
    if(f.d){ const del = expand(a[0]||''); return OK([...s].filter(c=>!del.includes(c)).join('')); }
    const from = expand(a[0]||''), to = expand(a[1]||'');
    return OK([...s].map(c => { const i = from.indexOf(c); return i>=0 ? (to[i]||to[to.length-1]||c) : c; }).join(''));
  }
});

def('sed', {
  cat:'text', desc:'edit a stream of text with a script',
  usage:"sed 's/find/replace/[g]' [file]",
  man:'A stream editor: it applies an edit to every line as text flows past.\n\n  sed \'s/old/new/\'    replace the FIRST match on each line\n  sed \'s/old/new/g\'   replace every match (g = global)\n  sed \'s/old/new/gi\'  ignore case too\n\nBy default sed prints the result and leaves the file untouched. With -i it edits the file in place, which is powerful and unforgiving.',
  ex:["sed 's/ERROR/PROBLEM/' log.txt","sed 's/o/0/g' notes.txt"],
  run:(a,f,ctx)=>{
    const script = a[0] || '';
    const m = script.match(/^s(.)(.*?)\1(.*?)\1([gi]*)$/);
    if(!m) return ERR(`sed: -e expression #1, char ${script.length}: unterminated 's' command`);
    const r = inputText(a.slice(1), ctx.stdin, 'sed');
    if(r.e) return ERR(r.e);
    const rx = new RegExp(m[2], m[4].includes('g') ? 'g' + (m[4].includes('i')?'i':'') : (m[4].includes('i')?'i':''));
    const out = r.s.split('\n').map(l => l.replace(rx, m[3])).join('\n');
    if(f.i && a[1]){ const t = walk(a[1], true); if(t.node) t.node.content = out; return OK(); }
    return OK(out);
  }
});

def('awk', {
  cat:'text', val:'F', desc:'process text field by field',
  usage:"awk '{print $N}' [file]",
  man:'A small programming language for text. It splits each line into fields ($1, $2, …; $0 is the whole line) and runs your program on every line.\n\n  awk \'{print $1}\'            first field of each line\n  awk -F, \'{print $2}\'        comma-separated instead of whitespace\n  awk \'{print $1, $3}\'        two fields\n\nThis simulator supports the common print form. Real awk also does patterns, arithmetic and BEGIN/END blocks.',
  ex:["awk '{print $1}' log.txt","awk -F, '{print $2}' documents/reports/q1.csv"],

def('tee', {

def('diff', {
  cat:'text', desc:'show what differs between two files',
  usage:'diff file1 file2',
  man:'Compares two files line by line and prints only what changed. Lines prefixed < come from the first file, > from the second. This is the same idea git uses to show changes.',

  run:(a)=>{
    if(a.length<2) return ERR('diff: missing operand');
    const A = readFileAt(a[0],'diff'), B = readFileAt(a[1],'diff');

def('find', {
  cat:'find', desc:'search the directory tree',
  usage:'find [path] [-name PATTERN] [-type f|d] [-size +N]',
  man:'Walks a directory tree and prints everything matching your tests. Unlike most commands, its options are full words with a single dash.\n\n  -name "*.txt"   match the filename (quote it, or the shell expands it first)\n  -type f         files only;  -type d  directories only\n  -size +100k     larger than 100k\n\n  find . -name "*.log"           every .log under here\n  find /etc -type d              every directory under /etc\n\nThe classic mistake is forgetting the quotes around a pattern: without them the shell expands *.txt itself before find ever sees it.',
  ex:['find . -name "*.txt"','find . -type d','find documents -name "q*"'],
  run:(a)=>{
    let start = '.', name = null, type = null;
    for(let i=0;i<a.length;i++){
      if(a[i] === '-name') name = a[++i];
      else if(a[i] === '-type') type = a[++i];
      else if(!a[i].startsWith('-')) start = a[i];
    }
    const r = walk(start, true);
    if(r.err) return ERR(`find: '${start}': No such file or directory`);
    const rx = name ? new RegExp('^' + name.replace(/[.+^${}()|\\]/g,'\\$&').replace(/\*/g,'.*').replace(/\?/g,'.') + '$') : null;
    const out = [];
    const base = start === '.' ? '.' : start.replace(/\/$/,'');
    (function rec(node, path, nm){
      const typeOk = !type || (type === 'f' && node.t === 'f') || (type === 'd' && node.t === 'd') || (type === 'l' && node.t === 'l');
      if((!rx || rx.test(nm)) && typeOk) out.push(path);
      if(node.t === 'd') for(const n of Object.keys(node.children).sort()) rec(node.children[n], path + '/' + n, n);
    })(r.node, base, base.replace(/.*\//,''));
    return OK(out.join('\n') + (out.length?'\n':''));
  }
});

def('ps', {

  usage:'ps [aux]',
  man:'Shows a snapshot of running processes. Every process has a PID — a number you need in order to signal or kill it.\n\n  ps        just your processes in this terminal\n  ps aux    everything on the system, the form people actually use\n\nps aux | grep something is the standard way to find a process by name.',

def('kill', {
  cat:'proc', desc:'send a signal to a process',
  usage:'kill [-9] PID',
  man:'Despite the name, kill sends a SIGNAL — by default SIGTERM (15), which politely asks a process to shut down and lets it clean up.\n\n  kill 1337      ask nicely (SIGTERM)\n  kill -9 1337   SIGKILL: the kernel destroys it immediately\n\nAlways try plain kill first. SIGKILL cannot be caught, so the process gets no chance to save state or release resources.',

def('date', { cat:'sys', desc:'show the current date and time', usage:'date',

/* ==========================================================================
   3. The shell
   ========================================================================== */

function expandVars(s){
  return s.replace(/\$\{(\w+)\}|\$(\w+)/g, (m,a,b)=> ENV[a||b] != null ? ENV[a||b] : '');
}

/** Split a line into tokens, honouring quotes. */
function tokenize(line){
  const out = [];
  let cur = '', q = null, had = false;
  for(let i=0;i<line.length;i++){
    const c = line[i];
    if(q){
      if(c === q){ q = null; had = true; }
      else cur += c;
    } else if(c === '"' || c === "'"){ q = c; had = true; }
    else if(/\s/.test(c)){ if(cur || had){ out.push({ v:cur, quoted:had }); cur=''; had=false; } }
    else cur += c;
  }
  if(cur || had) out.push({ v:cur, quoted:had });
  return out;
}

/** Pull redirections out of a token list. */
function extractRedirects(tokens){
  const args = [], red = {};
  for(let i=0;i<tokens.length;i++){
    const t = tokens[i];
    if(!t.quoted && (t.v === '>' || t.v === '>>' || t.v === '<' || t.v === '2>')){
      const target = tokens[++i];
      if(!target) return { err:'syntax error near unexpected token `newline\'' };
      if(t.v === '<') red.in = target.v;
      else if(t.v === '2>') red.errFile = target.v;
      else { red.out = target.v; red.append = t.v === '>>'; }
      continue;
    }
    const m = !t.quoted && t.v.match(/^(.*?)(>>|>)(.+)$/);
    if(m && m[1] === ''){ red.out = m[3]; red.append = m[2] === '>>'; continue; }
    args.push(t);
  }
  return { args, red };
}

/**
 * `val` lists flags of THIS command that take a value, so `head -n 2` consumes
 * the 2 instead of treating it as a filename. It has to be per-command: -f in
 * `cut -f2` takes a value, but the f in `tar -czf` does not.
 */
function parseFlags(tokens, val){
  val = val || '';
  const flags = {}, rest = [];
  let noMore = false;
  for(let ti=0; ti<tokens.length; ti++){
    const t = tokens[ti];
    if(!noMore && !t.quoted && /^-[A-Za-z]/.test(t.v) && t.v !== '-'){
      // find/ps style long options are passed through as plain args
      if(/^-(name|type|size|exec|print0|maxdepth)$/.test(t.v)){ rest.push(t); continue; }
      const body = t.v.slice(1);
      for(let i=0;i<body.length;i++){
        const ch = body[i];
        const tail = body.slice(i+1);
        if(val.includes(ch)){
          if(tail){ flags[ch] = tail; i = body.length; }
          else if(tokens[ti+1]) flags[ch] = tokens[++ti].v;
          else flags[ch] = true;
        }
        else if('ndfF'.includes(ch) && tail){ flags[ch] = tail; i = body.length; }
        else flags[ch] = true;
      }
      continue;
    }
    if(!noMore && t.v === '--'){ noMore = true; continue; }
    rest.push(t);
  }
  return { flags, rest };
}

/** Run one simple command (no pipes / no chaining). */
function runSimple(cmdline, stdin){
  let tokens = tokenize(cmdline);
  if(!tokens.length) return OK();

  const rd = extractRedirects(tokens);
  if(rd.err) return ERR('bash: ' + rd.err);
  tokens = rd.args;
  if(!tokens.length) return OK();

  const name = tokens[0].v;
  const cmd = CMDS[name];
  if(!cmd) return ERR(`${name}: command not found`, 127);

  const { flags, rest } = parseFlags(tokens.slice(1), cmd.val);

  // expand variables and globs on unquoted arguments
  let args = [];
  for(const t of rest){
    const v = t.quoted ? t.v : expandVars(t.v);
    if(!t.quoted) args.push(...glob(v));
    else args.push(v);
  }
  // numeric flags for head/tail written as -3
  for(const k of Object.keys(flags)) if(/^\d+$/.test(k)) flags.n = k;

  if(rd.red.in){
    const r = readFileAt(rd.red.in, name);
    if(r.e) return ERR(`bash: ${rd.red.in}: No such file or directory`);
    stdin = r.s;
  }

  let res;
  try{ res = cmd.run(args, flags, { stdin: stdin || '' }); }
  catch(e){ return ERR(`${name}: ${e.message}`); }
  if(!res) res = OK();

  if(rd.red.out){
    const text = stripTags(res.out || '');
    const r = walk(rd.red.out, true);
    if(r.node && r.node.t === 'd') return ERR(`bash: ${rd.red.out}: Is a directory`);
    if(r.node) r.node.content = rd.red.append ? r.node.content + text : text;
    else if(r.parent) r.parent.children[r.name] = F(text);
    else return ERR(`bash: ${rd.red.out}: No such file or directory`);
    res = { out:'', err:res.err, code:res.code, clear:res.clear };
  }
  if(rd.red.errFile && res.err){
    const r = walk(rd.red.errFile, true);
    if(r.node) r.node.content = res.err + '\n';
    else if(r.parent) r.parent.children[r.name] = F(res.err + '\n');
    res = { out:res.out, code:res.code };
  }
  return res;
}

function stripTags(s){
  return String(s).replace(/<[^>]*>/g,'')
    .replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>');
}

/** Run a full line: pipes, &&, ||, ; */
function runLine(line){
  const segments = [];
  let buf = '', q = null;
  for(let i=0;i<line.length;i++){
    const c = line[i];
    if(q){ buf += c; if(c===q) q=null; continue; }
    if(c === '"' || c === "'"){ q = c; buf += c; continue; }
    if(c === ';'){ segments.push({ cmd:buf, op:';' }); buf=''; continue; }
    if(c === '&' && line[i+1] === '&'){ segments.push({ cmd:buf, op:'&&' }); buf=''; i++; continue; }
    if(c === '|' && line[i+1] === '|'){ segments.push({ cmd:buf, op:'||' }); buf=''; i++; continue; }
    buf += c;
  }
  segments.push({ cmd:buf, op:null });

  let out = '', lastCode = 0, prevOp = null, clear = false;
  for(const seg of segments){
    if(prevOp === '&&' && lastCode !== 0){ prevOp = seg.op; continue; }
    if(prevOp === '||' && lastCode === 0){ prevOp = seg.op; continue; }
    const r = runPipeline(seg.cmd.trim());
    if(r.clear) clear = true;
    if(r.out) out += r.out;
    if(r.err) out += `<span class="err">${esc(r.err)}</span>\n`;
    lastCode = r.code;
    prevOp = seg.op;
  }
  return { out, code:lastCode, clear };
}

function runPipeline(text){
  if(!text) return OK();
  const parts = [];
  let buf = '', q = null;
  for(let i=0;i<text.length;i++){
    const c = text[i];
    if(q){ buf += c; if(c===q) q=null; continue; }
    if(c === '"' || c === "'"){ q=c; buf += c; continue; }
    if(c === '|'){ parts.push(buf); buf=''; continue; }
    buf += c;
  }
  parts.push(buf);

  let stdin = '', res = OK();
  for(let i=0;i<parts.length;i++){
    res = runSimple(parts[i].trim(), stdin);
    if(res.err && i < parts.length-1) return res;
    stdin = stripTags(res.out || '');
  }
  return res;
}

/* ==========================================================================
   4. Terminal UI
   ========================================================================== */

const screen = document.getElementById('screen');
const input  = document.getElementById('cmdin');

function ps1(){
  return `<span class="prompt">${USER}@${HOST}</span>:<span class="path">${esc(shortPath(CWD))}</span><span class="prompt">$</span> `;
}
function syncPrompt(){
  document.getElementById('ps1').innerHTML = ps1();
  document.getElementById('termTitle').textContent = `${USER}@${HOST}: ${shortPath(CWD)}`;
}
function write(html){
  const d = document.createElement('div');
  d.innerHTML = html;
  screen.appendChild(d);
  screen.scrollTop = screen.scrollHeight;
}

function submit(line){
  write(ps1() + `<span class="cmd">${esc(line)}</span>`);
  if(line.trim()){
    HISTORY.push(line);
    hidx = HISTORY.length;
    const r = runLine(line.trim());
    if(r.clear) screen.innerHTML = '';
    else if(r.out) write(r.out.replace(/\n$/,''));
  }
  syncPrompt();
  screen.scrollTop = screen.scrollHeight;
  checkTasks(line.trim());
}

input.addEventListener('keydown', e => {
  if(e.key === 'Enter'){
    const v = input.value;
    input.value = '';
    submit(v);
    e.preventDefault();
  } else if(e.key === 'ArrowUp'){
    if(hidx > 0){ hidx--; input.value = HISTORY[hidx]; }
    e.preventDefault();
  } else if(e.key === 'ArrowDown'){
    if(hidx < HISTORY.length-1){ hidx++; input.value = HISTORY[hidx]; }
    else { hidx = HISTORY.length; input.value = ''; }
    e.preventDefault();
  } else if(e.key === 'Tab'){
    e.preventDefault();
    complete();
  } else if(e.key === 'l' && e.ctrlKey){
    e.preventDefault(); screen.innerHTML = '';
  } else if(e.key === 'c' && e.ctrlKey){
    write(ps1() + `<span class="cmd">${esc(input.value)}</span>^C`);
    input.value = '';
  }
});

function complete(){
  const v = input.value;
  const m = v.match(/(\S*)$/);
  const frag = m[1];
  const before = v.slice(0, v.length - frag.length);
  let pool;
  if(!before.trim()){
    pool = Object.keys(CMDS).filter(c => c.startsWith(frag));
  } else {
    const slash = frag.lastIndexOf('/');
    const dirPart = slash >= 0 ? frag.slice(0, slash+1) : '';
    const base = slash >= 0 ? frag.slice(slash+1) : frag;
    const d = getNode(dirPart || '.', true);
    if(!d || d.t !== 'd') return;
    pool = Object.keys(d.children)
      .filter(n => n.startsWith(base) && (base.startsWith('.') || !n.startsWith('.')))
      .map(n => dirPart + n + (d.children[n].t === 'd' ? '/' : ''));
  }
  if(!pool.length) return;
  if(pool.length === 1){ input.value = before + pool[0]; return; }
  // longest common prefix, then show the options
  let pre = pool[0];
  for(const p of pool) while(!p.startsWith(pre)) pre = pre.slice(0,-1);
  if(pre.length > frag.length) input.value = before + pre;
  else { write(ps1() + `<span class="cmd">${esc(v)}</span>`); write(pool.join('  ')); }
}

document.querySelector('.term-wrap').addEventListener('click', e => {
  if(!window.getSelection().toString()) input.focus();

/* ==========================================================================
   4b. Editors — nano and vim
   ========================================================================== */

const ED = {
  open:false, kind:'nano', path:'', node:null, parent:null, name:'',
  dirty:false, mode:'normal', cmd:null, pendingExit:false
};
const edEl   = document.getElementById('ed');
const edText = document.getElementById('edText');
const edTop  = document.getElementById('edTop');
const edMsg  = document.getElementById('edMsg');
const edKeys = document.getElementById('edKeys');
const edGut  = document.getElementById('edGut');

function edGutter(){
  const n = edText.value.split('\n').length;
  edGut.textContent = Array.from({length:n}, (_,i)=>i+1).join('\n');
}
edText.addEventListener('input', ()=>{ ED.dirty = true; edGutter(); edChrome(); });
edText.addEventListener('scroll', ()=>{ edGut.style.transform = `translateY(${-edText.scrollTop}px)`; });

function openEditor(kind, path){
  const abs = absolute(path);
  const r = walk(abs, true);
  if(r.node && r.node.t === 'd') return ERR(`${kind}: ${path}: Is a directory`);
  if(!r.node && !r.parent) return ERR(`${kind}: ${path}: No such file or directory`);

  ED.open = true; ED.kind = kind; ED.path = path;
  ED.node = r.node || null; ED.parent = r.parent || null; ED.name = r.name;
  ED.dirty = false; ED.pendingExit = false;
  ED.mode = kind === 'nano' ? 'insert' : 'normal';
  ED.cmd = null;

  edText.value = r.node ? r.node.content : '';
  edEl.classList.add('open');
  edEl.classList.toggle('ed-vim', kind !== 'nano');
  edGutter(); edChrome();
  setTimeout(()=>{ edText.focus(); edText.setSelectionRange(0,0); }, 0);
  return OK();
}

function edSave(){
  const text = edText.value;
  if(ED.node) ED.node.content = text;
  else if(ED.parent){ ED.parent.children[ED.name] = F(text); ED.node = ED.parent.children[ED.name]; }
  ED.node.mtime = Date.now();
  ED.dirty = false;
  return text.split('\n').length;
}

function closeEditor(msg){
  ED.open = false;
  edEl.classList.remove('open');
  edMsg.textContent = '';
  const p = document.getElementById('cmdin');
  if(msg) write(msg);
  syncPrompt();
  p.focus();
  checkTasks('');
}

function edChrome(){
  if(ED.kind === 'nano'){
    edTop.textContent = `  GNU nano 7.2      ${ED.path}${ED.dirty ? '                    Modified' : ''}`;
    edKeys.innerHTML = [
      ['^O','Write Out'], ['^X','Exit'], ['^K','Cut Line'], ['^W','Where Is']
    ].map(([k,l])=>`<span><b>${k}</b>${l}</span>`).join('');
  } else {
    const m = ED.mode === 'insert' ? 'INSERT' : ED.cmd !== null ? 'COMMAND' : 'NORMAL';
    edTop.innerHTML = `<span class="ed-mode ${ED.mode==='insert'?'insert':''}">${m}</span>` +
      `<span style="color:var(--muted)">"${esc(ED.path)}" ${ED.dirty?'[+]':''}</span>`;
    edKeys.innerHTML = ED.mode === 'insert'
      ? `<span><b>Esc</b>back to normal mode</span>`
      : [['i','insert'],[':w','write'],[':q','quit'],[':wq','write &amp; quit'],[':q!','quit, discard']]
          .map(([k,l])=>`<span><b>${k}</b>${l}</span>`).join('');
  }
}

document.addEventListener('keydown', e => {
  if(!ED.open) return;

  /* ---------- nano ---------- */
  if(ED.kind === 'nano'){
    if(e.ctrlKey && e.key.toLowerCase() === 'o'){
      e.preventDefault();
      const n = edSave();
      edMsg.textContent = `[ Wrote ${n} line${n===1?'':'s'} ]`;
      edChrome();
      return;
    }
    if(e.ctrlKey && e.key.toLowerCase() === 'x'){
      e.preventDefault();
      if(ED.dirty && !ED.pendingExit){
        ED.pendingExit = true;
        edMsg.textContent = 'Save modified buffer?  Y Yes   N No   ^C Cancel';
        return;
      }
      closeEditor();
      return;
    }
    if(ED.pendingExit){
      if(/^[yY]$/.test(e.key)){ e.preventDefault(); const n = edSave(); closeEditor(`<span class="dim">[ Wrote ${n} lines to ${esc(ED.path)} ]</span>`); return; }
      if(/^[nN]$/.test(e.key)){ e.preventDefault(); closeEditor(); return; }
      if(e.ctrlKey && e.key.toLowerCase() === 'c'){ e.preventDefault(); ED.pendingExit = false; edMsg.textContent = 'Cancelled'; return; }
    }
    if(e.ctrlKey && e.key.toLowerCase() === 'k'){
      e.preventDefault();
      const v = edText.value, pos = edText.selectionStart;
      const s = v.lastIndexOf('\n', pos-1) + 1;
      let end = v.indexOf('\n', pos); if(end === -1) end = v.length; else end++;
      edText.value = v.slice(0,s) + v.slice(end);
      edText.setSelectionRange(s,s);
      ED.dirty = true; edGutter(); edChrome();
      return;
    }
    return;
  }

  /* ---------- vim ---------- */
  if(ED.mode === 'insert'){
    if(e.key === 'Escape'){ e.preventDefault(); ED.mode = 'normal'; edText.blur(); edChrome(); edMsg.textContent=''; }
    return;
  }

  // NORMAL mode: the textarea must not receive the keystrokes
  e.preventDefault();

  if(ED.cmd !== null){
    if(e.key === 'Enter'){
      const c = ED.cmd.trim();
      ED.cmd = null;
      if(c === ':w'){ const n = edSave(); edMsg.textContent = `"${ED.path}" ${n}L written`; edChrome(); return; }
      if(c === ':wq' || c === ':x'){ const n = edSave(); closeEditor(`<span class="dim">"${esc(ED.path)}" ${n}L written</span>`); return; }
      if(c === ':q'){
        if(ED.dirty){ edMsg.textContent = 'E37: No write since last change (add ! to override)'; edChrome(); return; }
        closeEditor(); return;
      }
      if(c === ':q!'){ closeEditor(); return; }
      edMsg.textContent = `E492: Not an editor command: ${c.slice(1)}`;
      edChrome();
      return;
    }
    if(e.key === 'Escape'){ ED.cmd = null; edMsg.textContent = ''; edChrome(); return; }
    if(e.key === 'Backspace'){ ED.cmd = ED.cmd.slice(0,-1); if(!ED.cmd) ED.cmd = null; }
    else if(e.key.length === 1) ED.cmd += e.key;
    edMsg.innerHTML = `<span class="ed-cmd">${esc(ED.cmd || '')}</span>`;
    return;
  }

  if(e.key === ':'){ ED.cmd = ':'; edMsg.innerHTML = '<span class="ed-cmd">:</span>'; edChrome(); return; }
  if(e.key === 'i'){ ED.mode = 'insert'; edChrome(); edText.focus(); return; }
  if(e.key === 'a'){ ED.mode = 'insert'; edChrome(); edText.focus(); edText.setSelectionRange(edText.selectionStart+1, edText.selectionStart+1); return; }
  if(e.key === 'o'){
    const v = edText.value, pos = edText.selectionStart;
    let end = v.indexOf('\n', pos); if(end === -1) end = v.length;
    edText.value = v.slice(0,end) + '\n' + v.slice(end);
    ED.mode = 'insert'; ED.dirty = true; edGutter(); edChrome();
    edText.focus(); edText.setSelectionRange(end+1, end+1);
    return;
  }
  if(e.key === 'x'){
    const v = edText.value, p = edText.selectionStart;
    edText.value = v.slice(0,p) + v.slice(p+1);
    ED.dirty = true; edGutter(); edChrome(); return;
  }
  edMsg.textContent = '';
});

def('nano', {
  cat:'write', desc:'edit a file in a friendly terminal editor',
  usage:'nano file',
  man:'A straightforward text editor. It opens with the file loaded and you simply type — no modes to worry about.\n\nThe shortcuts are printed along the bottom, where ^ means Ctrl:\n\n  Ctrl-O   write the file out (save)\n  Ctrl-X   exit — it asks whether to save if you changed anything\n  Ctrl-K   cut the current line\n  Ctrl-W   search\n\nnano is the right default when you just need to change a config file. It is installed nearly everywhere, and nothing about it is surprising.',
  ex:['nano notes.txt','nano newfile.txt'],
  run:(a)=>{
    if(!a[0]) return ERR('Usage: nano [OPTIONS] [[+LINE[,COLUMN]] FILE]...');
    return openEditor('nano', a[0]);
  }
});

def('vim', {
  cat:'write', desc:'edit a file in the modal editor you will meet on every server',
  usage:'vim file',
  man:'vim is MODAL: keystrokes mean different things depending on the mode, which is why it confuses everyone the first time. You start in NORMAL mode, where letters are commands rather than text.\n\n  i        enter INSERT mode — now you are typing text\n  Esc      back to NORMAL mode\n  o        open a new line below and start inserting\n  x        delete the character under the cursor\n\nCommands begin with a colon, typed from NORMAL mode:\n\n  :w       write (save)\n  :q       quit — refuses if you have unsaved changes\n  :wq      write and quit\n  :q!      quit and throw away changes\n\nThe famous problem of being unable to exit is exactly this: you are in INSERT mode, so :q is being typed into the file. Press Esc first, then :q! and Enter.\n\nLearn this much even if you prefer nano. vi is on every Unix machine ever made, including minimal containers and rescue shells where nano is not installed.',
  ex:['vim notes.txt','vim config.conf'],
  run:(a)=>{
    if(!a[0]) return ERR('Usage: vim [file]');
    return openEditor('vim', a[0]);
  }
});
CMDS.vi = CMDS.vim;

/* ==========================================================================
   6. Lesson UI + progress
   ========================================================================== */

let mod = 0;
let track = { ran:new Set(), lines:[] };
let doneTasks = {};   // { moduleIndex: [bool,...] }

const PKEY = 'linux-terminal-progress';

async function loadProgress(){
  try{
    const r = await window.storage.get(PKEY);
    if(r && r.value){
      const p = JSON.parse(r.value);
      doneTasks = p.tasks || {};
      track.ran = new Set(p.ran || []);
      track.lines = p.lines || [];
    }
  }catch(e){ doneTasks = {}; }
  // A saved entry whose length no longer matches means the modules changed
  // underneath it (one was inserted or its tasks edited) — rebuild rather than
  // trust a misaligned array.
  MODULES.forEach((m,i)=>{
    if(!doneTasks[i] || doneTasks[i].length !== m.tasks.length) doneTasks[i] = m.tasks.map(()=>false);
  });
  renderRail(); renderLesson();
}
async function saveProgress(){
  try{
    await window.storage.set(PKEY, JSON.stringify({
      tasks: doneTasks, ran:[...track.ran], lines: track.lines.slice(-400)
    }));
  }catch(e){}
}

function modDone(i){ return doneTasks[i] && doneTasks[i].every(Boolean); }
function totalDone(){ return MODULES.filter((_,i)=>modDone(i)).length; }

function renderRail(){
  const el = document.getElementById('modList');
  el.innerHTML = '';
  MODULES.forEach((m,i)=>{
    const b = document.createElement('button');
    b.className = 'mbtn' + (i===mod?' active':'') + (modDone(i)?' done':'');
    b.innerHTML = `<span class="dot">✓</span><span class="n">${String(i+1).padStart(2,'0')}</span><span class="lbl">${esc(m.t)}</span>`;
    b.onclick = ()=>{ mod = i; renderRail(); renderLesson(); document.querySelector('.lesson').scrollTop = 0; };
    el.appendChild(b);
  });
  const d = totalDone();
  document.getElementById('pfill').style.width = (d/MODULES.length*100)+'%';
  document.getElementById('ptxt').textContent = `${d} / ${MODULES.length}`;
  Progress.report(d, MODULES.length);
}

function renderLesson(){
  const m = MODULES[mod];
  const el = document.getElementById('lesson');
  let h = `<div class="eyebrow">Module ${String(mod+1).padStart(2,'0')}</div><h1>${esc(m.t)}</h1><p class="lead">${esc(m.lead)}</p>`;
  m.blocks.forEach((b,i)=>{
    h += `<h2><span class="ix">${String(i+1).padStart(2,'0')}</span>${esc(b.h)}</h2>`;
    (b.p||[]).forEach(p=> h += `<p>${p}</p>`);
    if(b.demo) h += `<div class="demo">${b.demo}</div>`;
    if(b.tip) h += `<div class="tip${b.tip.warn?' warn':''}"><b>${esc(b.tip.b)}:</b> ${esc(b.tip.t)}</div>`;
  });

  h += `<div class="tasks"><div class="tasks-h">Practice — run these in the terminal</div>`;
  m.tasks.forEach((t,i)=>{
    const done = doneTasks[mod][i];
    h += `<div class="task${done?' done':''}"><span class="box">✓</span><span class="txt">${t.txt}<span class="task-hint">${esc(t.hint)}</span></span></div>`;
  });
  h += `</div>`;

  h += `<div class="navrow">
    <button class="btn" id="prevM"${mod===0?' disabled':''}>← Previous</button>
    <span class="sp"></span>
    <button class="btn" id="nextM"${mod===MODULES.length-1?' disabled':''}>Next module →</button>
  </div>`;
  el.innerHTML = h;
  const p = document.getElementById('prevM'), n = document.getElementById('nextM');
  if(p) p.onclick = ()=>{ mod--; renderRail(); renderLesson(); el.scrollTop=0; };
  if(n) n.onclick = ()=>{ mod++; renderRail(); renderLesson(); el.scrollTop=0; };
}

function checkTasks(line){
  if(line){
    track.lines.push(line);
    track.ran.add(line.split(/\s+/)[0]);
    // also record every command used across a pipeline
    line.split(/[|;]|&&/).forEach(seg=>{ const w = seg.trim().split(/\s+/)[0]; if(w) track.ran.add(w); });
  }
  let changed = false;
  MODULES.forEach((m,mi)=>{
    m.tasks.forEach((t,ti)=>{
      if(doneTasks[mi][ti]) return;
      let ok = false;
      try{ ok = !!t.check(track); }catch(e){ ok = false; }
      if(ok){ doneTasks[mi][ti] = true; changed = true; if(mi === mod) toast(t.txt); }
    });
  });
  if(changed){ saveProgress(); renderRail(); renderLesson(); }
}

let toastTimer;
function toast(txt){
  const el = document.getElementById('toast');
  el.innerHTML = `<b>✓ Task complete</b><br>${txt.replace(/<code>/g,'<code>')}`;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>el.classList.remove('show'), 2600);
}

/* ---------- boot ---------- */

document.getElementById('resetFs').onclick = ()=>{
  seedFS(); syncPrompt();
  screen.innerHTML = '';
  banner();
};

function banner(){
  write(`<span class="dim">Ubuntu 24.04.1 LTS  ·  simulated shell, entirely in your browser</span>`);
  write(`<span class="dim">Type</span> <span class="ok">help</span> <span class="dim">for the command list, or</span> <span class="ok">man &lt;command&gt;</span> <span class="dim">for a manual page.</span>\n`);
}

seedFS();
syncPrompt();
banner();
loadProgress();
input.focus();
