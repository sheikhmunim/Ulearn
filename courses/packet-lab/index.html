<script>
"use strict";

/* ==========================================================================
   1. Network model
   ========================================================================== */

let NET;

function seedNet(){
  NET = {
    hosts: {
      client: {
        name:'client', kind:'host', subnet:'a',
        ifaces:{ eth0:{ ip:'10.0.1.10', prefix:24, up:true, mac:'02:1a:00:00:01:0a' } },
        routes:[{ dst:'default', via:'10.0.1.1', dev:'eth0' }],
        listeners:{}, firewall:{ policyIn:'allow', rules:[] },
        resolver:'10.0.1.53', hosts:{ 'localhost':'127.0.0.1' }, forwarding:false
      },
      dns: {
        name:'dns', kind:'host', subnet:'a',
        ifaces:{ eth0:{ ip:'10.0.1.53', prefix:24, up:true, mac:'02:1a:00:00:01:35' } },
        routes:[{ dst:'default', via:'10.0.1.1', dev:'eth0' }],
        listeners:{ 53:{ proto:'udp', app:'named' } },
        firewall:{ policyIn:'allow', rules:[] },
        resolver:'127.0.0.1', hosts:{}, forwarding:false
      },
      router: {
        name:'router', kind:'router', subnet:'both',
        ifaces:{
          eth0:{ ip:'10.0.1.1', prefix:24, up:true, mac:'02:1a:00:00:01:01' },
          eth1:{ ip:'10.0.2.1', prefix:24, up:true, mac:'02:1a:00:00:02:01' }
        },
        routes:[], listeners:{ 22:{ proto:'tcp', app:'sshd' } },
        firewall:{ policyIn:'allow', rules:[] },
        resolver:'10.0.1.53', hosts:{}, forwarding:true
      },
      server: {
        name:'server', kind:'host', subnet:'b',
        ifaces:{ eth0:{ ip:'10.0.2.20', prefix:24, up:true, mac:'02:1a:00:00:02:14' } },
        routes:[{ dst:'default', via:'10.0.2.1', dev:'eth0' }],
        listeners:{ 22:{ proto:'tcp', app:'sshd' } },
        firewall:{ policyIn:'allow', rules:[] },
        resolver:'10.0.1.53', hosts:{}, forwarding:false
      },
      laptop: {
        // deliberately unconfigured — module 6 is about bringing it online
        name:'laptop', kind:'host', subnet:'b',
        ifaces:{ eth0:{ ip:null, prefix:null, up:false, mac:'02:1a:00:00:02:63' } },
        routes:[], listeners:{}, firewall:{ policyIn:'allow', rules:[] },
        resolver:'10.0.1.53', hosts:{}, forwarding:false
      }
    },
    zone: {
      'api.example.com':'10.0.2.20',
      'www.example.com':'10.0.2.20',
      'router.local':'10.0.1.1',
      'ghost.example.com':'10.0.2.99'   // resolves, but nothing is there
    }
  };
}

/* ---------- addressing ---------- */

function ipToInt(ip){
  const p = String(ip).split('.').map(Number);
  if(p.length !== 4 || p.some(n => !(n>=0 && n<=255))) return null;
  return ((p[0]<<24)>>>0) + (p[1]<<16) + (p[2]<<8) + p[3];
}
function sameSubnet(a, b, prefix){
  const A = ipToInt(a), B = ipToInt(b);
  if(A === null || B === null) return false;
  const mask = prefix === 0 ? 0 : (0xFFFFFFFF << (32-prefix)) >>> 0;
  return ((A & mask) >>> 0) === ((B & mask) >>> 0);
}
function networkOf(ip, prefix){
  const A = ipToInt(ip);
  const mask = (0xFFFFFFFF << (32-prefix)) >>> 0;
  const n = (A & mask) >>> 0;
  return [(n>>>24)&255, (n>>>16)&255, (n>>>8)&255, n&255].join('.') + '/' + prefix;
}
function hostByIP(ip){
  for(const h of Object.values(NET.hosts))
    for(const i of Object.values(h.ifaces))
      if(i.ip === ip && i.up) return h;
  return null;
}
function upIfaces(h){ return Object.entries(h.ifaces).filter(([,i]) => i.up && i.ip); }

/* ---------- the delivery engine ---------- */

/**
 * Try to move a packet from `src` to `dstIP`.
 * Returns { ok, path:[hostnames], status, detail }
 *
 * status is the thing the whole course turns on:
 *   'delivered'  something answered
 *   'refused'    reached the host, nothing listening  -> RST
 *   'timeout'    silently dropped: firewall, or nobody at that address
 *   'unreach'    the sending host has no route at all
 */
function deliver(src, dstIP, port, proto){
  const path = [src.name];
  const ifs = upIfaces(src);
  if(!ifs.length) return { ok:false, path, status:'unreach', detail:'no interface is up' };

  // loopback / self
  if(dstIP === '127.0.0.1' || ifs.some(([,i]) => i.ip === dstIP)){
    return checkPort(src, path, port, proto, true);
  }

  // 1. connected subnet?
  let egress = ifs.find(([,i]) => sameSubnet(i.ip, dstIP, i.prefix));
  let nextIP = dstIP, viaGw = false;

  // 2. otherwise consult the routing table
  if(!egress){
    const def = src.routes.find(r => r.dst === 'default');
    const spec = src.routes.find(r => r.dst !== 'default' && r.prefix != null && sameSubnet(r.dst, dstIP, r.prefix));
    const use = spec || def;
    if(!use) return { ok:false, path, status:'unreach', detail:'no route to host' };
    nextIP = use.via; viaGw = true;
    egress = ifs.find(([n]) => n === use.dev) || ifs.find(([,i]) => sameSubnet(i.ip, use.via, i.prefix));
    if(!egress) return { ok:false, path, status:'unreach', detail:`gateway ${use.via} is not on any connected subnet` };
    if(!sameSubnet(egress[1].ip, use.via, egress[1].prefix))
      return { ok:false, path, status:'unreach', detail:`gateway ${use.via} is unreachable from ${egress[1].ip}` };
  }

  // 3. who is at the next hop?
  const next = hostByIP(nextIP);
  if(!next) return { ok:false, path, status:'timeout', detail:`nothing answered at ${nextIP}` };

  if(!viaGw) { path.push(next.name); return checkFwThenPort(next, path, port, proto, src); }

  // 4. through the router
  path.push(next.name);
  if(!next.forwarding)
    return { ok:false, path, status:'timeout', detail:`${next.name} is not forwarding packets` };
  const fw = firewallVerdict(next, port, proto);
  if(fw !== 'allow')
    return { ok:false, path, status: fw === 'reject' ? 'refused' : 'timeout', detail:`blocked by ${next.name} firewall` };

  const onward = upIfaces(next).find(([,i]) => sameSubnet(i.ip, dstIP, i.prefix));
  if(!onward) return { ok:false, path, status:'unreach', detail:`${next.name} has no route to ${dstIP}` };

  const dest = hostByIP(dstIP);
  if(!dest) return { ok:false, path, status:'timeout', detail:`nothing answered at ${dstIP}` };
  path.push(dest.name);
  return checkFwThenPort(dest, path, port, proto, src);
}

function firewallVerdict(h, port, proto){
  if(port == null) {
    const icmp = h.firewall.rules.find(r => r.proto === 'icmp');
    return icmp ? icmp.action : h.firewall.policyIn === 'deny' ? 'deny' : 'allow';
  }
  const rule = h.firewall.rules.find(r => r.port === port && (!r.proto || r.proto === proto || r.proto === 'tcp'));
  if(rule) return rule.action;
  return h.firewall.policyIn === 'deny' ? 'deny' : 'allow';
}

function checkFwThenPort(h, path, port, proto){
  const v = firewallVerdict(h, port, proto);
  if(v === 'deny')   return { ok:false, path, status:'timeout', detail:`dropped by ${h.name} firewall` };
  if(v === 'reject') return { ok:false, path, status:'refused', detail:`rejected by ${h.name} firewall` };
  return checkPort(h, path, port, proto);
}

function checkPort(h, path, port, proto){
  if(port == null) return { ok:true, path, status:'delivered', detail:'icmp echo reply' };
  const l = h.listeners[port];
  if(!l) return { ok:false, path, status:'refused', detail:`nothing is listening on port ${port}` };
  return { ok:true, path, status:'delivered', detail:l.app, app:l };
}

/** Resolve a name using /etc/hosts, then the configured resolver. */
function resolve(host, name){
  if(ipToInt(name)) return { ip:name, how:'literal' };
  if(host.hosts[name]) return { ip:host.hosts[name], how:'/etc/hosts' };
  if(!host.resolver) return { err:'no resolver configured' };
  if(host.resolver === '127.0.0.1' && host.name === 'dns'){
    return NET.zone[name] ? { ip:NET.zone[name], how:'local zone' } : { err:'NXDOMAIN' };
  }
  const r = deliver(host, host.resolver, 53, 'udp');
  if(!r.ok) return { err:`resolver ${host.resolver} unreachable (${r.status})`, net:r };
  return NET.zone[name] ? { ip:NET.zone[name], how:'dns ' + host.resolver } : { err:'NXDOMAIN' };
}

/* ==========================================================================
   2. Commands
   ========================================================================== */

const OK  = o => ({ out: o == null ? '' : o });
const BAD = e => ({ out:'', err:e });

const C = {};
function def(n, s){ C[n] = s; }

def('help', {
  desc:'list every command', usage:'help',
  man:'Lists the commands available on this host. Use man <command> for detail.',
  run:()=>{
    const groups = {
      iface:'Interfaces & addressing', route:'Routing', diag:'Reachability',
      sock:'Sockets & services', name:'Name resolution', fw:'Firewall', misc:'Other'
    };
    let s = '<span class="a">Commands on this host</span>\n<span class="d">man &lt;command&gt; for detail. Each terminal is a different machine — check the selector above.</span>\n';
    for(const [k,label] of Object.entries(groups)){
      const ns = Object.keys(C).filter(n=>C[n].cat===k).sort();
      if(!ns.length) continue;
      s += `\n<span class="ok">${label}</span>\n`;
      for(const n of ns) s += `  ${n.padEnd(12)}<span class="d">${C[n].desc}</span>\n`;
    }
    return OK(s);
  }
});

def('man', {
  cat:'misc', desc:'read the manual for a command', usage:'man command',
  man:'Shows the manual entry for a command, including what its output actually means.',
  run:(a)=>{
    const c = C[a[0]];
    if(!a[0]) return BAD('What manual page do you want?');
    if(!c) return BAD(`No manual entry for ${a[0]}`);
    let s = `<span class="w">NAME</span>\n       ${a[0]} — ${c.desc}\n\n<span class="w">SYNOPSIS</span>\n       ${esc(c.usage)}\n\n<span class="w">DESCRIPTION</span>\n`;
    s += c.man.split('\n').map(l=>'       '+esc(l)).join('\n');
    if(c.ex) s += `\n\n<span class="w">EXAMPLES</span>\n` + c.ex.map(e=>`       <span class="ok">$</span> ${esc(e)}`).join('\n');
    return OK(s+'\n');
  }
});

def('ip', {
  cat:'iface', desc:'show and configure addresses, links and routes',
  usage:'ip addr | ip route | ip link set dev X up|down | ip addr add IP/PREFIX dev X | ip route add default via GW',
  man:'The modern tool for everything address- and route-related. It replaced ifconfig and route, which still exist but are frozen.\n\n  ip addr                       show interfaces and their addresses\n  ip route                      show the routing table\n  ip link set dev eth0 up       bring an interface up\n  ip addr add 10.0.2.63/24 dev eth0\n  ip route add default via 10.0.2.1\n\nAn interface with no address, or one that is DOWN, cannot send anything — and that is the first thing to check when nothing works.',
  ex:['ip addr','ip route','ip link set dev eth0 up','ip addr add 10.0.2.63/24 dev eth0','ip route add default via 10.0.2.1'],
  run:(a,h)=>{
    const sub = a[0] || '';
    if(/^a(ddr)?$/.test(sub) && !a[1]){
      let s = '';
      let i = 1;
      s += `${i}: lo: &lt;LOOPBACK,UP&gt; mtu 65536\n    inet 127.0.0.1/8 scope host lo\n`;
      for(const [n,f] of Object.entries(h.ifaces)){
        i++;
        s += `${i}: ${n}: &lt;BROADCAST,MULTICAST${f.up?',UP,LOWER_UP':''}&gt; mtu 1500 state <span class="${f.up?'ok':'e'}">${f.up?'UP':'DOWN'}</span>\n`;
        s += `    link/ether ${f.mac}\n`;
        if(f.ip) s += `    inet <span class="a">${f.ip}/${f.prefix}</span> brd + scope global ${n}\n`;
        else s += `    <span class="d">(no address assigned)</span>\n`;
      }
      return OK(s);
    }
    if(/^r(oute)?$/.test(sub) && !a[1]){
      if(!h.routes.length && !upIfaces(h).length) return OK('<span class="d">(routing table is empty)</span>\n');
      let s = '';
      for(const r of h.routes)
        s += r.dst === 'default'
          ? `default via <span class="a">${r.via}</span> dev ${r.dev}\n`
          : `${r.dst}/${r.prefix} via ${r.via} dev ${r.dev}\n`;
      for(const [n,f] of upIfaces(h))
        s += `${networkOf(f.ip,f.prefix)} dev ${n} proto kernel scope link src ${f.ip}\n`;
      return OK(s);
    }
    if(/^l(ink)?$/.test(sub) && a[1] === 'set'){
      const dev = a[a.indexOf('dev')+1] || a[2];
      const want = a.includes('up') ? true : a.includes('down') ? false : null;
      const f = h.ifaces[dev];
      if(!f) return BAD(`Cannot find device "${dev}"`);
      if(want === null) return BAD('ip: expected up or down');
      f.up = want; drawTopo();
      return OK('');
    }
    if(/^a(ddr)?$/.test(sub) && (a[1] === 'add' || a[1] === 'del')){
      const spec = a[2] || '';
      const dev = a[a.indexOf('dev')+1];
      const f = h.ifaces[dev];
      if(!f) return BAD(`Cannot find device "${dev}"`);
      if(a[1] === 'del'){ f.ip = null; f.prefix = null; drawTopo(); return OK(''); }
      const m = spec.match(/^(\d+\.\d+\.\d+\.\d+)\/(\d+)$/);
      if(!m) return BAD(`Error: any valid prefix is expected rather than "${spec}".`);
      if(ipToInt(m[1]) === null) return BAD(`Error: invalid address "${m[1]}".`);
      f.ip = m[1]; f.prefix = parseInt(m[2],10); drawTopo();
      return OK('');
    }
    if(/^r(oute)?$/.test(sub) && (a[1] === 'add' || a[1] === 'del')){
      const via = a[a.indexOf('via')+1];
      if(a[2] === 'default'){
        if(a[1] === 'del'){ h.routes = h.routes.filter(r=>r.dst!=='default'); return OK(''); }
        if(!via) return BAD('Error: an inet address is expected rather than "".');
        const dev = a.includes('dev') ? a[a.indexOf('dev')+1] : (upIfaces(h).find(([,f])=>sameSubnet(f.ip,via,f.prefix))||[])[0];
        if(!dev) return BAD(`Error: Nexthop has invalid gateway.`);
        h.routes = h.routes.filter(r=>r.dst!=='default');
        h.routes.push({ dst:'default', via, dev });
        return OK('');
      }
      const m = (a[2]||'').match(/^(\d+\.\d+\.\d+\.\d+)\/(\d+)$/);
      if(!m) return BAD('Error: an inet prefix is expected.');
      h.routes.push({ dst:m[1], prefix:parseInt(m[2],10), via, dev: a.includes('dev')?a[a.indexOf('dev')+1]:'eth0' });
      return OK('');
    }
    return BAD('Usage: ip [ addr | route | link ] ...');
  }
});

def('ifconfig', {

function maskOf(p){ const m=(0xFFFFFFFF<<(32-p))>>>0; return [(m>>>24)&255,(m>>>16)&255,(m>>>8)&255,m&255].join('.'); }

def('ping', {
  cat:'diag', desc:'test whether a host answers at all',
  usage:'ping HOST',
  man:'Sends ICMP echo requests and waits for replies. It answers exactly one question: can packets get there and back?\n\nWhat the failures mean:\n  "Destination Host Unreachable" — no route, or nothing at that address on our subnet\n  "Network is unreachable"       — this host has no route to that network at all\n  100% packet loss, no error     — something is silently dropping them. Usually a firewall.\n\nping proving a host is up does NOT mean the service on it works. Ports are a separate question — use nc or curl for that.',
  ex:['ping 10.0.2.20','ping api.example.com','ping 10.0.1.1'],
  run:(a,h)=>{
    if(!a[0]) return BAD('ping: usage error: Destination address required');
    const r = resolve(h, a[0]);
    if(r.err) return BAD(`ping: ${a[0]}: Name or service not known`);
    const d = deliver(h, r.ip, null, 'icmp');
    animate(d.path, d.ok);
    let s = `PING ${a[0]} (${r.ip}) 56(84) bytes of data.\n`;
    if(d.ok){
      for(let i=1;i<=3;i++) s += `64 bytes from ${r.ip}: icmp_seq=${i} ttl=${64-(d.path.length-2)} time=${(0.4+i*0.1).toFixed(1)} ms\n`;
      s += `\n--- ${a[0]} ping statistics ---\n3 packets transmitted, 3 received, <span class="ok">0% packet loss</span>\n`;
    } else if(d.status === 'unreach'){
      s += `<span class="e">connect: Network is unreachable</span>\n<span class="d">(${d.detail})</span>\n`;
    } else {
      s += `<span class="d">(no replies)</span>\n\n--- ${a[0]} ping statistics ---\n3 packets transmitted, 0 received, <span class="e">100% packet loss</span>\n<span class="d">(${d.detail})</span>\n`;
    }
    return OK(s);
  }
});

def('traceroute', {
  cat:'diag', desc:'show every hop along the way',
  usage:'traceroute HOST',
  man:'Reveals the path a packet takes, one router at a time. When something is unreachable, the last hop that answers tells you how far you got — which is usually enough to know whose problem it is.',
  ex:['traceroute 10.0.2.20','traceroute api.example.com'],
  run:(a,h)=>{
    const r = resolve(h, a[0]||'');
    if(r.err) return BAD(`traceroute: unknown host ${a[0]}`);
    const d = deliver(h, r.ip, null, 'icmp');
    animate(d.path, d.ok);
    let s = `traceroute to ${a[0]} (${r.ip}), 30 hops max\n`;
    const hops = d.path.slice(1);
    hops.forEach((n,i)=>{
      const host = NET.hosts[n];
      const ip = upIfaces(host)[0] ? upIfaces(host)[0][1].ip : '*';
      s += ` ${i+1}  ${n} (${ip})  ${(0.3+i*0.4).toFixed(3)} ms\n`;
    });
    if(!d.ok) s += ` ${hops.length+1}  <span class="e">* * *</span>  <span class="d">${d.detail}</span>\n`;
    return OK(s);
  }
});

def('ss', {

def('serve', {

  usage:'serve PORT [name]',
  man:'Starts a listener on this host — the simulator\'s stand-in for running a web server, database, or anything else that accepts connections.\n\n  serve 8080          listen on 8080\n  serve 80 nginx      give it a name\n\nA port with nothing listening is what produces "connection refused". Starting a listener here is what makes the difference visible.',

def('nc', {
  cat:'sock', desc:'open or test a TCP connection',
  usage:'nc [-z] [-v] HOST PORT   |   nc -l PORT',
  man:'Netcat: raw TCP in a single command, and the fastest way to answer "can I reach that port?"\n\n  nc -zv host 8080    just test the port and report (z = scan, v = verbose)\n  nc -l 8080          listen on a port\n\nThe two failures are the whole point:\n\n  Connection refused   — you REACHED the host. Nothing is listening. Routing and\n                         firewall are fine; the service is down or on another port.\n  Connection timed out — nothing answered at all. A firewall dropped it, the route\n                         is wrong, or the host is not there.\n\nRefused is good news. It proves the path works.',
  ex:['nc -zv 10.0.2.20 8080','nc -zv api.example.com 80','nc -l 9000'],
  run:(a,h)=>{
    if(a[0] === '-l' || (a.includes('-l'))){
      const p = parseInt(a[a.indexOf('-l')+1],10);
      if(!p) return BAD('nc: missing port number');
      if(h.listeners[p]) return BAD(`nc: Address already in use`);
      h.listeners[p] = { proto:'tcp', app:'nc' };
      return OK(`<span class="ok">Listening on 0.0.0.0 ${p}</span>\n`);
    }
    const args = a.filter(x=>!x.startsWith('-'));
    if(args.length < 2) return BAD('nc: usage: nc [-zv] hostname port');
    const r = resolve(h, args[0]);
    if(r.err) return BAD(`nc: getaddrinfo for host "${args[0]}" port ${args[1]}: ${r.err}`);
    const port = parseInt(args[1],10);
    const d = deliver(h, r.ip, port, 'tcp');
    animate(d.path, d.ok);
    if(d.ok)                    return OK(`<span class="ok">Connection to ${args[0]} ${port} port [tcp/*] succeeded!</span>\n<span class="d">(${d.detail} is listening)</span>\n`);
    if(d.status === 'refused')  return BAD(`nc: connect to ${args[0]} port ${port} (tcp) failed: Connection refused\n<span class="d">(${d.detail} — you reached the host, so the path is fine)</span>`);
    if(d.status === 'unreach')  return BAD(`nc: connect to ${args[0]} port ${port} (tcp) failed: Network is unreachable\n<span class="d">(${d.detail})</span>`);
    return BAD(`nc: connect to ${args[0]} port ${port} (tcp) failed: Connection timed out\n<span class="d">(${d.detail} — nothing answered, so it never got there)</span>`);
  }
});

def('curl', {
  cat:'sock', desc:'make an HTTP request',
  usage:'curl [-v] URL',
  man:'Fetches a URL. With -v it narrates every stage, which turns it into the best diagnostic tool you have:\n\n  1. resolve the name to an address\n  2. open a TCP connection to the port\n  3. send the request and read the reply\n\nEach stage fails differently, and -v tells you which one you are stuck on. "Could not resolve host" is DNS. "Connection refused" is TCP. A 502 is HTTP — you connected fine and the server itself is unhappy.',
  ex:['curl http://api.example.com','curl -v http://10.0.2.20:8080','curl http://10.0.2.20:8080'],
  run:(a,h,f)=>{
    const url = a.find(x=>!x.startsWith('-'));
    if(!url) return BAD('curl: try \'curl --help\' for more information');
    const m = url.match(/^(?:(https?):\/\/)?([^:/]+)(?::(\d+))?(\/.*)?$/);
    if(!m) return BAD(`curl: (3) URL using bad/illegal format`);
    const scheme = m[1]||'http', host = m[2], port = parseInt(m[3]||(scheme==='https'?443:80),10), path = m[4]||'/';
    let s = '';
    const v = f.v;
    const r = resolve(h, host);
    if(r.err){
      if(v) s += `<span class="d">* Host ${host}:${port} was resolved.</span>\n`;
      return BAD(s + `curl: (6) Could not resolve host: ${host}\n<span class="d">(${r.err} — this is a DNS problem, not a connectivity one)</span>`);
    }
    if(v) s += `<span class="d">* Host ${host}:${port} was resolved.\n* Trying ${r.ip}:${port}...</span>\n`;
    const d = deliver(h, r.ip, port, 'tcp');
    animate(d.path, d.ok);
    if(!d.ok){
      const why = d.status==='refused' ? 'Connection refused'
                : d.status==='unreach' ? 'Network is unreachable' : 'Connection timed out';
      const code = d.status==='refused' ? 7 : 28;
      return BAD(s + `curl: (${code}) Failed to connect to ${host} port ${port} after 0 ms: ${why}\n<span class="d">(${d.detail})</span>`);
    }
    if(v) s += `<span class="d">* Connected to ${host} (${r.ip}) port ${port}\n&gt; GET ${path} HTTP/1.1\n&gt; Host: ${host}\n&gt;\n&lt; HTTP/1.1 200 OK\n&lt; content-type: text/html\n&lt;</span>\n`;
    s += `<span class="ok">HTTP/1.1 200 OK</span>\n\n&lt;html&gt;&lt;body&gt;&lt;h1&gt;Hello from ${d.detail} on ${host}&lt;/h1&gt;&lt;/body&gt;&lt;/html&gt;\n`;
    return OK(s);
  }
});

def('dig', {
  cat:'name', desc:'query DNS directly',
  usage:'dig NAME',
  man:'Asks a DNS server to resolve a name and shows exactly what came back. Unlike ping, it does ONLY the lookup — so it separates "the name is wrong" from "the host is unreachable", which are constantly confused.\n\nRead the status line:\n  NOERROR   the name resolved. Check the ANSWER section for what it resolved TO.\n  NXDOMAIN  no such name exists.\n\nA name that resolves to the wrong address is far more common, and far more confusing, than one that does not resolve at all.',
  ex:['dig api.example.com','dig ghost.example.com','dig nothere.example.com'],
  run:(a,h)=>{
    const name = a[0];
    if(!name) return BAD('dig: no name specified');
    const r = resolve(h, name);
    let s = `; &lt;&lt;&gt;&gt; DiG 9.18 &lt;&lt;&gt;&gt; ${name}\n`;
    if(r.err && r.err.includes('unreachable'))
      return BAD(s + `;; communications error to ${h.resolver}#53: timed out\n<span class="d">(the resolver itself is unreachable — fix connectivity before blaming DNS)</span>`);
    if(r.err === 'NXDOMAIN')
      return OK(s + `;; -&gt;&gt;HEADER&lt;&lt;- opcode: QUERY, status: <span class="e">NXDOMAIN</span>\n\n;; QUESTION SECTION:\n;${name}.\t\tIN\tA\n\n<span class="d">;; no such name exists</span>\n`);
    if(r.err) return BAD(s + ';; ' + r.err);
    return OK(s + `;; -&gt;&gt;HEADER&lt;&lt;- opcode: QUERY, status: <span class="ok">NOERROR</span>\n\n;; QUESTION SECTION:\n;${name}.\t\tIN\tA\n\n;; ANSWER SECTION:\n${name}.\t300\tIN\tA\t<span class="a">${r.ip}</span>\n\n;; Query time: 2 msec\n;; SERVER: ${h.resolver}#53\n<span class="d">;; resolved via ${r.how}</span>\n`);
  }
});
def('nslookup', Object.assign({}, C.dig, { desc:'query DNS (older tool)', man:'An older DNS query tool. dig gives more detail and is what most people use now, but nslookup is on almost every machine including Windows.' }));

def('ufw', {
  cat:'fw', desc:'manage the firewall',
  usage:'ufw status | ufw allow PORT | ufw deny PORT | ufw reject PORT | ufw default deny|allow',
  man:'A friendly front end to the kernel firewall.\n\n  ufw status            what is currently allowed\n  ufw allow 8080        let that port through\n  ufw deny 8080         DROP silently  -> the client sees a TIMEOUT\n  ufw reject 8080       refuse politely -> the client sees CONNECTION REFUSED\n  ufw default deny      block everything not explicitly allowed\n\nThe deny/reject distinction is worth internalising. Dropping silently is the usual choice because it tells a scanner nothing — but it also means legitimate users see a long hang instead of an instant error, and that is exactly why "timed out" so often means "firewall".',
  ex:['ufw status','ufw deny 8080','ufw allow 8080','ufw default deny'],
  run:(a,h)=>{
    const sub = a[0];
    if(!sub || sub === 'status'){
      let s = `Status: <span class="${h.firewall.policyIn==='deny'?'w':'ok'}">active</span>\nDefault: ${h.firewall.policyIn} (incoming)\n\n`;
      if(!h.firewall.rules.length) return OK(s + '<span class="d">(no specific rules)</span>\n');
      s += 'To                Action\n--                ------\n';
      for(const r of h.firewall.rules)
        s += `${String(r.port||r.proto).padEnd(18)}<span class="${r.action==='allow'?'ok':'e'}">${r.action.toUpperCase()}</span>\n`;
      return OK(s);
    }
    if(sub === 'default'){
      const p = a[1];
      if(p !== 'deny' && p !== 'allow') return BAD('ufw: expected deny or allow');
      h.firewall.policyIn = p;
      return OK(`Default incoming policy changed to '${p}'\n`);
    }
    if(['allow','deny','reject'].includes(sub)){
      const target = a[1];
      if(!target) return BAD('ufw: missing port');
      const port = parseInt(target,10);
      h.firewall.rules = h.firewall.rules.filter(r => !(r.port === port) && !(target==='icmp' && r.proto==='icmp'));
      h.firewall.rules.push(target === 'icmp' ? { proto:'icmp', action:sub } : { port, action:sub, proto:'tcp' });
      return OK(`Rule added: ${sub} ${target}\n`);
    }
    return BAD('Usage: ufw status|allow|deny|reject|default');
  }
});

def('arp', { cat:'diag', desc:'show the local address table', usage:'arp -n',
  man:'Maps IP addresses to hardware addresses for machines on the SAME subnet. If an entry is missing or incomplete, the host never answered — which usually means it is off, or not on this subnet at all.',
  ex:['arp -n'],
  run:(a,h)=>{
    const mine = upIfaces(h);
    const rows = Object.values(NET.hosts).filter(o=>o!==h)
      .flatMap(o=>upIfaces(o).map(([,f])=>f))
      .filter(f=>mine.some(([,m])=>sameSubnet(m.ip,f.ip,m.prefix)));
    if(!rows.length) return OK('<span class="d">(no neighbours)</span>\n');
    return OK('Address        HWtype  HWaddress           Iface\n' +
      rows.map(f=>`${f.ip.padEnd(15)}ether   ${f.mac}   eth0`).join('\n')+'\n');
  } });

const LOG = [];
function logPkt(src, dst, msg){

const POS = {
  client:{ x:70,  y:42 },
  dns:   { x:70,  y:126 },
  router:{ x:250, y:84 },
  server:{ x:430, y:42 },
  laptop:{ x:430, y:126 }
};

function drawTopo(){
  const el = document.getElementById('topo');
  const W = 560, H = 190;
  let s = `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">`;

  s += `<text class="subnet" x="70" y="16" text-anchor="middle">lan-a  10.0.1.0/24</text>`;
  s += `<text class="subnet" x="430" y="16" text-anchor="middle">lan-b  10.0.2.0/24</text>`;

  for(const n of ['client','dns']) s += wire(POS[n], POS.router);
  for(const n of ['server','laptop']) s += wire(POS.router, POS[n]);

  for(const [name,p] of Object.entries(POS)){
    const h = NET.hosts[name];
    const up = upIfaces(h).length > 0;
    const ip = up ? upIfaces(h).map(([,f])=>f.ip).join(' / ') : 'no address';
    s += `<g>
      <rect class="box ${up?'':'down'}" id="box-${name}" x="${p.x-46}" y="${p.y-17}" width="92" height="34" rx="5"/>
      <text class="name" x="${p.x}" y="${p.y-2}" text-anchor="middle">${name}</text>
      <text class="ip" x="${p.x}" y="${p.y+10}" text-anchor="middle" ${up?'':'fill="#F87171"'}>${ip}</text>
    </g>`;
  }
  s += `<circle class="pkt" id="pkt" cx="-20" cy="-20" fill="#2DD4BF" opacity="0"/>`;
  s += `</svg>`;
  el.innerHTML = s;
}
function wire(a,b){
  return `<line class="wire" x1="${a.x+46>b.x?a.x-46:a.x+46}" y1="${a.y}" x2="${b.x>a.x?b.x-46:b.x+46}" y2="${b.y}"/>`;
}

let animToken = 0;
function animate(path, ok){
  if(path.length < 2) return;
  for(let i=0;i<path.length-1;i++) logPkt(path[i], path[i+1], ok?'ok':'dropped');
  const pkt = document.getElementById('pkt');
  if(!pkt) return;
  const token = ++animToken;
  const pts = path.map(n => POS[n]).filter(Boolean);
  if(pts.length < 2) return;
  pkt.setAttribute('fill', ok ? '#4ADE80' : '#F87171');
  pkt.setAttribute('opacity','1');
  let seg = 0, t = 0;
  const step = () => {
    if(token !== animToken) return;
    t += 0.045;
    if(t >= 1){ t = 0; seg++; }
    if(seg >= pts.length-1){
      pkt.setAttribute('opacity','0');
      return;
    }
    const a = pts[seg], b = pts[seg+1];
    pkt.setAttribute('cx', a.x + (b.x-a.x)*t);
    pkt.setAttribute('cy', a.y + (b.y-a.y)*t);
    requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}

function esc(s){ return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }

const PANES = {};

function makePane(id, hostName){
  const el = document.getElementById(id);
  el.innerHTML = `
    <div class="pane-bar">
      <select></select>
      <span class="ipn"></span>
      <span class="sp"></span>
      <span>terminal ${id === 'paneA' ? 'A' : 'B'}</span>
    </div>
    <div class="scr"></div>
    <div class="iline"><span class="ps"></span><input autocomplete="off" spellcheck="false"></div>`;

  const sel = el.querySelector('select');
  for(const n of Object.keys(NET.hosts)){
    const o = document.createElement('option');
    o.value = n; o.textContent = n;
    sel.appendChild(o);
  }
  sel.value = hostName;

  const p = {
    id, host:hostName,
    scr: el.querySelector('.scr'),
    input: el.querySelector('input'),
    ipn: el.querySelector('.ipn'),
    sel, hist:[], hi:0
  };
  PANES[id] = p;

  sel.onchange = ()=>{ p.host = sel.value; sync(p); p.input.focus(); };
  p.input.addEventListener('keydown', e=>{
    if(e.key === 'Enter'){ const v = p.input.value; p.input.value=''; exec(p, v); e.preventDefault(); }
    else if(e.key === 'ArrowUp'){ if(p.hi>0){ p.hi--; p.input.value = p.hist[p.hi]; } e.preventDefault(); }
    else if(e.key === 'ArrowDown'){ if(p.hi<p.hist.length-1){ p.hi++; p.input.value=p.hist[p.hi]; } else { p.hi=p.hist.length; p.input.value=''; } e.preventDefault(); }
    else if(e.key === 'Tab'){
      e.preventDefault();
      const frag = p.input.value.split(/\s+/).pop();
      const pool = Object.keys(C).filter(c=>c.startsWith(frag));
      if(pool.length === 1) p.input.value = p.input.value.slice(0, p.input.value.length-frag.length) + pool[0];
      else if(pool.length) write(p, pool.join('  '));
    }
    else if(e.key==='l' && e.ctrlKey){ e.preventDefault(); p.scr.innerHTML=''; }
  });
  el.addEventListener('click', ()=>{ if(!getSelection().toString()) p.input.focus(); });
  sync(p);
  return p;
}

function ps1(p){
  return `<span class="p">${NET.hosts[p.host].name}</span><span class="d">:~</span><span class="p">$</span> `;
}
function sync(p){
  p.input.parentElement.querySelector('.ps').innerHTML = ps1(p);
  const h = NET.hosts[p.host];
  const ifs = upIfaces(h);
  p.ipn.textContent = ifs.length ? ifs.map(([,f])=>f.ip).join(' / ') : '(no address)';
  p.ipn.style.color = ifs.length ? '' : 'var(--red)';
}
function write(p, html){
  const d = document.createElement('div');
  d.innerHTML = html;
  p.scr.appendChild(d);
  p.scr.scrollTop = p.scr.scrollHeight;
}

function exec(p, line){
  write(p, ps1(p) + `<span class="c">${esc(line)}</span>`);
  const t = line.trim();
  if(!t){ return; }
  p.hist.push(t); p.hi = p.hist.length;

  const parts = t.split(/\s+/);
  const name = parts[0];
  const cmd = C[name];
  if(!cmd){ write(p, `<span class="e">${esc(name)}: command not found</span>  <span class="d">— type help</span>`); afterCmd(p, t); return; }

  const flags = {}, args = [];
  for(const x of parts.slice(1)){
    if(/^-[a-zA-Z]+$/.test(x) && !['-l','-z','-zv','-v','-n','-tlnp','-tln'].includes(x)){
      for(const ch of x.slice(1)) flags[ch] = true;
    } else if(/^-[a-zA-Z]+$/.test(x)){
      for(const ch of x.slice(1)) flags[ch] = true;
      args.push(x);
    } else args.push(x);
  }

  let r;
  try{ r = cmd.run(args, NET.hosts[p.host], flags); }
  catch(e){ r = BAD(`${name}: ${e.message}`); }
  if(r && r.clear) p.scr.innerHTML = '';
  else {
    if(r && r.out) write(p, r.out.replace(/\n$/,''));
    if(r && r.err) write(p, `<span class="e">${r.err}</span>`);
  }
  sync(p); Object.values(PANES).forEach(sync);
  afterCmd(p, t);
}

      'Once you are speaking HTTP, the same distinction returns one layer up. A <strong>502 Bad Gateway</strong> means the proxy reached the backend and got something invalid — like connection refused. A <strong>504 Gateway Timeout</strong> means the backend never answered — like a timeout.',
      'Same two failure shapes, one layer higher. Recognising the pattern is what makes the rest transferable.'
    ], tip:{b:'Work up, never down', t:'Always diagnose from the bottom: address, then port, then name, then application. Starting at the application and guessing downward is how afternoons disappear.', key:true}}
  ],
  tasks:[
    { txt:'On server, run <code>serve 80 nginx</code>', hint:'serve 80 nginx', check:()=>!!NET.hosts.server.listeners[80] },
    { txt:'Make sure the firewall allows it: <code>ufw allow 80</code>', hint:'ufw allow 80', check:()=>NET.hosts.server.firewall.rules.some(r=>r.port===80&&r.action==='allow') || !NET.hosts.server.firewall.rules.some(r=>r.port===80) },
    { txt:'From client: <code>curl -v http://api.example.com</code>', hint:'curl -v http://api.example.com', check:s=>s.matched('client',/curl .*api\.example\.com/) },
    { txt:'Now <code>curl http://api.example.com:9999</code> — refused, and you know why', hint:'curl http://api.example.com:9999', check:s=>s.matched('client',/curl .*9999/) },
    { txt:'Try <code>curl http://nothere.example.com</code> — a DNS failure, not a connection one', hint:'curl http://nothere.example.com', check:s=>s.matched('client',/curl .*nothere/) },
    { txt:'Run <code>tcpdump</code> on server to see what actually arrived', hint:'tcpdump', check:s=>s.ran('tcpdump') }
  ]
}
];

/* ==========================================================================
   6. Progress
   ========================================================================== */

let mod = 0, doneTasks = {};
const HIST = [];          // {host, line}
const STATUSES = new Set();
const PKEY = 'packet-lab-progress';

const S = {
  ran: n => HIST.some(h => h.line.split(/\s+/)[0] === n),
  did: (host, prefix) => HIST.some(h => h.host === host && h.line.startsWith(prefix)),
  matched: (host, rx) => HIST.some(h => h.host === host && rx.test(h.line)),
  sawStatus: s => STATUSES.has(s)
};

async function loadProgress(){
  try{
    const r = await window.storage.get(PKEY);
    if(r && r.value){
      const p = JSON.parse(r.value);
      doneTasks = p.tasks || {};
      (p.hist||[]).forEach(x=>HIST.push(x));
      (p.status||[]).forEach(x=>STATUSES.add(x));
    }
  }catch(e){}
  MODULES.forEach((m,i)=>{ if(!doneTasks[i]) doneTasks[i] = m.tasks.map(()=>false); });
  renderRail(); renderLesson();
}
async function saveProgress(){
  try{ await window.storage.set(PKEY, JSON.stringify({
    tasks:doneTasks, hist:HIST.slice(-300), status:[...STATUSES]
  })); }catch(e){}
}

function modDone(i){ return doneTasks[i] && doneTasks[i].every(Boolean); }
function totalDone(){ return MODULES.filter((_,i)=>modDone(i)).length; }

function renderRail(){
  const el = document.getElementById('rail');
  el.innerHTML = '';
  MODULES.forEach((m,i)=>{
    const b = document.createElement('button');
    b.className = 'mbtn' + (i===mod?' active':'') + (modDone(i)?' done':'');
    b.title = m.t;
    b.innerHTML = `<span>${String(i+1).padStart(2,'0')}</span><span class="dot"></span>`;
    b.onclick = ()=>{ mod=i; renderRail(); renderLesson(); document.querySelector('.lesson').scrollTop=0; };
    el.appendChild(b);
  });
  const d = totalDone();
  document.getElementById('pfill').style.width = (d/MODULES.length*100)+'%';
  document.getElementById('ptxt').textContent = `${d} / ${MODULES.length}`;
  Progress.report(d, MODULES.length);
}

function renderLesson(){
  const m = MODULES[mod];
  let h = `<div class="eyebrow">Module ${String(mod+1).padStart(2,'0')}</div><h1>${esc(m.t)}</h1><p class="lead">${esc(m.lead)}</p>`;
  m.blocks.forEach((b,i)=>{
    h += `<h2><span class="ix">${String(i+1).padStart(2,'0')}</span>${esc(b.h)}</h2>`;
    (b.p||[]).forEach(p=>h += `<p>${p}</p>`);
    if(b.demo) h += `<div class="demo">${b.demo}</div>`;
    if(b.tip)  h += `<div class="tip${b.tip.key?' key':''}"><b>${esc(b.tip.b)}:</b> ${esc(b.tip.t)}</div>`;
  });
  h += `<div class="tasks"><div class="tasks-h">Practice — use both terminals</div>`;
  m.tasks.forEach((t,i)=>{
    h += `<div class="task${doneTasks[mod][i]?' done':''}"><span class="box">✓</span><span class="txt">${t.txt}<span class="hint">${esc(t.hint)}</span></span></div>`;
  });
  h += `</div><div class="navrow">
    <button class="btn" id="pv"${mod===0?' disabled':''}>← Previous</button><span class="sp"></span>
    <button class="btn" id="nx"${mod===MODULES.length-1?' disabled':''}>Next module →</button></div>`;
  const el = document.getElementById('lesson');
  el.innerHTML = h;
  const pv = document.getElementById('pv'), nx = document.getElementById('nx');
  if(pv) pv.onclick = ()=>{ mod--; renderRail(); renderLesson(); el.scrollTop=0; };
  if(nx) nx.onclick = ()=>{ mod++; renderRail(); renderLesson(); el.scrollTop=0; };
}

function afterCmd(p, line){
  HIST.push({ host:p.host, line });
  let changed = false;
  MODULES.forEach((m,mi)=>m.tasks.forEach((t,ti)=>{
    if(doneTasks[mi][ti]) return;
    let ok = false;
    try{ ok = !!t.check(S); }catch(e){}
    if(ok){ doneTasks[mi][ti] = true; changed = true; if(mi===mod) toast(t.txt); }
  }));
  if(changed){ saveProgress(); renderRail(); renderLesson(); }
}

let tt;
function toast(txt){
  const el = document.getElementById('toast');
  el.innerHTML = `<b>✓ Task complete</b><br>${txt}`;
  el.classList.add('show');
  clearTimeout(tt); tt = setTimeout(()=>el.classList.remove('show'), 2400);
}

/* record the outcome of every delivery, so tasks can check what you SAW */
const _deliver = deliver;
deliver = function(...args){
  const r = _deliver.apply(null, args);
  STATUSES.add(r.status);
  return r;
};

/* ---------- boot ---------- */

document.getElementById('resetNet').onclick = ()=>{
  seedNet(); drawTopo();
  Object.values(PANES).forEach(p=>{ p.scr.innerHTML=''; sync(p); banner(p); });
};

function banner(p){
  write(p, `<span class="d">Simulated host — type</span> <span class="ok">help</span> <span class="d">for commands, or</span> <span class="ok">man &lt;command&gt;</span><span class="d">. Switch machines with the selector above.</span>\n`);
}

seedNet();
drawTopo();
makePane('paneA','client');
makePane('paneB','server');
Object.values(PANES).forEach(banner);
loadProgress();
PANES.paneA.input.focus();
</script>
