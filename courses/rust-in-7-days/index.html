<script>
// ---------- Content model ----------
const DAYS = [
{
  title: "Variables, types, and why the compiler is rude to you",
  tag: "cargo new · let · mut · functions",
  blocks: [
    {
      h: "Immutability is the default",
      body: `<p>In Python everything is mutable unless you fight it. In Rust, everything is <b>immutable unless you say otherwise</b>. This single flip is the root of most "why won't this compile" moments this week.</p>`,
      code: `<span class="kw">let</span> x = 5;
x = 6; <span class="comment">// error: cannot assign twice to immutable variable</span>

<span class="kw">let</span> <span class="kw">mut</span> y = 5;
y = 6; <span class="comment">// fine, y opted into mutability</span>`,
      callout: `<b>Why:</b> the compiler uses immutability-by-default to reason about your whole program at compile time instead of at runtime, like a Python interpreter would. This is the same instinct behind why Rust catches data races before your robot ever moves.`
    },
    {
      h: "Types are inferred, but always there",
      body: `<p>You rarely write types by hand, but every value has exactly one, decided at compile time. No duck typing, no runtime surprises.</p>`,
      code: `<span class="kw">let</span> altitude: <span class="ty">f64</span> = 120.5;
<span class="kw">let</span> node_id: <span class="ty">u32</span> = 7;
<span class="kw">let</span> label: <span class="ty">&amp;str</span> = <span class="str">"lidar_front"</span>;
<span class="kw">let</span> active = <span class="kw">true</span>; <span class="comment">// inferred as bool</span>`,
    },
    {
      h: "Functions and expressions",
      body: `<p>The last line without a semicolon is the return value. This trips up every C++/Python person in week one.</p>`,
      code: `<span class="kw">fn</span> <span class="fn">clamp_speed</span>(v: <span class="ty">f64</span>, max: <span class="ty">f64</span>) -&gt; <span class="ty">f64</span> {
    <span class="kw">if</span> v &gt; max { max } <span class="kw">else</span> { v }  <span class="comment">// no return, no semicolon</span>
}`,
      callout: `Add a semicolon to that last line and the function suddenly returns <code>()</code> (unit) instead of <code>f64</code>, and it won't compile. This bites everyone once, then never again.`
    }
  ],
  quiz: [
    { q: "What happens here?\n<code>let x = 5; x = 6;</code>", opts: ["Runs fine, x becomes 6","Compile error, x isn't mutable","Runtime panic"], correct: 1,
      exp: "let alone never allows reassignment — you need `let mut x = 5;`." },
    { q: "What does this function return?\n<code>fn f() -> i32 { let y = 3; y + 1 }</code>", opts: ["4","Nothing, it's missing a return","Compile error"], correct: 0,
      exp: "The final expression with no semicolon is the return value — classic Rust idiom." }
  ],
  fill: { prompt: "Fix it: make this compile.", code: `let ___ count = 0;\ncount += 1;`, answer: "mut", hint: "The keyword that opts a variable into mutability." }
},
{
  title: "Ownership — the idea that makes Rust, Rust",
  tag: "move · clone · scope · drop",
  blocks: [
    {
      h: "One owner at a time",
      body: `<p>Every value has exactly one owner. When that owner goes out of scope, Rust automatically frees the memory. No garbage collector, no manual <code>free()</code>. This is why Rust has C-level performance without C's footguns.</p>`,
      code: `<span class="kw">let</span> s1 = String::from(<span class="str">"chame"</span>);
<span class="kw">let</span> s2 = s1;          <span class="comment">// ownership MOVES to s2</span>
println!(<span class="str">"{}"</span>, s1);   <span class="comment">// error: s1 was moved, no longer valid</span>`,
      callout: `In Python, <code>s2 = s1</code> gives you two names pointing at the same object — both stay valid. In Rust, that same line <b>invalidates s1</b>. This is the single biggest mental model shift this week.`
    },
    {
      h: "Clone when you actually need two",
      body: `<p>If you genuinely want two independent copies, say so explicitly.</p>`,
      code: `<span class="kw">let</span> s1 = String::from(<span class="str">"chame"</span>);
<span class="kw">let</span> s2 = s1.clone(); <span class="comment">// deep copy, both valid</span>
println!(<span class="str">"{} {}"</span>, s1, s2); <span class="comment">// fine</span>`
    },
    {
      h: "Simple types copy instead of move",
      body: `<p>Types that live entirely on the stack and are cheap to duplicate (integers, floats, bools, chars) implement <code>Copy</code>, so this doesn't invalidate anything.</p>`,
      code: `<span class="kw">let</span> a = 5;
<span class="kw">let</span> b = a; <span class="comment">// a is copied, not moved — both still valid</span>
println!(<span class="str">"{} {}"</span>, a, b); <span class="comment">// fine</span>`
    }
  ],
  quiz: [
    { q: "After `let s2 = s1;` where s1 is a String, what is s1?", opts: ["A valid copy of s2","Invalid — it moved to s2","Still valid, both point to the same data"], correct: 1,
      exp: "Strings (heap-allocated) move by default. Only Copy types like integers duplicate silently." },
    { q: "Which types are Copy, not Move, by default?", opts: ["String and Vec","i32, f64, bool, char","Both of the above"], correct: 1,
      exp: "Stack-only, fixed-size, cheap-to-duplicate types implement Copy. Heap-backed types like String and Vec don't." }
  ],
  fill: { prompt: "Make this compile without moving s1 — use the method that deep-copies a String.", code: `let s1 = String::from("tiago");\nlet s2 = s1.___();\nprintln!("{} {}", s1, s2);`, answer: "clone", hint: "Deep copy method on String." }
},
{
  title: "Borrowing and references",
  tag: "&T · &mut T · the borrow checker",
  blocks: [
    {
      h: "Borrow instead of taking ownership",
      body: `<p>Passing a value into a function normally moves it. Most of the time you just want to <i>use</i> it, not own it — that's what references are for.</p>`,
      code: `<span class="kw">fn</span> <span class="fn">battery_pct</span>(label: &amp;<span class="ty">String</span>) -&gt; <span class="ty">usize</span> {
    label.len()
}

<span class="kw">let</span> id = String::from(<span class="str">"pepper_01"</span>);
<span class="kw">let</span> n = battery_pct(&amp;id); <span class="comment">// borrow, don't move</span>
println!(<span class="str">"{} {}"</span>, id, n);   <span class="comment">// id is still valid</span>`
    },
    {
      h: "The one rule that prevents data races",
      body: `<p>At any point you may have <b>either</b> one mutable reference <b>or</b> any number of immutable references — never both. The compiler enforces this at compile time, which is exactly the class of bug that plagues multi-threaded C++ robot controllers.</p>`,
      code: `<span class="kw">let</span> <span class="kw">mut</span> speed = 10;
<span class="kw">let</span> r1 = &amp;speed;
<span class="kw">let</span> r2 = &amp;speed;      <span class="comment">// fine, multiple reads OK</span>
<span class="kw">let</span> r3 = &amp;<span class="kw">mut</span> speed;  <span class="comment">// error: can't borrow mutably while r1/r2 are alive</span>`,
      callout: `This is the exact bug class (concurrent read + write) that causes intermittent crashes in ROS nodes under load. Rust refuses to compile it instead of letting you debug it at 2am.`
    }
  ],
  quiz: [
    { q: "Why pass &String instead of String into a function you don't need to keep the value?", opts:["Faster typing","Avoids moving/losing ownership of the caller's variable","References are required by Rust syntax"], correct:1,
      exp: "Borrowing lets the function use the value without taking ownership away from the caller." },
    { q: "Which of these is illegal at the same time?", opts:["Two immutable references","One mutable + one immutable reference","Two separate owned variables"], correct:1,
      exp: "Rust allows many readers OR one writer, never both simultaneously — this is compile-time race prevention." }
  ],
  fill: { prompt: "Change the parameter so this function borrows instead of taking ownership.", code: `fn print_len(s: ___ String) -> usize {\n    s.len()\n}`, answer: "&", hint: "The reference symbol." }
},
{
  title: "Structs, enums, and pattern matching",
  tag: "struct · enum · match · Option",
  blocks: [
    {
      h: "Structs group related data",
      body: `<p>Like a dataclass in Python or a plain struct in C++, but with methods attached via <code>impl</code>.</p>`,
      code: `<span class="kw">struct</span> <span class="ty">RobotState</span> {
    id: <span class="ty">String</span>,
    battery: <span class="ty">f32</span>,
    connected: <span class="ty">bool</span>,
}

<span class="kw">impl</span> <span class="ty">RobotState</span> {
    <span class="kw">fn</span> <span class="fn">is_low</span>(&amp;self) -&gt; <span class="ty">bool</span> {
        self.battery &lt; 20.0
    }
}`
    },
    {
      h: "Enums are where Rust really shines",
      body: `<p>Unlike C-style enums, Rust enums can carry data per variant. This is how Rust models "this OR that" without null pointers.</p>`,
      code: `<span class="kw">enum</span> <span class="ty">SensorReading</span> {
    Distance(<span class="ty">f32</span>),
    Text(<span class="ty">String</span>),
    Timeout,
}`
    },
    {
      h: "match forces you to handle every case",
      body: `<p>The compiler checks exhaustiveness. Forget a case, it won't compile — no silent nulls slipping through, unlike an unchecked Python if/elif chain.</p>`,
      code: `<span class="kw">fn</span> <span class="fn">describe</span>(r: <span class="ty">SensorReading</span>) -&gt; <span class="ty">String</span> {
    <span class="kw">match</span> r {
        SensorReading::Distance(d) =&gt; format!(<span class="str">"{d}m"</span>),
        SensorReading::Text(t)     =&gt; t,
        SensorReading::Timeout     =&gt; <span class="str">"no reading"</span>.to_string(),
    }
}`
    },
    {
      h: "No null — Option<T> instead",
      body: `<p>Rust has no <code>null</code>. Absence of a value is modeled explicitly with <code>Option&lt;T&gt;</code>, and the compiler forces you to handle the "nothing" case before you can use the value.</p>`,
      code: `<span class="kw">let</span> maybe_id: <span class="ty">Option</span>&lt;<span class="ty">u32</span>&gt; = <span class="kw">None</span>;

<span class="kw">match</span> maybe_id {
    <span class="ty">Some</span>(id) =&gt; println!(<span class="str">"got {id}"</span>),
    <span class="ty">None</span>    =&gt; println!(<span class="str">"no id yet"</span>),
}`,
      callout: `This is the direct fix for "NullPointerException" and Python's silent <code>None</code> attribute errors — the compiler won't let you forget to check.`
    }
  ],
  quiz: [
    { q: "What replaces null in Rust?", opts:["A special Null type","Option<T> with Some/None","Uninitialized memory, like C"], correct:1,
      exp: "Option<T> makes absence explicit and forces handling at compile time." },
    { q: "What happens if a match doesn't cover every enum variant?", opts:["Runtime panic on the missing case","Compile error — match must be exhaustive","It's allowed, missing cases return None"], correct:1,
      exp: "Rust requires match arms to be exhaustive, or you add a `_ => ...` catch-all." }
  ],
  fill: { prompt: "Fill in the missing arm so this match compiles for an Option<i32>.", code: `match val {\n    Some(x) => println!("{x}"),\n    ___ => println!("nothing"),\n}`, answer: "None", hint: "The other variant of Option." }
},
{
  title: "Error handling, collections, and traits",
  tag: "Result<T,E> · Vec · HashMap · trait",
  blocks: [
    {
      h: "Result<T, E> instead of exceptions",
      body: `<p>Rust has no try/except. Fallible functions return <code>Result&lt;T, E&gt;</code>, and <code>?</code> propagates errors up cleanly.</p>`,
      code: `<span class="kw">fn</span> <span class="fn">parse_battery</span>(s: &amp;<span class="ty">str</span>) -&gt; <span class="ty">Result</span>&lt;<span class="ty">f32</span>, std::num::ParseFloatError&gt; {
    <span class="kw">let</span> v = s.parse::&lt;<span class="ty">f32</span>&gt;()?; <span class="comment">// ? returns early on Err</span>
    <span class="ty">Ok</span>(v)
}`,
      callout: `Compare this to Python's try/except: in Rust, the possibility of failure is part of the function's <b>type signature</b>. Callers can't ignore it by accident.`
    },
    {
      h: "Vec and HashMap",
      body: `<p>Your everyday Python list and dict, statically typed.</p>`,
      code: `<span class="kw">let</span> <span class="kw">mut</span> readings: <span class="ty">Vec</span>&lt;<span class="ty">f32</span>&gt; = <span class="ty">Vec</span>::new();
readings.push(3.2);

<span class="kw">use</span> std::collections::HashMap;
<span class="kw">let</span> <span class="kw">mut</span> nodes: <span class="ty">HashMap</span>&lt;<span class="ty">String</span>, <span class="ty">f32</span>&gt; = HashMap::new();
nodes.insert(<span class="str">"lidar"</span>.to_string(), 12.0);`
    },
    {
      h: "Traits — Rust's interfaces",
      body: `<p>A trait defines shared behavior, similar to a Python ABC or a C++ abstract base class, but resolved at compile time with zero runtime cost by default.</p>`,
      code: `<span class="kw">trait</span> <span class="ty">Describable</span> {
    <span class="kw">fn</span> <span class="fn">describe</span>(&amp;self) -&gt; <span class="ty">String</span>;
}

<span class="kw">impl</span> <span class="ty">Describable</span> <span class="kw">for</span> <span class="ty">RobotState</span> {
    <span class="kw">fn</span> <span class="fn">describe</span>(&amp;self) -&gt; <span class="ty">String</span> {
        format!(<span class="str">"{} @ {}%"</span>, self.id, self.battery)
    }
}`
    }
  ],
  quiz: [
    { q: "How does Rust signal a function can fail?", opts:["try/catch blocks","The return type is Result<T, E>","It throws a panic always"], correct:1,
      exp: "Fallibility is encoded in the type system via Result, not exceptions." },
    { q: "What does `?` do inside a function returning Result?", opts:["Ignores errors silently","Returns Err early if the expression failed, otherwise unwraps Ok","Prints a warning and continues"], correct:1,
      exp: "The ? operator is short-hand error propagation — it's Rust's version of letting an exception bubble up." }
  ],
  fill: { prompt: "Add the operator that propagates the error instead of unwrapping manually.", code: `let v = s.parse::<f32>()___;`, answer: "?", hint: "One character. Propagates Err, unwraps Ok." }
},
{
  title: "Generics, lifetimes, and concurrency",
  tag: "<T> · 'a · Arc · Mutex · thread::spawn",
  blocks: [
    {

<span class="kw">use</span> std::thread;

<span class="kw">let</span> counter = Arc::new(Mutex::new(0));
<span class="kw">let</span> <span class="kw">mut</span> handles = vec![];

<span class="kw">for</span> _ <span class="kw">in</span> 0..4 {
    <span class="kw">let</span> counter = Arc::clone(&amp;counter);
    handles.push(thread::spawn(<span class="kw">move</span> || {

<span class="kw">for</span> h <span class="kw">in</span> handles { h.join().unwrap(); }`,

// ---------- State ----------
let progress = {}; // {0: true, 1: false, ...}
let currentDay = 0;

async function loadProgress(){
  try{
    const r = await window.storage.get('rust-course-progress');
    if(r && r.value){ progress = JSON.parse(r.value); }
  }catch(e){ progress = {}; }
  render();
}
async function saveProgress(){
  try{ await window.storage.set('rust-course-progress', JSON.stringify(progress)); }
  catch(e){ console.error('save failed', e); }
}

function completedCount(){
  return Object.values(progress).filter(Boolean).length;
}

function renderNav(){
  const nav = document.getElementById('dayNav');
  nav.innerHTML = '';
  DAYS.forEach((d, i)=>{
    const btn = document.createElement('button');
    btn.className = 'day-btn' + (i===currentDay ? ' active':'') + (progress[i] ? ' done':'');
    btn.innerHTML = `<span class="dot"></span> Day ${i+1}`;
    btn.onclick = ()=>{ currentDay = i; render(); };
    nav.appendChild(btn);
  });
}

function renderProgressBar(){
  const track = document.getElementById('progressTrack');
  track.innerHTML = '';
  DAYS.forEach((d,i)=>{
    const seg = document.createElement('div');
    seg.className = 'progress-seg' + (progress[i] ? ' done':'');
    track.appendChild(seg);
  });
  document.getElementById('progressLabel').textContent = `${completedCount()} / ${DAYS.length} days complete`;
  Progress.report(completedCount(), DAYS.length);
}

function renderDay(){
  const main = document.getElementById('main');
  const d = DAYS[currentDay];
  let html = `<div class="day-panel active">
    <div class="day-title">Day ${currentDay+1}: ${d.title}</div>
    <div class="day-tagline">${d.tag}</div>`;

  d.blocks.forEach((b, bi)=>{
    html += `<section class="block">
      <div class="block-title"><span class="idx">${String(bi+1).padStart(2,'0')}</span> ${b.h}</div>
      ${b.body || ''}
      ${b.code ? `<pre><code>${b.code}</code></pre>` : ''}
      ${b.callout ? `<div class="callout">${b.callout}</div>` : ''}
    </section>`;
  });

  html += `<section class="block"><div class="block-title">Check your understanding</div>`;
  d.quiz.forEach((q, qi)=>{
    html += `<div class="quiz" data-day="${currentDay}" data-q="${qi}">
      <div class="quiz-q">${q.q}</div>
      <div class="quiz-opts">
        ${q.opts.map((o,oi)=>`<button class="opt-btn" data-oi="${oi}">${o}</button>`).join('')}
      </div>
      <div class="feedback"></div>
    </div>`;
  });
  html += `</section>`;

  if(d.fill){
    html += `<section class="block">
      <div class="block-title">Fill the blank</div>
      <p class="dim">${d.fill.prompt}</p>
      <pre class="fillblank"><code>${escapeHtml(d.fill.code).replace('___', '<input type="text" id="fillInput" placeholder="?" autocomplete="off" autocapitalize="off" spellcheck="false">')}</code></pre>
      <button class="check-btn" id="fillCheck">Check</button>
      <div class="feedback" id="fillFeedback"></div>
    </section>`;
  }

  html += `<button class="mark-done ${progress[currentDay] ? 'completed':''}" id="markDone">
    ${progress[currentDay] ? '✓ Day complete' : 'Mark day complete'}
  </button>`;

  html += `</div>`;
  main.innerHTML = html;

  // wire quiz buttons
  main.querySelectorAll('.quiz').forEach(qEl=>{
    const qi = parseInt(qEl.dataset.q);
    const qData = d.quiz[qi];
    const opts = qEl.querySelectorAll('.opt-btn');
    const fb = qEl.querySelector('.feedback');
    opts.forEach(btn=>{
      btn.onclick = ()=>{
        const oi = parseInt(btn.dataset.oi);
        opts.forEach(o=>o.classList.add('disabled'));
        if(oi === qData.correct){
          btn.classList.add('correct');
          fb.textContent = '✓ ' + qData.exp;
          fb.className = 'feedback show ok';
        } else {
          btn.classList.add('wrong');
          opts[qData.correct].classList.add('correct');
          fb.textContent = '✗ ' + qData.exp;
          fb.className = 'feedback show bad';
        }
      };
    });
  });

  // wire fill-blank
  if(d.fill){
    document.getElementById('fillCheck').onclick = ()=>{
      const val = document.getElementById('fillInput').value.trim();
      const answers = d.fill.answer.split(',').map(a=>a.trim());
      const fb = document.getElementById('fillFeedback');
      const isCorrect = answers.some(a => val === a || val.replace(/\s+/g,'') === a.replace(/\s+/g,''));
      if(isCorrect){
        fb.textContent = '✓ Correct.';
        fb.className = 'feedback show ok';
      } else {
        fb.textContent = `✗ Hint: ${d.fill.hint}`;
        fb.className = 'feedback show bad';
      }
    };
  }

  // wire mark done
  document.getElementById('markDone').onclick = async ()=>{
    progress[currentDay] = true;
    await saveProgress();
    renderNav();
    renderProgressBar();
    const btn = document.getElementById('markDone');
    btn.textContent = '✓ Day complete';
    btn.classList.add('completed');
  };
}

function escapeHtml(s){
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function render(){
  renderNav();
  renderProgressBar();
  renderDay();
  window.scrollTo({top:0, behavior:'instant'});
}

loadProgress();
</script>
