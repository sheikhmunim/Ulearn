<style>
  :root{
    --bg: #0D1117;
    --panel: #141A22;
    --panel-2: #1B222C;
    --border: #2A323D;
    --text: #D7DEE7;
    --muted: #7C8695;
    --accent: #E3B341;
    --accent-dim: #6B5A26;
    --good: #3FB950;
    --bad: #F0654F;
    --mono: 'JetBrains Mono', monospace;
    --sans: 'Inter', sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:var(--sans);height:100%;}
  ::selection{background:var(--accent-dim); color:#fff;}

  .app{display:flex; min-height:100vh;}

  /* Sidebar */
  .sidebar{
    width:230px; flex-shrink:0; background:var(--panel);
    border-right:1px solid var(--border);
    display:flex; flex-direction:column;
    position:sticky; top:0; height:100vh; overflow-y:auto;
  }
  .brand{
    padding:20px 18px 14px 18px; border-bottom:1px solid var(--border);
  }
  .brand .prompt{font-family:var(--mono); font-size:12px; color:var(--good);}
  .brand h1{font-size:16px; margin:6px 0 2px 0; font-weight:700; letter-spacing:-0.01em;}
  .brand p{font-size:12px; color:var(--muted); margin:0;}

  .daylist{padding:10px; flex:1;}
  .day-btn{
    width:100%; text-align:left; background:transparent; border:1px solid transparent;
    color:var(--muted); padding:10px 10px; border-radius:6px; cursor:pointer;
    font-family:var(--sans); font-size:13px; margin-bottom:4px;
    display:flex; align-items:center; gap:10px;
    transition: background .15s, color .15s, border-color .15s;
  }
  .day-btn .num{
    font-family:var(--mono); font-size:11px; color:var(--muted);
    width:22px; height:22px; border-radius:50%; border:1px solid var(--border);
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .day-btn:hover{background:var(--panel-2); color:var(--text);}
  .day-btn.active{background:rgba(227,179,65,0.08); border-color:var(--accent-dim); color:var(--text);}
  .day-btn.active .num{background:var(--accent); border-color:var(--accent); color:#1a1400;}
  .day-btn .label{display:flex; flex-direction:column;}
  .day-btn .label b{font-size:12.5px; font-weight:600;}
  .day-btn .label span{font-size:11px; color:var(--muted);}
  .day-btn.done .num{background:var(--good); border-color:var(--good); color:#04220a;}

  .sidebar-footer{padding:14px 18px; border-top:1px solid var(--border); font-size:11px; color:var(--muted); font-family:var(--mono);}

  /* Main */
  .main{flex:1; min-width:0; padding:32px 40px 80px 40px; max-width:980px;}
  .day-head{margin-bottom:22px;}
  .eyebrow{font-family:var(--mono); font-size:12px; color:var(--accent); text-transform:uppercase; letter-spacing:0.06em;}
  .day-head h2{font-size:26px; margin:6px 0 8px 0; font-weight:700; letter-spacing:-0.01em;}
  .day-head p.goal{color:var(--muted); font-size:14.5px; line-height:1.55; max-width:680px;}

  .card{
    background:var(--panel); border:1px solid var(--border); border-radius:10px;
    padding:20px 22px; margin-bottom:18px;
  }
  .card h3{font-size:13px; margin:0 0 12px 0; text-transform:uppercase; letter-spacing:0.05em; color:var(--muted); font-weight:600;}

  .concept p{font-size:14px; line-height:1.65; margin:0 0 10px 0;}
  .concept code, .inline-code{
    background:var(--panel-2); border:1px solid var(--border); border-radius:4px;
    padding:1px 6px; font-family:var(--mono); font-size:12.5px; color:var(--accent);
  }
  .concept pre{
    background:#0A0F14; border:1px solid var(--border); border-radius:8px;
    padding:14px 16px; overflow-x:auto; font-family:var(--mono); font-size:13px;
    color:#9FE6B0; margin:10px 0;
  }

  .schema-toggle{
    cursor:pointer; user-select:none; display:flex; align-items:center; gap:8px;
  }
  .schema-toggle .chev{transition: transform .15s; font-size:11px; color:var(--muted);}
  .schema-body{display:none; margin-top:14px;}
  .schema-body.open{display:block;}
  .schema-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:12px;}
  .table-box{background:var(--panel-2); border:1px solid var(--border); border-radius:8px; overflow:hidden;}
  .table-box .t-name{font-family:var(--mono); font-size:12.5px; font-weight:700; color:var(--accent); background:rgba(227,179,65,0.06); padding:8px 10px; border-bottom:1px solid var(--border);}
  .table-box ul{list-style:none; margin:0; padding:8px 10px; font-family:var(--mono); font-size:11.5px; color:var(--muted); line-height:1.9;}
  .table-box ul li b{color:var(--text); font-weight:500;}

  .exercise{border-left:2px solid var(--accent-dim); padding-left:14px; margin-bottom:22px;}
  .exercise:last-child{margin-bottom:0;}
  .exercise .ex-title{font-size:13.5px; font-weight:600; margin-bottom:4px; display:flex; align-items:center; gap:8px;}
  .exercise .ex-title .badge{
    font-family:var(--mono); font-size:10px; color:var(--bg); background:var(--muted);
    padding:1px 6px; border-radius:10px; font-weight:700;
  }
  .exercise .ex-desc{font-size:13.5px; color:var(--muted); line-height:1.55; margin-bottom:10px;}

  textarea.editor{
    width:100%; min-height:90px; background:#0A0F14; color:#D7DEE7;
    border:1px solid var(--border); border-radius:8px; padding:12px 14px;
    font-family:var(--mono); font-size:13px; line-height:1.6; resize:vertical;
    outline:none;
  }
  textarea.editor:focus{border-color:var(--accent-dim);}

  .ex-actions{display:flex; align-items:center; gap:10px; margin-top:10px; flex-wrap:wrap;}
  button.run-btn{
    background:var(--accent); color:#1a1400; border:none; border-radius:6px;
    padding:8px 16px; font-family:var(--sans); font-weight:700; font-size:13px;
    cursor:pointer; transition: filter .15s;
  }
  button.run-btn:hover{filter:brightness(1.08);}
  button.ghost-btn{
    background:transparent; color:var(--muted); border:1px solid var(--border); border-radius:6px;
    padding:8px 14px; font-family:var(--sans); font-size:12.5px; cursor:pointer;
    transition: color .15s, border-color .15s;
  }
  button.ghost-btn:hover{color:var(--text); border-color:var(--muted);}

  .result-wrap{margin-top:12px;}
  .result-msg{font-family:var(--mono); font-size:12.5px; padding:8px 0; }
  .result-msg.ok{color:var(--good);}
  .result-msg.err{color:var(--bad);}
  .result-table-scroll{overflow-x:auto; border:1px solid var(--border); border-radius:8px; margin-top:6px;}
  table.result-table{border-collapse:collapse; width:100%; font-family:var(--mono); font-size:12px;}
  table.result-table th{
    background:var(--panel-2); color:var(--accent); text-align:left; padding:8px 12px;
    border-bottom:1px solid var(--border); white-space:nowrap; position:sticky; top:0;
  }
  table.result-table td{padding:7px 12px; border-bottom:1px solid rgba(255,255,255,0.04); white-space:nowrap; color:var(--text);}
  table.result-table tr:hover td{background:rgba(255,255,255,0.02);}

  .hint-box{
    margin-top:10px; font-size:13px; color:var(--muted); background:var(--panel-2);
    border:1px dashed var(--border); border-radius:8px; padding:10px 12px; display:none;
  }
  .hint-box.open{display:block;}
  .sol-box{
    margin-top:10px; font-family:var(--mono); font-size:12.5px; color:#9FE6B0;
    background:#0A0F14; border:1px solid var(--border); border-radius:8px; padding:10px 12px; display:none;
    white-space:pre-wrap;
  }
  .sol-box.open{display:block;}

  .loading-screen{
    position:fixed; inset:0; background:var(--bg); display:flex; flex-direction:column;
    align-items:center; justify-content:center; z-index:999; gap:10px;
  }
  .loading-screen .prompt{font-family:var(--mono); color:var(--good); font-size:13px;}
  .loading-screen .bar{width:220px; height:3px; background:var(--panel-2); border-radius:2px; overflow:hidden;}
  .loading-screen .bar span{display:block; height:100%; width:30%; background:var(--accent); animation:load 1.1s infinite ease-in-out;}
  @keyframes load{0%{transform:translateX(-100%);}100%{transform:translateX(400%);}}

  @media (max-width: 820px){
    .app{flex-direction:column;}
    .sidebar{width:100%; height:auto; position:relative; flex-direction:row; overflow-x:auto;}
    .daylist{display:flex; gap:6px; padding:10px;}
    .day-btn{width:auto; white-space:nowrap;}
    .main{padding:22px 18px 60px 18px;}
  }
</style>

<div class="app" id="app" style="display:none;">

<script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.3/sql-wasm.js"></script>
<script>
const DAYS = [
  {
    id:0, tag:"Day 1", title:"SELECT, WHERE, ORDER BY, LIMIT",
    goal:"Get fluent in filtering, sorting and shaping raw rows. This is the muscle memory everything else builds on.",
    concept:`
      <p><code>SELECT</code> chooses columns, <code>WHERE</code> filters rows before grouping, <code>ORDER BY</code> sorts the result, <code>LIMIT</code> caps how many rows come back.</p>
      <pre>SELECT name, price
FROM products
WHERE price > 50
ORDER BY price DESC
LIMIT 5;</pre>
      <p>Use <code>DISTINCT</code> to drop duplicate rows, and combine conditions with <code>AND</code> / <code>OR</code> / <code>IN</code> / <code>BETWEEN</code> / <code>LIKE</code>.</p>
    `,
    exercises:[
      {level:"warmup", title:"List all employees", desc:"Select every column from the employees table.",
       starter:"SELECT * FROM employees;",
       hint:"SELECT * FROM <table>; gets every column and every row.",
       solution:"SELECT * FROM employees;"},
      {level:"core", title:"High earners", desc:"Find employees with a salary above 90000, sorted from highest to lowest salary. Show only name and salary.",
       starter:"-- your query here\n",
       hint:"WHERE salary > 90000, then ORDER BY salary DESC.",
       solution:"SELECT name, salary\nFROM employees\nWHERE salary > 90000\nORDER BY salary DESC;"},
      {level:"core", title:"Melbourne or Sydney customers", desc:"Find customers whose city is either 'Melbourne' or 'Sydney'. Return name and city.",
       starter:"-- your query here\n",
       hint:"Use WHERE city IN ('Melbourne','Sydney').",
       solution:"SELECT name, city\nFROM customers\nWHERE city IN ('Melbourne','Sydney');"},
      {level:"stretch", title:"Product name search", desc:"Find all products whose name contains the word 'Pro' (case-insensitive), ordered by price ascending.",
       starter:"-- your query here\n",
       hint:"LIKE '%Pro%' does a substring match. SQLite's LIKE is case-insensitive for ASCII by default.",
       solution:"SELECT name, price\nFROM products\nWHERE name LIKE '%Pro%'\nORDER BY price ASC;"}
    ]
  },
  {
    id:1, tag:"Day 2", title:"Aggregates, GROUP BY, HAVING",
    goal:"Turn rows into insight: totals, averages, counts per group, and filtering on the aggregated result.",
    concept:`
      <p><code>COUNT</code>, <code>SUM</code>, <code>AVG</code>, <code>MIN</code>, <code>MAX</code> collapse many rows into one number. <code>GROUP BY</code> does that per bucket. <code>HAVING</code> filters groups <i>after</i> aggregation, while <code>WHERE</code> filters rows <i>before</i>.</p>
      <pre>SELECT department_id, AVG(salary) AS avg_salary
FROM employees
GROUP BY department_id
HAVING AVG(salary) > 80000;</pre>
    `,
    exercises:[
      {level:"warmup", title:"Headcount per department", desc:"Count how many employees are in each department_id.",
       starter:"-- your query here\n",
       hint:"SELECT department_id, COUNT(*) ... GROUP BY department_id.",
       solution:"SELECT department_id, COUNT(*) AS headcount\nFROM employees\nGROUP BY department_id;"},
      {level:"core", title:"Average salary by department", desc:"Show department_id and average salary, rounded to 0 decimal places, sorted highest first.",
       starter:"-- your query here\n",
       hint:"ROUND(AVG(salary), 0). Don't forget ORDER BY on the aggregated alias.",
       solution:"SELECT department_id, ROUND(AVG(salary),0) AS avg_salary\nFROM employees\nGROUP BY department_id\nORDER BY avg_salary DESC;"},
      {level:"core", title:"Departments with 3+ people", desc:"Only show departments that have 3 or more employees.",
       starter:"-- your query here\n",
       hint:"This filters on the aggregate, so it belongs in HAVING, not WHERE.",
       solution:"SELECT department_id, COUNT(*) AS headcount\nFROM employees\nGROUP BY department_id\nHAVING COUNT(*) >= 3;"},
      {level:"stretch", title:"Revenue per product category", desc:"Using order_items joined to products, find total quantity sold and total revenue (quantity * price) per category. Order by revenue descending.",
       starter:"-- your query here\n",
       hint:"JOIN order_items to products on product_id, GROUP BY category, SUM(quantity) and SUM(quantity*price).",
       solution:"SELECT p.category,\n       SUM(oi.quantity) AS units_sold,\n       SUM(oi.quantity * p.price) AS revenue\nFROM order_items oi\nJOIN products p ON p.id = oi.product_id\nGROUP BY p.category\nORDER BY revenue DESC;"}
    ]
  },
  {
    id:2, tag:"Day 3", title:"JOINs across tables",
    goal:"Combine related tables correctly. This is where most real-world SQL bugs live, get the join type right.",
    concept:`
      <p><code>INNER JOIN</code> keeps only matching rows on both sides. <code>LEFT JOIN</code> keeps everything on the left, filling unmatched right-side columns with NULL, useful for finding "what's missing".</p>
      <pre>SELECT c.name, o.id AS order_id
FROM customers c
LEFT JOIN orders o ON o.customer_id = c.id;</pre>
      <p>You can chain multiple joins in one query, each with its own ON condition.</p>
    `,
    exercises:[
      {level:"warmup", title:"Orders with customer names", desc:"List order id, order_date, and the customer's name for every order.",
       starter:"-- your query here\n",
       hint:"JOIN orders to customers on customer_id = customers.id.",
       solution:"SELECT o.id AS order_id, o.order_date, c.name AS customer_name\nFROM orders o\nJOIN customers c ON c.id = o.customer_id;"},
      {level:"core", title:"Customers with no orders", desc:"Find customers who have never placed an order.",
       starter:"-- your query here\n",
       hint:"LEFT JOIN customers to orders, then WHERE o.id IS NULL.",
       solution:"SELECT c.name\nFROM customers c\nLEFT JOIN orders o ON o.customer_id = c.id\nWHERE o.id IS NULL;"},
      {level:"core", title:"Full order detail", desc:"For each order_item, show the customer name, product name, quantity and line total (quantity * price). Join across orders, customers, products.",
       starter:"-- your query here\n",
       hint:"Three joins: order_items -> orders -> customers, and order_items -> products.",
       solution:"SELECT c.name AS customer, p.name AS product, oi.quantity,\n       oi.quantity * p.price AS line_total\nFROM order_items oi\nJOIN orders o ON o.id = oi.order_id\nJOIN customers c ON c.id = o.customer_id\nJOIN products p ON p.id = oi.product_id;"},
      {level:"stretch", title:"Employee to manager", desc:"employees has a self-referencing manager_id. List each employee's name next to their manager's name (self join). Include employees with no manager, showing NULL.",
       starter:"-- your query here\n",
       hint:"Join employees to itself: employees e LEFT JOIN employees m ON e.manager_id = m.id.",
       solution:"SELECT e.name AS employee, m.name AS manager\nFROM employees e\nLEFT JOIN employees m ON e.manager_id = m.id;"}
    ]
  },
  {
    id:3, tag:"Day 4", title:"Subqueries & CTEs",
    goal:"Break complex questions into named, readable steps instead of one giant tangled query.",
    concept:`
      <p>A subquery is a query nested inside another, in <code>WHERE</code>, <code>FROM</code>, or <code>SELECT</code>. A CTE (<code>WITH ... AS</code>) names a subquery so you can reference it like a table, and chain several together for readability.</p>
      <pre>WITH dept_avg AS (
  SELECT department_id, AVG(salary) AS avg_sal
  FROM employees GROUP BY department_id
)
SELECT e.name, e.salary, d.avg_sal
FROM employees e
JOIN dept_avg d ON d.department_id = e.department_id
WHERE e.salary > d.avg_sal;</pre>
    `,
    exercises:[
      {level:"warmup", title:"Above the company average", desc:"Find employees whose salary is above the overall company average salary.",
       starter:"-- your query here\n",
       hint:"WHERE salary > (SELECT AVG(salary) FROM employees).",
       solution:"SELECT name, salary\nFROM employees\nWHERE salary > (SELECT AVG(salary) FROM employees);"},
      {level:"core", title:"Above their own department average", desc:"Using a CTE for per-department average salary, find employees earning more than their own department's average.",
       starter:"-- your query here\n",
       hint:"WITH dept_avg AS (...) then JOIN employees to dept_avg on department_id and compare salary > avg_sal.",
       solution:"WITH dept_avg AS (\n  SELECT department_id, AVG(salary) AS avg_sal\n  FROM employees\n  GROUP BY department_id\n)\nSELECT e.name, e.salary, d.avg_sal\nFROM employees e\nJOIN dept_avg d ON d.department_id = e.department_id\nWHERE e.salary > d.avg_sal;"},
      {level:"core", title:"Customers who bought 'Electronics'", desc:"Find distinct customer names who have at least one order containing a product in the 'Electronics' category. Use a subquery in WHERE with IN.",
       starter:"-- your query here\n",
       hint:"Subquery: SELECT o.customer_id FROM orders o JOIN order_items oi ... JOIN products p WHERE p.category='Electronics'.",
       solution:"SELECT DISTINCT c.name\nFROM customers c\nWHERE c.id IN (\n  SELECT o.customer_id\n  FROM orders o\n  JOIN order_items oi ON oi.order_id = o.id\n  JOIN products p ON p.id = oi.product_id\n  WHERE p.category = 'Electronics'\n);"},
      {level:"stretch", title:"Top spender per city", desc:"Using a CTE that sums total spend per customer, find the single highest-spending customer in each city.",
       starter:"-- your query here\n",
       hint:"Build a CTE of customer totals joined to city, then use a correlated subquery or window function to keep only the max per city. Try MAX() in a subquery first if window functions feel early.",
       solution:"WITH spend AS (\n  SELECT c.id, c.name, c.city, SUM(oi.quantity * p.price) AS total_spend\n  FROM customers c\n  JOIN orders o ON o.customer_id = c.id\n  JOIN order_items oi ON oi.order_id = o.id\n  JOIN products p ON p.id = oi.product_id\n  GROUP BY c.id\n)\nSELECT s.city, s.name, s.total_spend\nFROM spend s\nWHERE s.total_spend = (\n  SELECT MAX(total_spend) FROM spend s2 WHERE s2.city = s.city\n);"}
    ]
  },
  {
    id:4, tag:"Day 5", title:"Window functions",
    goal:"Rank, compare and run totals across rows without collapsing them, the single most powerful analytics tool in SQL.",
    concept:`
      <p>Window functions compute a value across a set of related rows without merging them into one. <code>PARTITION BY</code> defines the group, <code>ORDER BY</code> inside <code>OVER()</code> defines the order within it.</p>
      <pre>SELECT name, department_id, salary,
       RANK() OVER (PARTITION BY department_id ORDER BY salary DESC) AS dept_rank
FROM employees;</pre>
      <p><code>ROW_NUMBER()</code> gives unique sequential numbers, <code>RANK()</code> allows ties with gaps, <code>SUM() OVER (...)</code> gives running totals.</p>
    `,
    exercises:[
      {level:"warmup", title:"Rank employees by salary", desc:"Show every employee's name, salary, and their overall salary rank (highest = 1), no partitioning.",
       starter:"-- your query here\n",
       hint:"RANK() OVER (ORDER BY salary DESC).",
       solution:"SELECT name, salary,\n       RANK() OVER (ORDER BY salary DESC) AS salary_rank\nFROM employees;"},
      {level:"core", title:"Top earner per department", desc:"Rank employees within their department by salary, then keep only rank 1 per department. Wrap the window function in a CTE and filter in the outer query.",
       starter:"-- your query here\n",
       hint:"You can't filter directly on a window function in WHERE, put it in a CTE first, then WHERE dept_rank = 1 outside.",
       solution:"WITH ranked AS (\n  SELECT name, department_id, salary,\n         RANK() OVER (PARTITION BY department_id ORDER BY salary DESC) AS dept_rank\n  FROM employees\n)\nSELECT * FROM ranked WHERE dept_rank = 1;"},
      {level:"core", title:"Running total of orders", desc:"For each order, show order_date, id, and a running total count of orders up to and including that date, ordered by date.",
       starter:"-- your query here\n",
       hint:"COUNT(*) OVER (ORDER BY order_date) gives a running count.",
       solution:"SELECT id, order_date,\n       COUNT(*) OVER (ORDER BY order_date) AS running_order_count\nFROM orders\nORDER BY order_date;"},
      {level:"stretch", title:"Month-over-month category revenue", desc:"Compute total revenue per product category per month, then use LAG() to show the previous month's revenue alongside it for comparison.",
       starter:"-- your query here\n",
       hint:"First build a CTE grouping revenue by category and strftime('%Y-%m', order_date). Then LAG(revenue) OVER (PARTITION BY category ORDER BY month).",
       solution:"WITH monthly AS (\n  SELECT p.category,\n         strftime('%Y-%m', o.order_date) AS month,\n         SUM(oi.quantity * p.price) AS revenue\n  FROM order_items oi\n  JOIN orders o ON o.id = oi.order_id\n  JOIN products p ON p.id = oi.product_id\n  GROUP BY p.category, month\n)\nSELECT category, month, revenue,\n       LAG(revenue) OVER (PARTITION BY category ORDER BY month) AS prev_month_revenue\nFROM monthly\nORDER BY category, month;"}
    ]
  },
  {
    id:5, tag:"Day 6", title:"CASE, NULLs, string & date functions",
    goal:"Handle messy real data: conditional logic, missing values, and reshaping text and dates.",
    concept:`
      <p><code>CASE WHEN ... THEN ... ELSE ... END</code> is an inline if/else. <code>COALESCE(a,b)</code> returns the first non-null value. Date/string functions vary by engine, in SQLite: <code>strftime()</code>, <code>substr()</code>, <code>||</code> for concatenation.</p>
      <pre>SELECT name,
       CASE WHEN salary >= 100000 THEN 'senior'
            WHEN salary >= 70000 THEN 'mid'
            ELSE 'junior' END AS band
FROM employees;</pre>
    `,
    exercises:[
      {level:"warmup", title:"Salary bands", desc:"Label each employee as 'senior' (>=100000), 'mid' (>=70000), or 'junior' (below), alongside their name.",
       starter:"-- your query here\n",
       hint:"Use CASE WHEN ... in the SELECT list, evaluated top to bottom.",
       solution:"SELECT name, salary,\n  CASE WHEN salary >= 100000 THEN 'senior'\n       WHEN salary >= 70000 THEN 'mid'\n       ELSE 'junior' END AS band\nFROM employees;"},
      {level:"core", title:"Fill missing manager", desc:"Show employee name and manager name, but replace NULL managers with the text 'No manager'.",
       starter:"-- your query here\n",
       hint:"LEFT JOIN employees to itself, then COALESCE(m.name, 'No manager').",
       solution:"SELECT e.name AS employee, COALESCE(m.name, 'No manager') AS manager\nFROM employees e\nLEFT JOIN employees m ON e.manager_id = m.id;"},
      {level:"core", title:"Signup year", desc:"Extract just the year from each customer's signup_date, and count how many customers signed up each year.",
       starter:"-- your query here\n",
       hint:"strftime('%Y', signup_date) pulls the year out of a date string in SQLite.",
       solution:"SELECT strftime('%Y', signup_date) AS signup_year, COUNT(*) AS customers\nFROM customers\nGROUP BY signup_year\nORDER BY signup_year;"},
      {level:"stretch", title:"Order status summary line", desc:"For each order, build a single readable string like 'Order #12 — 3 items — delivered' by concatenating id, item count (from order_items), and status.",
       starter:"-- your query here\n",
       hint:"Join orders to a per-order item count subquery, then use || to concatenate text and CAST(id AS TEXT) where needed.",
       solution:"SELECT 'Order #' || o.id || ' — ' || COUNT(oi.id) || ' items — ' || o.status AS summary\nFROM orders o\nJOIN order_items oi ON oi.order_id = o.id\nGROUP BY o.id;"}
    ]
  },
  {
    id:6, tag:"Day 7", title:"Capstone challenge",
    goal:"One realistic multi-part business question. Combine everything: joins, aggregates, CTEs, window functions.",
    concept:`
      <p>No new syntax today. The skill being tested is decomposition: breaking one messy business question into clean steps using CTEs, the way you'd actually work at a job.</p>
      <p>Suggested approach: write one CTE per logical step (e.g. "revenue per customer", then "rank customers"), and only assemble the final SELECT once each piece is verified on its own.</p>
    `,
    exercises:[
      {level:"capstone", title:"Top 3 customers by total spend, with their favourite category", desc:"Find the top 3 customers by total spend across all orders. For each, also show the product category they've spent the most on. Return: customer name, total_spend, favourite_category.",
       starter:"-- Build this step by step. Start with a CTE for total spend per customer,\n-- then a CTE for spend per customer per category,\n-- then combine.\n",
       hint:"Step 1: CTE total_spend (customer, total). Step 2: CTE cat_spend (customer, category, amount). Step 3: rank cat_spend per customer with ROW_NUMBER() to find the top category, filter to rank 1. Step 4: join that to total_spend, order by total_spend DESC, LIMIT 3.",
       solution:"WITH total_spend AS (\n  SELECT c.id, c.name, SUM(oi.quantity * p.price) AS total\n  FROM customers c\n  JOIN orders o ON o.customer_id = c.id\n  JOIN order_items oi ON oi.order_id = o.id\n  JOIN products p ON p.id = oi.product_id\n  GROUP BY c.id\n),\ncat_spend AS (\n  SELECT c.id AS customer_id, p.category, SUM(oi.quantity * p.price) AS amount,\n         ROW_NUMBER() OVER (PARTITION BY c.id ORDER BY SUM(oi.quantity * p.price) DESC) AS rn\n  FROM customers c\n  JOIN orders o ON o.customer_id = c.id\n  JOIN order_items oi ON oi.order_id = o.id\n  JOIN products p ON p.id = oi.product_id\n  GROUP BY c.id, p.category\n)\nSELECT t.name, t.total AS total_spend, cs.category AS favourite_category\nFROM total_spend t\nJOIN cat_spend cs ON cs.customer_id = t.id AND cs.rn = 1\nORDER BY t.total DESC\nLIMIT 3;"}
    ]
  }
];

let db = null;
let currentDay = 0;
const doneDays = new Set();

async function loadDone(){
  try{
    const r = await window.storage.get('sql-lab-progress');
    if(r && r.value) JSON.parse(r.value).forEach(id => doneDays.add(id));
  }catch(e){ /* no saved progress yet */ }
}
async function saveDone(){
  try{ await window.storage.set('sql-lab-progress', JSON.stringify([...doneDays])); }
  catch(e){ console.error('save failed', e); }
}

function initEditors(){}

async function boot(){
  const SQL = await initSqlJs({ locateFile: f => `https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.3/${f}` });
  db = new SQL.Database();
  db.run(SCHEMA_SQL);
  await loadDone();
  document.getElementById('loadingScreen').style.display = 'none';
  document.getElementById('app').style.display = 'flex';
  renderSidebar();
  renderDay(0);
}

function renderSidebar(){
  Progress.report(doneDays.size, DAYS.length);
  const list = document.getElementById('dayList');
  list.innerHTML = '';
  DAYS.forEach(d => {
    const btn = document.createElement('button');
    btn.className = 'day-btn' + (d.id === currentDay ? ' active' : '') + (doneDays.has(d.id) ? ' done' : '');
    btn.innerHTML = `<span class="num">${doneDays.has(d.id) ? '✓' : d.id+1}</span>
      <span class="label"><b>${d.tag}</b><span>${d.title}</span></span>`;
    btn.onclick = () => renderDay(d.id);
    list.appendChild(btn);
  });
}

function renderDay(id){
  currentDay = id;
  renderSidebar();
  const day = DAYS[id];
  const main = document.getElementById('main');
  main.innerHTML = '';

  const head = document.createElement('div');
  head.className = 'day-head';
  head.innerHTML = `<div class="eyebrow">${day.tag} of 7</div>
    <h2>${day.title}</h2>
    <p class="goal">${day.goal}</p>`;
  main.appendChild(head);

  const conceptCard = document.createElement('div');
  conceptCard.className = 'card concept';
  conceptCard.innerHTML = `<h3>Concept</h3>${day.concept}`;
  main.appendChild(conceptCard);

  const schemaCard = document.createElement('div');
  schemaCard.className = 'card';
  schemaCard.innerHTML = `
    <div class="schema-toggle" id="schemaToggle">
      <span class="chev" id="schemaChev">▶</span>
      <h3 style="margin:0;">Reference schema (click to expand)</h3>
    </div>
    <div class="schema-body" id="schemaBody">
      <div class="schema-grid">
        ${schemaBoxHTML('departments', ['id PK','name','budget'])}
        ${schemaBoxHTML('employees', ['id PK','name','department_id FK','salary','hire_date','manager_id FK→employees'])}
        ${schemaBoxHTML('customers', ['id PK','name','city','signup_date'])}
        ${schemaBoxHTML('products', ['id PK','name','category','price'])}
        ${schemaBoxHTML('orders', ['id PK','customer_id FK','employee_id FK','order_date','status'])}
        ${schemaBoxHTML('order_items', ['id PK','order_id FK','product_id FK','quantity'])}
      </div>
    </div>`;
  main.appendChild(schemaCard);
  document.getElementById('schemaToggle').onclick = () => {
    document.getElementById('schemaBody').classList.toggle('open');
    const chev = document.getElementById('schemaChev');
    chev.style.transform = document.getElementById('schemaBody').classList.contains('open') ? 'rotate(90deg)' : 'rotate(0deg)';
  };

  const exCard = document.createElement('div');
  exCard.className = 'card';
  exCard.innerHTML = `<h3>Exercises</h3>`;
  day.exercises.forEach((ex, i) => {
    exCard.appendChild(renderExercise(day.id, i, ex));
  });
  main.appendChild(exCard);

  const markCard = document.createElement('div');
  markCard.style.display = 'flex';
  markCard.style.justifyContent = 'flex-end';
  markCard.innerHTML = `<button class="run-btn" id="markDoneBtn">${doneDays.has(day.id) ? 'Marked complete ✓' : 'Mark day complete'}</button>`;
  main.appendChild(markCard);
  document.getElementById('markDoneBtn').onclick = () => {
    doneDays.add(day.id);
    saveDone();
    renderSidebar();
    document.getElementById('markDoneBtn').textContent = 'Marked complete ✓';
  };
}

function schemaBoxHTML(name, cols){
  return `<div class="table-box">
    <div class="t-name">${name}</div>
    <ul>${cols.map(c => {
      const parts = c.split(' ');
      return `<li><b>${parts[0]}</b> ${parts.slice(1).join(' ')}</li>`;
    }).join('')}</ul>
  </div>`;
}

function renderExercise(dayId, idx, ex){
  const wrap = document.createElement('div');
  wrap.className = 'exercise';
  const editorId = `editor-${dayId}-${idx}`;
  const resultId = `result-${dayId}-${idx}`;
  const hintId = `hint-${dayId}-${idx}`;
  const solId = `sol-${dayId}-${idx}`;

  wrap.innerHTML = `
    <div class="ex-title">${ex.title} <span class="badge">${ex.level}</span></div>
    <div class="ex-desc">${ex.desc}</div>
    <textarea class="editor" id="${editorId}" spellcheck="false">${ex.starter}</textarea>
    <div class="ex-actions">
      <button class="run-btn" data-action="run">▶ Run query</button>
      <button class="ghost-btn" data-action="hint">Show hint</button>
      <button class="ghost-btn" data-action="solution">Show solution</button>
      <button class="ghost-btn" data-action="reset">Reset</button>
    </div>
    <div class="hint-box" id="${hintId}">${ex.hint}</div>
    <div class="sol-box" id="${solId}"></div>
    <div class="result-wrap" id="${resultId}"></div>
  `;

  wrap.querySelector('[data-action="run"]').onclick = () => {
    const query = document.getElementById(editorId).value;
    runQuery(query, resultId);
  };
  wrap.querySelector('[data-action="hint"]').onclick = (e) => {
    document.getElementById(hintId).classList.toggle('open');
  };
  wrap.querySelector('[data-action="solution"]').onclick = (e) => {
    const box = document.getElementById(solId);
    box.textContent = ex.solution;
    box.classList.toggle('open');
  };
  wrap.querySelector('[data-action="reset"]').onclick = () => {
    document.getElementById(editorId).value = ex.starter;
    document.getElementById(resultId).innerHTML = '';
  };

  return wrap;
}

function runQuery(query, resultId){
  const resultEl = document.getElementById(resultId);
  resultEl.innerHTML = '';
  if(!query || !query.trim()){
    resultEl.innerHTML = `<div class="result-msg err">Write a query first.</div>`;
    return;
  }
  try{
    const res = db.exec(query);
    if(res.length === 0){
      resultEl.innerHTML = `<div class="result-msg ok">✓ Query ran successfully. No rows returned (this is normal for statements without a result set).</div>`;
      return;
    }
    const { columns, values } = res[0];
    let html = `<div class="result-msg ok">✓ ${values.length} row${values.length===1?'':'s'} returned</div>
      <div class="result-table-scroll"><table class="result-table"><thead><tr>`;
    columns.forEach(c => html += `<th>${escapeHtml(c)}</th>`);
    html += `</tr></thead><tbody>`;
    values.slice(0,200).forEach(row => {
      html += '<tr>' + row.map(v => `<td>${v===null?'<span style="color:#7C8695">NULL</span>':escapeHtml(String(v))}</td>`).join('') + '</tr>';
    });
    html += `</tbody></table></div>`;
    if(values.length > 200){
      html += `<div class="result-msg" style="color:#7C8695;">Showing first 200 of ${values.length} rows.</div>`;
    }
    resultEl.innerHTML = html;
  }catch(err){
    resultEl.innerHTML = `<div class="result-msg err">✗ ${escapeHtml(err.message)}</div>`;
  }
}

function escapeHtml(s){
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

boot();
