<style>
:root{
  --bg:#1e1e1e;
  --sidebar:#252526;
  --sidebar-hover:#2a2d2e;
  --activitybar:#333333;
  --border:#3c3c3c;
  --tab-active:#1e1e1e;
  --tab-inactive:#2d2d2d;
  --text:#cccccc;
  --text-dim:#858585;
  --blue:#007acc;
  --blue-status:#007acc;
  --green:#4ec9b0;
  --yellow:#dcdcaa;
  --red:#f14c4c;
  --orange:#ce9178;
  --purple:#c586c0;
  --pyellow:#e5c07b;
  --mono:'SF Mono','Fira Code',Consolas,'Courier New',monospace;
}
*{box-sizing:border-box;}
html,body{height:100%;margin:0;}
body{
  background:var(--bg); color:var(--text); font-family:var(--mono);
  font-size:13px; display:flex; flex-direction:column; height:100vh; overflow:hidden;
}
.titlebar{
  height:30px; background:#3c3c3c; display:flex; align-items:center;
  justify-content:center; font-size:12px; color:var(--text-dim); flex-shrink:0;
  border-bottom:1px solid #000;
}
.main{flex:1; display:flex; min-height:0;}

/* activity bar */
.activitybar{
  width:48px; background:var(--activitybar); flex-shrink:0;
  display:flex; flex-direction:column; align-items:center; padding-top:10px; gap:22px;
}
.abtn{width:24px; height:24px; display:flex; align-items:center; justify-content:center;
  color:#858585; font-size:18px; cursor:pointer; border-left:2px solid transparent;}
.abtn.active{color:#fff; border-left:2px solid #fff;}

/* explorer */
.explorer{width:230px; background:var(--sidebar); flex-shrink:0; overflow-y:auto;
  border-right:1px solid var(--border); padding-top:8px;}
.explorer-title{font-size:11px; color:var(--text-dim); padding:4px 20px; letter-spacing:0.08em; font-weight:600;}
.tree-root{padding:2px 0 2px 8px; font-size:13px; color:#fff; font-weight:600; cursor:pointer;}
.tree-folder{padding:2px 0 2px 20px; font-size:13px; color:var(--text); cursor:pointer;}
.tree-file{padding:3px 4px 3px 34px; font-size:13px; color:var(--text); cursor:pointer;
  display:flex; align-items:center; gap:6px; white-space:nowrap;}
.tree-file:hover, .tree-folder:hover{background:var(--sidebar-hover);}
.tree-file.selected{background:#37373d;}
.badge{width:14px; height:14px; border-radius:3px; font-size:9px; font-weight:800;
  display:flex; align-items:center; justify-content:center; flex-shrink:0; color:#1e1e1e;}
.b-py{background:var(--pyellow);}
.b-txt{background:#8b96a3;}
.b-md{background:#519aba;}
.b-yml{background:#e06c75;}
.b-docker{background:#3fb3d1;}
.tree-file .status{margin-left:auto; font-size:10px; color:var(--text-dim);}
.tree-file .status.todo{color:var(--yellow);}
.tree-file .status.done{color:var(--green);}

/* editor area */
.editor-area{flex:1; display:flex; flex-direction:column; min-width:0;}
.tabbar{display:flex; background:var(--tab-inactive); border-bottom:1px solid var(--border); overflow-x:auto; flex-shrink:0;}
.tab{padding:8px 14px; font-size:13px; color:var(--text-dim); background:var(--tab-inactive);
  border-right:1px solid var(--border); cursor:pointer; display:flex; align-items:center; gap:6px; white-space:nowrap;}
.tab.active{background:var(--tab-active); color:#fff; border-top:2px solid var(--blue);}

.editor-wrap{flex:1; display:flex; min-height:0;}
.editor-body{flex:1; display:flex; overflow:hidden;}
.gutter{background:var(--bg); color:#5a5a5a; text-align:right; padding:12px 10px 12px 0;
  font-size:13px; line-height:20px; user-select:none; flex-shrink:0; min-width:36px;
  white-space:pre; overflow:hidden;}
textarea.code{
  flex:1; background:var(--bg); color:var(--text); border:none; outline:none; resize:none;
  font-family:var(--mono); font-size:13px; line-height:20px; padding:12px 12px 12px 0;
  white-space:pre; overflow:auto; tab-size:4;
}
textarea.code:disabled{color:#8a8a8a; background:#1a1a1a;}
.editor-hint{
  position:absolute; margin:12px 0 0 46px; color:#5a5a5a; font-style:italic; pointer-events:none; font-size:13px;
}

/* terminal */
.termbar{flex-shrink:0; border-top:1px solid var(--border);}
.termtabs{display:flex; background:#252526; font-size:11px; color:var(--text-dim);}
.termtab{padding:8px 14px; cursor:pointer; letter-spacing:0.05em;}
.termtab.active{color:#fff; border-top:1px solid var(--blue);}
.termactions{margin-left:auto; display:flex; align-items:center; gap:8px; padding:0 12px;}
.term-btn{
  background:#0e639c; color:#fff; border:none; padding:5px 12px; font-size:11px;
  border-radius:2px; cursor:pointer; font-family:var(--mono); letter-spacing:0.03em;
}
.term-btn.secondary{background:#3a3d41;}
.term-btn:hover{filter:brightness(1.15);}
#terminal{
  height:220px; background:#181818; overflow-y:auto; padding:10px 14px; font-size:12.5px; line-height:1.65;
}
.tline{white-space:pre-wrap;}
.tline.ok{color:var(--green);}
.tline.fail{color:var(--red);}
.tline.warn{color:var(--yellow);}
.tline.dim{color:var(--text-dim);}
.tline.cmd{color:#fff;}
.tline.cmd::before{content:"$ "; color:var(--blue);}

/* status bar */
.statusbar{
  height:22px; background:var(--blue-status); display:flex; align-items:center; padding:0 10px;
  font-size:11px; color:#fff; gap:16px; flex-shrink:0;
}
.statusbar span{display:flex; align-items:center; gap:4px;}

/* coach panel */
.coach{width:320px; background:#252526; border-left:1px solid var(--border); flex-shrink:0;
  display:flex; flex-direction:column; overflow-y:auto;}
.coach-head{padding:12px 16px; border-bottom:1px solid var(--border); font-size:11px; letter-spacing:0.08em;
  color:var(--text-dim); font-weight:700;}
.coach-body{padding:12px 16px; flex:1; overflow-y:auto;}
.task{border:1px solid var(--border); border-radius:4px; margin-bottom:12px; background:#1e1e1e;}
.task-head{padding:10px 12px; font-size:12.5px; font-weight:700; color:#fff; display:flex;
  align-items:center; gap:8px;}
.task-num{width:18px; height:18px; border-radius:50%; background:#3a3d41; color:var(--text-dim);
  font-size:10px; display:flex; align-items:center; justify-content:center; flex-shrink:0;}
.task-num.done{background:var(--green); color:#1e1e1e;}
.task-body{padding:0 12px 12px 12px; font-size:12px; color:var(--text-dim); line-height:1.6;}
.task-body code{background:#0e0e0e; padding:1px 4px; border-radius:3px; color:var(--orange); font-size:11.5px;}
.task-actions{display:flex; gap:6px; margin-top:8px; flex-wrap:wrap;}
.mini-btn{
  background:#3a3d41; color:#fff; border:none; padding:5px 9px; font-size:10.5px;
  border-radius:2px; cursor:pointer; font-family:var(--mono);
}
.mini-btn:hover{background:#4a4d51;}
.mini-btn.primary{background:#0e639c;}
.mini-btn.primary:hover{background:#1177bb;}
.readme-render h1{font-size:16px; margin:0 0 8px 0; color:#fff;}
.readme-render h2{font-size:13px; margin:14px 0 6px 0; color:#fff;}
.readme-render p{margin:0 0 8px 0; color:var(--text); font-size:12.5px; line-height:1.6;}
.readme-render li{color:var(--text); font-size:12.5px; margin-bottom:4px;}
.readme-render code{background:#0e0e0e; padding:1px 4px; border-radius:3px; color:var(--orange);}

.b-theory{background:#f2a100;}

/* theory overlay */
#theoryOverlay{
  position:fixed; inset:0; background:#14181c; z-index:100; display:none;
  flex-direction:column;
}
#theoryOverlay.open{display:flex;}
.theory-bar{
  height:38px; flex-shrink:0; background:#252526; border-bottom:1px solid var(--border);
  display:flex; align-items:center; padding:0 14px; gap:10px; font-family:var(--mono); font-size:12px;
}
.theory-bar .ttitle{color:#fff; font-weight:700; display:flex; align-items:center; gap:8px;}
.theory-bar .tclose{
  margin-left:auto; background:#3a3d41; color:#fff; border:none; padding:5px 12px;
  border-radius:2px; cursor:pointer; font-family:var(--mono); font-size:11px;
}
.theory-bar .tclose:hover{background:#4a4d51;}
#theoryFrame{flex:1; border:none; width:100%;}

@media (max-width:1100px){
  .main{flex-direction:column; height:auto;}
  body{height:auto; min-height:100vh; overflow:auto;}
  .activitybar{width:100%; flex-direction:row; padding:6px 10px; gap:16px;}
  .explorer{width:100%; max-height:160px; border-right:none; border-bottom:1px solid var(--border);}
  .editor-wrap{height:320px;}
  #terminal{height:180px;}
  .coach{width:100%; border-left:none; border-top:1px solid var(--border); max-height:none;}
}
.coach-collapsed-note{display:none; padding:10px 16px; font-size:11px; color:var(--text-dim); background:#1e1e1e; border-bottom:1px solid var(--border);}
</style>
</head>

/* ---------------- file contents ---------------- */
const SOLUTIONS = {
  'test_calculator.py': `import pytest
from calculator import add, subtract, multiply, divide

def test_add():
    assert add(2, 3) == 5

def test_subtract():
    assert subtract(5, 2) == 3

def test_multiply():
    assert multiply(4, 3) == 12

def test_divide():
    assert divide(10, 2) == 5

def test_divide_by_zero():
    with pytest.raises(ValueError):
        divide(1, 0)
`,
  'Dockerfile': `FROM python:3.11-slim

WORKDIR /app

COPY requirements.txt .
RUN pip install --no-cache-dir -r requirements.txt

COPY . .

CMD ["pytest"]
`,
  '.github/workflows/ci-cd.yml': `name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: pytest

  build-and-push:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          username: \${{ secrets.REGISTRY_USER }}
          password: \${{ secrets.REGISTRY_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          push: true
          tags: calculator-app:\${{ github.sha }}
`
};

<style>

}
.acc-head .num{color:var(--amber); font-family:var(--mono); margin-right:10px;}
.acc-body{max-height:0; overflow:hidden; transition:max-height .3s ease; padding:0 18px;}
.acc-item.open .acc-body{max-height:600px; padding-bottom:16px;}
.acc-chevron{transition:transform .3s ease; color:var(--muted);}
.acc-item.open .acc-chevron{transform:rotate(180deg); color:var(--amber);}

/* ---------- deploy strategies ---------- */
.strat-card{background:var(--panel); border:1px solid var(--line); border-radius:6px; padding:18px;}

/* ---------- footer / roadmap ---------- */
.roadmap-item{display:flex; gap:14px; align-items:flex-start; margin-bottom:18px;}
.roadmap-item .idx{
  font-family:var(--mono); color:var(--amber); font-weight:700; font-size:0.9rem;
  border:1px solid var(--amber-dim); border-radius:50%; width:28px; height:28px;
  display:flex; align-items:center; justify-content:center; flex-shrink:0;
}
footer{padding:40px 0 80px; text-align:center; color:var(--muted); font-size:0.85rem;}

<body>

<div id="tracker">
  <div class="wrap" id="trackerRow"></div>
</div>

<div class="wrap">

<section id="hero">
  <div class="eyebrow">CI/CD &middot; from scratch</div>
  <h1>The assembly line<br>for your code</h1>
  <p class="muted" style="font-size:1.05rem; max-width:640px;">
    Every time you push code, something has to check it, test it, package it, and
    get it running somewhere. Do that by hand and you'll eventually skip a step
    at 2am and break production. CI/CD is the machine that does it for you, every time,
    the same way, without getting tired.
  </p>

  <div class="hero-diagram">
    <div class="node"><div class="box">&#9993;</div><div class="cap">Commit</div></div>
    <div class="arrow">&rarr;</div>
    <div class="node"><div class="box">&#9881;</div><div class="cap">Build</div></div>
    <div class="arrow">&rarr;</div>
    <div class="node"><div class="box">&#10003;</div><div class="cap">Test</div></div>
    <div class="arrow">&rarr;</div>
    <div class="node"><div class="box">&#128230;</div><div class="cap">Package</div></div>
    <div class="arrow">&rarr;</div>
    <div class="node"><div class="box">&#128640;</div><div class="cap">Deploy</div></div>
  </div>

  <p class="muted">
    That's it, that's the whole idea. Everything below is just filling in how each
    of those five stations actually works, and how to wire them together with real
    config. No prior CI/CD knowledge assumed.
  </p>
</section>

<section id="why" data-stage="commit">
  <h2>Why bother automating this?</h2>
  <p>Picture the manual version of shipping a change, versus the automated one.</p>
  <div class="grid2">
    <div class="card bad">
      <h3 style="color:var(--red);">Manual, by hand</h3>
      <ul>
        <li>You run the tests locally, if you remember to</li>
        <li>You SSH into a server and pull the latest code</li>
        <li>You restart the process and hope nothing broke</li>
        <li>Your teammate does it slightly differently</li>
        <li>Nobody's sure which server is actually running which version</li>
      </ul>
    </div>
    <div class="card good">
      <h3 style="color:var(--green);">Automated pipeline</h3>
      <ul>
        <li>Every push runs the full test suite, no exceptions</li>
        <li>The exact same steps run every single time</li>
        <li>A failing test blocks the deploy automatically</li>
        <li>Anyone on the team can ship, not just the one person who knows the steps</li>
        <li>There's a log of exactly what shipped and when</li>
      </ul>
    </div>
  </div>
  <p class="muted" style="margin-top:18px;">
    CI/CD isn't about fancy infrastructure. It's about removing the human as the
    one thing standing between "code that works on my machine" and "code that runs
    for real users."
  </p>
</section>

<section id="vocab" data-stage="commit">
  <h2>Three letters, two of them lie</h2>
  <p>CI/CD gets used as one term, but it's really three separate ideas stacked on top of each other.</p>

  <div class="tabs">
    <button class="tab-btn active" data-tab="ci">CI</button>
    <button class="tab-btn" data-tab="cdel">CD (delivery)</button>
    <button class="tab-btn" data-tab="cdep">CD (deployment)</button>
  </div>
  <div class="tab-panel active" data-tab="ci">
    <h3>Continuous Integration</h3>
    <p>Every time someone pushes code, it automatically gets built and tested. The goal
    is to catch a broken change within minutes, not weeks later when three other people
    have built on top of it. This is the "build + test" part of the diagram above.</p>
  </div>
  <div class="tab-panel" data-tab="cdel">
    <h3>Continuous Delivery</h3>
    <p>Once code passes CI, it's automatically packaged into something deployable
    (a Docker image, a build artifact) and staged, ready to go live. A human still
    clicks the button to actually release it. This is "always ready to ship," not
    "always shipping."</p>
  </div>
  <div class="tab-panel" data-tab="cdep">
    <h3>Continuous Deployment</h3>
    <p>The same as delivery, except there's no button to click. If it passes every
    stage, it goes live automatically. This is the full "no human in the loop" version,
    and it's what most people mean when they just say "CI/CD."</p>
  </div>
</section>

<section id="anatomy" data-stage="build">
  <h2>What's actually inside a pipeline</h2>
  <p>A pipeline definition (this example uses GitHub Actions, since it's the most common
  starting point) is just a YAML file that answers four questions. Click each one to see
  which part of the file it maps to.</p>

  <div class="anatomy">
    <div>
      <div class="anatomy-label active" data-hl="1"><b>Trigger.</b> What event kicks this off? A push, a pull request, a schedule.</div>
      <div class="anatomy-label" data-hl="2"><b>Job.</b> A group of steps that runs on its own machine (a "runner").</div>
      <div class="anatomy-label" data-hl="3"><b>Runner.</b> The actual virtual machine your job executes on.</div>
      <div class="anatomy-label" data-hl="4"><b>Steps.</b> The ordered list of individual commands or actions inside a job.</div>
    </div>
    <pre id="anatomyPre" style="margin:0;"></pre>
  </div>
</section>

<section id="builder" data-stage="build">
  <h2>Build one yourself</h2>
  <p>Tick the stages you want. The YAML on the right assembles itself as you go, this is
  a real, working GitHub Actions workflow for a Python app, not a toy example.</p>

  <div class="builder">
    <div id="stepOptions"></div>
    <div class="builder-preview">
      <pre id="builderYaml"></pre>
    </div>
  </div>
</section>

<section id="quiz1" data-stage="test">
  <h2>Quick check</h2>
  <div class="quiz">
    <div class="q">1. Your test suite fails on a pushed commit. What should happen?</div>
    <div class="opts">
      <button class="quiz-opt" data-correct="false">The commit gets merged anyway, tests can be flaky</button>
      <button class="quiz-opt" data-correct="true">The pipeline stops there and the deploy stage never runs</button>
      <button class="quiz-opt" data-correct="false">It emails someone and continues regardless</button>
    </div>
    <div class="quiz-feedback"></div>
  </div>
  <div class="quiz">
    <div class="q">2. What's the difference between Continuous Delivery and Continuous Deployment?</div>
    <div class="opts">
      <button class="quiz-opt" data-correct="false">There is no difference, they're the same thing</button>
      <button class="quiz-opt" data-correct="true">Delivery stages a release for a human to approve, deployment ships it automatically</button>
      <button class="quiz-opt" data-correct="false">Deployment only applies to mobile apps</button>
    </div>
    <div class="quiz-feedback"></div>
  </div>
</section>

<section id="walkthrough" data-stage="test">
  <h2>Reading a real pipeline, block by block</h2>
  <p>Here's a complete workflow for a FastAPI service: test on every push, then build and
  push a Docker image on merges to main. Open each block to see what it does.</p>

  <pre style="margin-bottom:20px;"><span class="mono">
<span class="c"># .github/workflows/ci-cd.yml</span>
<span class="k">name:</span> <span class="s">CI/CD</span>

<span class="k">on:</span>
  <span class="k">push:</span>
    <span class="k">branches:</span> [<span class="s">main</span>]
  <span class="k">pull_request:</span>
    <span class="k">branches:</span> [<span class="s">main</span>]

<span class="k">jobs:</span>
  <span class="k">test:</span>
    <span class="k">runs-on:</span> <span class="s">ubuntu-latest</span>
    <span class="k">steps:</span>
      - <span class="k">uses:</span> <span class="s">actions/checkout@v4</span>
      - <span class="k">uses:</span> <span class="s">actions/setup-python@v5</span>
        <span class="k">with:</span>
          <span class="k">python-version:</span> <span class="s">'3.11'</span>
      - <span class="k">run:</span> <span class="s">pip install -r requirements.txt</span>
      - <span class="k">run:</span> <span class="s">pytest</span>

  <span class="k">build-and-push:</span>
    <span class="k">needs:</span> <span class="s">test</span>
    <span class="k">if:</span> <span class="s">github.ref == 'refs/heads/main'</span>
    <span class="k">runs-on:</span> <span class="s">ubuntu-latest</span>
    <span class="k">steps:</span>
      - <span class="k">uses:</span> <span class="s">actions/checkout@v4</span>
      - <span class="k">uses:</span> <span class="s">docker/login-action@v3</span>
        <span class="k">with:</span>
          <span class="k">username:</span> <span class="s">\${{ secrets.REGISTRY_USER }}</span>
          <span class="k">password:</span> <span class="s">\${{ secrets.REGISTRY_TOKEN }}</span>
      - <span class="k">uses:</span> <span class="s">docker/build-push-action@v6</span>
        <span class="k">with:</span>
          <span class="k">push:</span> <span class="s">true</span>
          <span class="k">tags:</span> <span class="s">myapp:\${{ github.sha }}</span>

  <span class="k">deploy:</span>
    <span class="k">needs:</span> <span class="s">build-and-push</span>
    <span class="k">runs-on:</span> <span class="s">ubuntu-latest</span>
    <span class="k">steps:</span>
      - <span class="k">run:</span> <span class="s">curl -X POST $DEPLOY_HOOK_URL</span>
</span></pre>

  <div id="accordion"></div>
</section>

<section id="docker" data-stage="deploy">
  <h2>Where Docker fits in</h2>
  <p>You already know Docker builds a reproducible image, the pipeline connection is
  simple: CI builds and tests your code, then wraps it in an image, tags it with the
  commit hash, and pushes it to a registry. Deployment then just tells your host
  "run this exact tagged image."</p>
  <div class="grid3">
    <div class="card"><h3>Build</h3><p class="muted" style="font-size:0.88rem;">docker build tags the image with the git SHA, so every image traces back to an exact commit.</p></div>
    <div class="card"><h3>Push</h3><p class="muted" style="font-size:0.88rem;">The image goes to a registry (Docker Hub, GHCR, ECR) the pipeline authenticates into with a stored secret.</p></div>
    <div class="card"><h3>Pull</h3><p class="muted" style="font-size:0.88rem;">The deploy step tells the host to pull that tag and restart the container. Nothing gets rebuilt on the server.</p></div>
  </div>
</section>

<section id="strategies" data-stage="deploy">
  <h2>Getting it live without breaking things</h2>
  <p>"Deploy" can mean very different things depending on how much risk you're willing
  to take on. Hover each card.</p>
  <div class="grid3" id="stratGrid"></div>
</section>

<section id="roadmap" data-stage="live">
  <h2>Your first real pipeline, in order</h2>
  <div id="roadmapList"></div>
</section>

<footer>
  Built as a self-contained tutorial. Scroll back to the builder above any time you
  need to re-assemble the YAML.
</footer>

</div>

/* ---------------- validation ---------------- */
function validateFile(key, content){
  const c = content || '';
  if(key === 'test_calculator.py'){
    const checks = [
      {label:'imports from calculator', ok: /from\s+calculator\s+import/.test(c) || /import\s+calculator/.test(c)},
      {label:'at least 3 test_ functions', ok: (c.match(/def\s+test_/g)||[]).length >= 3},
      {label:'uses assert statements', ok: (c.match(/assert\s/g)||[]).length >= 3},
      {label:'covers divide-by-zero error case', ok: /pytest\.raises|ValueError/.test(c)}
    ];
    return {pass: checks.every(x=>x.ok), checks};
  }
  if(key === 'Dockerfile'){
    const checks = [
      {label:'FROM base image', ok: /^FROM\s+\S+/mi.test(c)},
      {label:'WORKDIR set', ok: /^WORKDIR\s+\S+/mi.test(c)},
      {label:'copies requirements before install', ok: /COPY\s+requirements\.txt/i.test(c)},
      {label:'installs dependencies', ok: /RUN\s+pip install/i.test(c)},
      {label:'copies app code', ok: /^COPY\s+\.\s+\./mi.test(c)},
      {label:'has a CMD or ENTRYPOINT', ok: /^(CMD|ENTRYPOINT)\s/mi.test(c)}
    ];
    return {pass: checks.every(x=>x.ok), checks};
  }
  if(key === '.github/workflows/ci-cd.yml'){
    const checks = [
      {label:'has a trigger (on:)', ok: /^\s*on:/mi.test(c) && /push/.test(c)},
      {label:'has a jobs: block', ok: /^\s*jobs:/mi.test(c)},
      {label:'specifies runs-on', ok: /runs-on:/i.test(c)},
      {label:'checks out the code', ok: /actions\/checkout/i.test(c)},
      {label:'runs pytest', ok: /pytest/i.test(c)}
    ];
    return {pass: checks.every(x=>x.ok), checks};
  }
  return {pass:true, checks:[]};
}

function renderReadme(md){
  const lines = md.split('\n');
  let html = '<div class="readme-render">';
  let inList = false;
  lines.forEach(line=>{
    if(line.startsWith('# ')){ html += '<h1>'+line.slice(2)+'</h1>'; return; }
    if(line.startsWith('## ')){ if(inList){html+='</ol>'; inList=false;} html += '<h2>'+line.slice(3)+'</h2>'; return; }
    if(/^\d+\./.test(line)){
      if(!inList){ html += '<ol>'; inList = true; }
      html += '<li>'+line.replace(/^\d+\.\s*/, '')+'</li>';
      return;
    }
    if(inList){ html += '</ol>'; inList = false; }
    if(line.trim()==='') return;
    html += '<p>'+line.replace(/"([^"]+)"/g,'<code>$1</code>')+'</p>';
  });
  if(inList) html += '</ol>';
  html += '</div>';
  return html;
}
