<style>
  :root{
    --bg:        #0A0D11;
    --panel:     #11161D;
    --panel-2:   #161C24;
    --rail:      #0D1218;
    --border:    #232B36;
    --border-lit:#33404F;
    --text:      #DCE3EC;
    --muted:     #8A97A8;
    --faint:     #5A6675;

    --green:     #3FB950;
    --green-dim: #1B3A22;
    --red:       #F0654F;
    --amber:     #D6A138;
    --blue:      #58A6FF;
    --purple:    #BC8CFF;

    --mono:'JetBrains Mono', ui-monospace, Consolas, monospace;
    --sans:'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
  }

  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; background:var(--bg); color:var(--text); font-family:var(--sans); }
  body{ min-height:100vh; }
  ::selection{ background:var(--green-dim); color:#fff; }

  /* ---------- top bar ---------- */

  .topbar{
    height:52px;
    border-bottom:1px solid var(--border);
    background:var(--rail);
    display:flex; align-items:center; gap:12px;
    padding:0 18px;
    position:sticky; top:0; z-index:30;
  }
  .repo{
    font-family:var(--mono); font-size:13px; color:var(--muted);
    display:flex; align-items:center; gap:7px; min-width:0;
  }
  .repo b{ color:var(--text); font-weight:600; }
  .repo .slash{ color:var(--faint); }
  .tab-actions{
    margin-left:8px;
    font-size:13px; font-weight:600; color:var(--text);
    padding:4px 0 12px;
    border-bottom:2px solid var(--amber);
  }
  .topbar .spacer{ flex:1; }
  .runcount{
    font-family:var(--mono); font-size:11.5px; color:var(--faint);
    border:1px solid var(--border); border-radius:999px; padding:4px 11px;
    white-space:nowrap;
  }

  /* ---------- layout ---------- */

  .app{ display:flex; align-items:flex-start; }

  .sidebar{
    width:252px; flex-shrink:0;
    background:var(--rail);
    border-right:1px solid var(--border);
    position:sticky; top:52px;
    height:calc(100vh - 52px);
    overflow-y:auto;
    padding:16px 0 40px;
  }
  .side-head{
    font-family:var(--mono); font-size:10.5px; letter-spacing:.14em;
    text-transform:uppercase; color:var(--faint);
    padding:0 16px 10px;
  }
  .lesson-btn{
    width:100%; text-align:left; background:none; border:0;
    border-left:2px solid transparent;
    padding:10px 16px; cursor:pointer;
    display:flex; gap:10px; align-items:flex-start;
    color:var(--muted); font-family:var(--sans);
    transition:background .13s, color .13s;
  }
  .lesson-btn:hover{ background:var(--panel); color:var(--text); }
  .lesson-btn.active{ background:var(--panel); color:var(--text); border-left-color:var(--amber); }
  .lesson-btn .st{
    flex-shrink:0; width:15px; height:15px; margin-top:1px;
    border-radius:50%; border:1.5px solid var(--border-lit);
    display:grid; place-items:center;
    font-size:9px; color:transparent; line-height:1;
  }
  .lesson-btn.done .st{ background:var(--green); border-color:var(--green); color:#06210C; }
  .lesson-btn .lab{ min-width:0; }
  .lesson-btn .num{
    font-family:var(--mono); font-size:10px; color:var(--faint);
    display:block; margin-bottom:2px;
  }
  .lesson-btn .ttl{ font-size:13px; font-weight:500; line-height:1.35; display:block; }

  .side-progress{ padding:16px 16px 0; margin-top:8px; border-top:1px solid var(--border); }
  .side-progress .bar{ height:4px; background:var(--border); border-radius:999px; overflow:hidden; }
  .side-progress .fill{ height:100%; background:var(--green); width:0; transition:width .35s ease; }
  .side-progress .txt{ font-family:var(--mono); font-size:10.5px; color:var(--faint); margin-top:7px; }

  main{ flex:1; min-width:0; padding:34px 40px 90px; max-width:900px; }

  /* ---------- lesson head ---------- */

  .eyebrow{
    font-family:var(--mono); font-size:11px; letter-spacing:.13em;
    text-transform:uppercase; color:var(--amber); margin-bottom:10px;
  }
  h1{ font-size:29px; line-height:1.2; letter-spacing:-0.02em; margin:0 0 12px; font-weight:700; }
  .tagline{ font-size:15.5px; line-height:1.65; color:var(--muted); margin:0 0 30px; max-width:64ch; }

  h2{
    font-size:15px; font-weight:600; margin:0 0 12px;
    display:flex; align-items:baseline; gap:9px;
  }
  h2 .idx{ font-family:var(--mono); font-size:11px; color:var(--faint); }

  section.block{
    border-top:1px solid var(--border);
    padding:24px 0 4px;
  }
  section.block p{ font-size:14.5px; line-height:1.72; color:#C3CCD8; margin:0 0 14px; max-width:70ch; }
  section.block p:last-child{ margin-bottom:0; }
  section.block strong{ color:var(--text); font-weight:600; }
  code.inline{
    font-family:var(--mono); font-size:12.5px;
    background:var(--panel-2); border:1px solid var(--border);
    border-radius:4px; padding:1px 5px; color:var(--blue);
  }

  .note{
    border-left:2px solid var(--amber);
    background:rgba(214,161,56,.05);
    padding:13px 16px; margin:16px 0 0;
    font-size:13.8px; line-height:1.65; color:#C3CCD8;
    max-width:70ch;
  }
  .note b{ color:var(--amber); }
  .note.bad{ border-left-color:var(--red); background:rgba(240,101,79,.05); }
  .note.bad b{ color:var(--red); }

  /* ---------- yaml ---------- */

  .yaml{
    background:#070A0D; border:1px solid var(--border); border-radius:6px;
    margin:4px 0 0; overflow:hidden;
  }
  .yaml-head{
    display:flex; align-items:center; gap:8px;
    background:var(--panel); border-bottom:1px solid var(--border);
    padding:7px 13px;
    font-family:var(--mono); font-size:11.5px; color:var(--muted);
  }
  .yaml-head .dot{ width:8px; height:8px; border-radius:50%; background:var(--border-lit); }
  .yaml pre{
    margin:0; padding:15px 16px; overflow-x:auto;
    font-family:var(--mono); font-size:12.6px; line-height:1.75; color:#B9C4D2;
    tab-size:2;
    /* JetBrains Mono renders != as ≠. Pretty, but this is a course about YAML
       people have to type character for character — show the real glyphs. */
    font-variant-ligatures:none;
    -webkit-font-feature-settings:"liga" 0, "calt" 0;
    font-feature-settings:"liga" 0, "calt" 0;
  }
  .yaml .k{ color:#79C0FF; }
  .yaml .p{ color:var(--faint); }
  .yaml .d{ color:var(--purple); }
  .yaml .s{ color:#A5D6A7; }
  .yaml .c{ color:#5C6B7C; font-style:italic; }
  .yaml .e{ color:var(--amber); }

  /* ---------- builder ---------- */

  .builder{
    border:1px solid var(--border); border-radius:6px;
    background:var(--panel); overflow:hidden; margin-top:4px;
  }
  .builder-prompt{
    padding:14px 16px; font-size:14px; line-height:1.6;
    border-bottom:1px solid var(--border); color:#C3CCD8;
  }
  .builder-prompt b{ color:var(--amber); }
  .build-lines{ background:#070A0D; padding:8px 0; }
  .bline{
    display:flex; align-items:center; gap:0;
    font-family:var(--mono); font-size:12.6px; line-height:1.9;
    padding:0 14px; white-space:pre;
    overflow-x:auto;
    font-variant-ligatures:none;
    font-feature-settings:"liga" 0, "calt" 0;
  }
  .bline.opt{ cursor:pointer; }
  .bline.opt:hover{ background:rgba(255,255,255,.03); }
  .bline .tick{
    width:20px; flex-shrink:0; color:var(--faint); font-size:11px;
  }
  .bline.fixed .tick{ color:transparent; }
  .bline.on .tick{ color:var(--green); }
  .bline .txt{ color:#5A6675; }
  .bline.on .txt, .bline.fixed .txt{ color:#B9C4D2; }
  .bline.on .txt .k, .bline.fixed .txt .k{ color:#79C0FF; }
  .builder-actions{
    display:flex; align-items:center; gap:12px;
    padding:12px 14px; border-top:1px solid var(--border);
  }
  .builder-msg{ font-family:var(--mono); font-size:11.5px; }
  .builder-msg.ok{ color:var(--green); }
  .builder-msg.no{ color:var(--red); }

  /* ---------- buttons ---------- */

  .btn{
    font-family:var(--sans); font-size:13px; font-weight:600;
    padding:7px 15px; border-radius:6px; cursor:pointer;
    border:1px solid var(--border-lit);
    background:var(--panel-2); color:var(--text);
    transition:background .14s, border-color .14s, opacity .14s;
  }
  .btn:hover:not(:disabled){ background:#1E2732; border-color:#44515F; }
  .btn:disabled{ opacity:.45; cursor:not-allowed; }
  .btn.run{
    background:var(--green-dim); border-color:#2A6B36; color:#8CE99A;
  }
  .btn.run:hover:not(:disabled){ background:#204A29; border-color:#3FB950; }

  /* ---------- run panel ---------- */

  .runpanel{
    border:1px solid var(--border); border-radius:6px;
    background:var(--panel); overflow:hidden; margin-top:16px;
  }
  .run-head{
    display:flex; align-items:center; gap:11px;
    padding:13px 15px; border-bottom:1px solid var(--border);
    background:var(--panel-2);
  }
  .run-title{ font-size:13.5px; font-weight:600; }
  .run-sub{ font-family:var(--mono); font-size:11px; color:var(--faint); margin-top:2px; }
  .run-status{
    margin-left:auto;
    font-family:var(--mono); font-size:11px;
    padding:3px 10px; border-radius:999px; white-space:nowrap;
    border:1px solid var(--border-lit); color:var(--muted);
  }
  .run-status.running{ color:var(--amber); border-color:#5A4A1E; background:rgba(214,161,56,.08); }
  .run-status.ok{ color:var(--green); border-color:#2A6B36; background:rgba(63,185,80,.08); }
  .run-status.fail{ color:var(--red); border-color:#6B2A22; background:rgba(240,101,79,.08); }

  .jobname{
    font-family:var(--mono); font-size:11px; color:var(--faint);
    padding:10px 15px 4px; letter-spacing:.06em; text-transform:uppercase;
  }

  .step{ border-top:1px solid var(--border); }
  .step:first-of-type{ border-top:0; }
  .step-head{
    display:flex; align-items:center; gap:10px;
    padding:9px 15px; cursor:pointer;
    font-family:var(--mono); font-size:12.3px; color:var(--muted);
    transition:background .12s;
  }
  .step-head:hover{ background:var(--panel-2); }
  .step.pending .step-head{ opacity:.4; cursor:default; }
  .step .caret{ color:var(--faint); font-size:9px; width:9px; transition:transform .16s; }
  .step.open .caret{ transform:rotate(90deg); }
  .step .ico{ width:14px; text-align:center; flex-shrink:0; font-size:12px; }
  .step.ok  .ico{ color:var(--green); }
  .step.fail .ico{ color:var(--red); }
  .step.running .ico{ color:var(--amber); animation:spin 1s linear infinite; }
  .step.pending .ico{ color:var(--faint); }
  .step.ok .step-head, .step.fail .step-head{ color:var(--text); }
  .step .dur{ margin-left:auto; color:var(--faint); font-size:11px; }

  @keyframes spin{ to{ transform:rotate(360deg); } }

  .step-log{
    display:none;
    background:#070A0D; border-top:1px solid var(--border);
    padding:11px 15px 13px 48px;
    font-family:var(--mono); font-size:11.8px; line-height:1.85; color:#8A97A8;
    white-space:pre-wrap; word-break:break-word;
  }
  .step.open .step-log{ display:block; }
  .step-log .g{ color:var(--green); }
  .step-log .r{ color:var(--red); }
  .step-log .y{ color:var(--amber); }
  .step-log .dim{ color:#4A5563; }

  /* ---------- quiz ---------- */

  .quiz-q{ margin-bottom:22px; }
  .quiz-q:last-of-type{ margin-bottom:14px; }
  .qtext{ font-size:14.5px; line-height:1.6; margin-bottom:11px; font-weight:500; }
  .opts{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:7px; }
  .opts button{
    width:100%; text-align:left;
    font-family:var(--sans); font-size:13.8px; line-height:1.5;
    padding:10px 13px; border-radius:6px; cursor:pointer;
    border:1px solid var(--border); background:var(--panel);
    color:#C3CCD8; transition:border-color .14s, background .14s;
  }
  .opts button:hover:not(:disabled){ border-color:var(--border-lit); background:var(--panel-2); }
  .opts button.selected{ border-color:var(--amber); }
  .opts button.correct{ border-color:var(--green); background:rgba(63,185,80,.09); color:#A9E5B4; }
  .opts button.wrong{ border-color:var(--red); background:rgba(240,101,79,.08); color:#F3A99A; }
  .opts button:disabled{ cursor:default; }
  .why{
    display:none; margin-top:10px; padding:11px 14px;
    border-left:2px solid var(--green); background:rgba(63,185,80,.05);
    font-size:13.5px; line-height:1.65; color:#C3CCD8;
  }
  .why.show{ display:block; }
  .why b{ color:var(--green); }

  /* ---------- footer nav ---------- */

  .lesson-foot{
    display:flex; align-items:center; gap:12px;
    margin-top:34px; padding-top:22px; border-top:1px solid var(--border);
  }
  .done-flag{
    font-family:var(--mono); font-size:11.5px; color:var(--green);
    display:flex; align-items:center; gap:7px;
  }
  .lesson-foot .spacer{ flex:1; }

  /* ---------- responsive ---------- */

  @media (max-width:900px){
    .app{ flex-direction:column; }
    .sidebar{
      width:100%; height:auto; position:static;
      border-right:0; border-bottom:1px solid var(--border);
      display:flex; overflow-x:auto; padding:10px;
      gap:6px;
    }
    .side-head, .side-progress{ display:none; }
    .lesson-btn{
      width:auto; white-space:nowrap; border-left:0;
      border-bottom:2px solid transparent; border-radius:6px;
      padding:8px 12px;
    }
    .lesson-btn.active{ border-left:0; border-bottom-color:var(--amber); }
    .lesson-btn .ttl{ display:none; }
    .lesson-btn .num{ margin:0; font-size:11.5px; }
    main{ padding:24px 18px 80px; }
    h1{ font-size:24px; }
  }

  @media (prefers-reduced-motion:reduce){
    *{ animation:none !important; transition:none !important; }
  }
</style>

<div class="app">

<script>
/* ==========================================================================
   Content
   ========================================================================== */

const LESSONS = [
{
  id:0,
  title:"Anatomy of a workflow",
  eyebrow:"Level 1",
  tagline:"Before any syntax: what a workflow actually is, and the one rule that explains most of the confusion people hit later.",
  blocks:[
    {h:"Where workflows live", p:[
      "A workflow is a YAML file in <code class='inline'>.github/workflows/</code>. The filename doesn't matter; GitHub picks up every <code class='inline'>.yml</code> and <code class='inline'>.yaml</code> file in that exact directory. Put one somewhere else and nothing happens — no error, no warning, just silence.",
      "GitHub Actions itself is a general automation runner. <strong>CI is one thing you can point it at, not what it is.</strong> Deploys, scheduled jobs, issue triage and code generation are all the same machinery with a different trigger."
    ]},
    {h:"Three levels", p:[
      "A workflow contains <strong>jobs</strong>. A job contains <strong>steps</strong>. That's the whole hierarchy."
    ], yaml:
`name: Course registry        # label shown in the Actions tab

on:                          # WHEN this runs
  push:
    branches: [main]

jobs:
  rebuild:                   # a job id you choose
    runs-on: ubuntu-latest   # which machine to rent
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/build-registry.mjs`
    },
    {h:"The rule that explains everything", p:[
      "<strong>Every job gets a brand-new, empty virtual machine.</strong> Jobs run in parallel by default and share nothing — not files, not installed tools, not environment variables. Steps inside one job run in order on that same machine and do share everything.",
      "This is why almost every job starts with <code class='inline'>actions/checkout</code>. The machine boots with no idea what your repository is. If you don't explicitly clone it, your code simply isn't there."
    ], note:{t:"Most 'why doesn't this work' moments trace back to forgetting that jobs are isolated. A file written in job A does not exist in job B.", b:"Remember"}}
  ],
  build:{
    prompt:"A teammate wrote this workflow, but it never runs and the script can't find the repo. <b>Toggle on the two lines it's missing.</b>",
    lines:[
      {t:"name: Nightly check", fixed:true},
      {t:"", fixed:true},
      {t:"on:", fixed:true},
      {t:"  workflow_dispatch:", fixed:true},
      {t:"", fixed:true},
      {t:"jobs:", fixed:true},
      {t:"  check:", fixed:true},
      {t:"    runs-on: ubuntu-latest", want:true},
      {t:"    steps:", fixed:true},
      {t:"      - uses: actions/checkout@v4", want:true},
      {t:"      - uses: actions/upload-artifact@v4", want:false},
      {t:"      - run: node scripts/check.mjs", fixed:true}
    ],
    hint:"A job has to say which machine it wants, and the machine starts empty."
  },
  run:{
    title:"Nightly check", sub:"main · manual trigger · ubuntu-latest",
    jobs:[{name:"check", steps:[
      {n:"Set up job", ms:500, log:"Runner image: ubuntu-24.04\nRunner name: GitHub Actions 12\n<span class='dim'>Preparing a clean virtual machine…</span>"},
      {n:"Run actions/checkout@v4", ms:900, log:"Syncing repository: sheikhmunim/Ulearn\n<span class='dim'>git init / git fetch --depth=1</span>\n<span class='g'>✓</span> Repository now present on the runner"},
      {n:"Run node scripts/check.mjs", ms:800, log:"Checked 4 courses\n<span class='g'>All good.</span>"},
      {n:"Complete job", ms:300, log:"<span class='dim'>Cleaning up. The machine is destroyed — nothing here survives.</span>"}
    ]}]
  },
  quiz:[
    {q:"Job A writes a file to disk. Job B, in the same workflow, tries to read it. What happens?",
     opts:["It works — jobs share a filesystem","Job B fails; each job is a separate machine","It works only if A uses `needs`","Job B reads an older cached copy"],
     correct:1,
     why:"Jobs are fully isolated VMs. `needs:` controls ordering, not storage — to pass files between jobs you have to upload and download an artifact."},
    {q:"Why does nearly every job begin with actions/checkout?",
     opts:["It authenticates you to GitHub","It caches dependencies","The runner starts empty and has no copy of your repo","It's required by YAML"],
     correct:2,
     why:"The runner is a blank machine. Without an explicit checkout your repository simply isn't on it."}
  ]
},

{
  id:1,
  title:"Triggers — the on: block",
  eyebrow:"Level 2",
  tagline:"Every other part of the file describes what to do. This one decides when — and it is where the real range of Actions lives.",
  blocks:[
    {h:"Far more than pushes", p:[
      "Once you see <code class='inline'>schedule</code> and <code class='inline'>issues</code> in this list, Actions stops looking like a test runner and starts looking like what it is: <strong>a cron server plus an event bus, attached to your repository.</strong>"
    ], yaml:
`on:
  push:                      # code landed on a branch
    branches: [main]
    paths: ["courses/**"]    # …and only if these files changed
  pull_request:              # someone proposed a change
  schedule:
    - cron: "0 9 * * 1"      # every Monday 09:00 UTC
  workflow_dispatch:         # a manual "Run workflow" button
  issues:
    types: [opened]
  release:
    types: [published]`
    },
    {h:"Filters narrow the firehose", p:[
      "<code class='inline'>branches</code>, <code class='inline'>paths</code> and <code class='inline'>tags</code> stop a workflow burning minutes on changes it doesn't care about. A registry rebuild that only matters when a course changes should say so — otherwise every README typo triggers it."
    ]},
    {h:"Always add workflow_dispatch", p:[
      "This is the single highest-value line for anyone learning. It puts a manual <strong>Run workflow</strong> button in the Actions tab, so you can retrigger without inventing a fake commit. The feedback loop for workflows is brutally slow — push, wait, read logs, fix a typo, push again — and this halves it."
    ], note:{t:"Scheduled runs use UTC, never your local time. GitHub also delays them under load, sometimes by many minutes, so never rely on `schedule` for anything that must happen at an exact moment.", b:"Two catches"}},
    {h:"The YAML landmine", p:[
      "In YAML 1.1, a bare <code class='inline'>on</code> is a <strong>boolean</strong>, not the string \"on\". GitHub's own parser handles it, but third-party YAML tools may hand you back the key <code class='inline'>True</code> instead. If you ever lint or script over your own workflow files and can't find the <code class='inline'>on</code> key, that's why."
    ], note:{t:"This is real, not trivia. Validating a workflow with Python's yaml library returns True as the key, and code looking for \"on\" silently finds nothing.", b:"Gotcha", bad:true}}
  ],
  build:{
    prompt:"Build the trigger block for a link checker: it should run <b>every Monday morning</b>, be <b>manually runnable</b>, and must <b>not</b> run on every push.",
    lines:[

{
  id:2,
  title:"Steps — uses versus run",
  eyebrow:"Level 3",
  tagline:"Every step is one of exactly two things: somebody else's reusable action, or your own shell command.",
  blocks:[
    {h:"run: is just a shell", p:[
      "<code class='inline'>run</code> executes on the runner in bash (on Linux and macOS) or pwsh (on Windows). Multi-line commands use the YAML block scalar <code class='inline'>|</code>, and the whole block runs as one script — so a <code class='inline'>cd</code> on line one affects line two."
    ], yaml:
`- name: Rebuild and report      # optional label in the log
  run: |
    node scripts/build-registry.mjs
    echo "Done at $(date)"
  working-directory: ./tools     # optional
  env:
    NODE_ENV: production`
    },
    {h:"uses: is somebody else's step", p:[
      "<code class='inline'>uses</code> pulls in a published action — a packaged, reusable step. The syntax is <code class='inline'>owner/repo@ref</code>, and its inputs go under <code class='inline'>with</code>."
    ], yaml:
`- uses: actions/checkout@v4

- uses: actions/setup-node@v4
  with:
    node-version: "20"
    cache: npm                   # inputs defined by that action`
    },
    {h:"Pinning, and why it matters", p:[
      "<code class='inline'>@v4</code> is a tag that the author can move. That's convenient — you get fixes automatically — but it means <strong>you are running code that can change under you.</strong> For third-party actions handling anything sensitive, pin to a full commit SHA instead, which is immutable.",
      "First-party <code class='inline'>actions/*</code> at a major tag is the normal, accepted trade-off. A random action from a stranger that touches your secrets is where SHA pinning earns its keep."
    ], note:{t:"A moved tag on a compromised third-party action is a real supply-chain attack path, and it has happened. `uses: some-user/action@v1` is a standing invitation to run whatever they publish next.", b:"Security", bad:true}}
  ],
  build:{
    prompt:"Assemble a job that checks out the code, sets up Node 20, and runs the registry check. <b>Order matters</b> — but here, just pick the right lines.",
    lines:[
      {t:"jobs:", fixed:true},
      {t:"  verify:", fixed:true},
      {t:"    runs-on: ubuntu-latest", fixed:true},
      {t:"    steps:", fixed:true},
      {t:"      - uses: actions/checkout@v4", want:true},
      {t:"      - uses: actions/setup-node@v4", want:true},
      {t:"        with:", want:true},
      {t:"          node-version: \"20\"", want:true},
      {t:"      - uses: actions/setup-python@v5", want:false},
      {t:"      - run: node scripts/build-registry.mjs --check", want:true}
    ],
    hint:"Five lines. There is no Python in this project."
  },
  run:{
    title:"Course registry", sub:"pull_request #12 · verify",
    jobs:[{name:"verify", steps:[
      {n:"Set up job", ms:400, log:"Runner image: ubuntu-24.04"},
      {n:"Run actions/checkout@v4", ms:650, log:"<span class='g'>✓</span> Checked out PR head"},
      {n:"Run actions/setup-node@v4", ms:900, log:"Installing Node.js 20.11.1\n<span class='g'>✓</span> node -v → v20.11.1"},
      {n:"Run node scripts/build-registry.mjs --check", ms:700, log:"Registry is up to date (5 courses).\n<span class='g'>✓</span> No drift between courses/ and data/courses.js"},
      {n:"Complete job", ms:250, log:"<span class='dim'>Job succeeded in 2.9s</span>"}
    ]}]
  },
  quiz:[
    {q:"What does pinning an action to a full commit SHA protect you from?",
     opts:["Slower runs","The action's author moving the tag to different code","Rate limiting","YAML parse errors"],
     correct:1,
     why:"A tag like @v4 is mutable — the author can repoint it at any time, including at malicious code. A SHA cannot be changed, so you keep running exactly what you reviewed."},
    {q:"In a multi-line `run: |` block, does `cd build` on the first line affect the second line?",
     opts:["Yes — the block runs as a single script","No — each line is a separate shell","Only with working-directory set","Only on Windows runners"],
     correct:0,
     why:"The whole block is written to one script file and executed once, so state like the working directory carries across lines. Separate `run:` steps do not share it."}

{
  id:3,
  title:"Expressions and contexts",
  eyebrow:"Level 4",
  tagline:"Expressions are how a workflow finds out what happened to it — who pushed, on which branch, whether the previous step failed.",
  blocks:[
    {h:"Evaluated before the shell sees it", p:[
      "<code class='inline'>${{ }}</code> is GitHub's own expression syntax. It is substituted <strong>before</strong> your command runs, so by the time bash executes, only the resulting text is there. That's why it looks like shell interpolation but obeys entirely different rules."
    ], yaml:
`- run: echo "Triggered by \${{ github.event_name }}"
- run: echo "Branch: \${{ github.ref_name }}"
- run: echo "By: \${{ github.actor }}"`
    },
    {h:"The contexts worth memorising", p:[
      "<code class='inline'>github.*</code> — the event: <code class='inline'>event_name</code>, <code class='inline'>ref</code>, <code class='inline'>sha</code>, <code class='inline'>actor</code>, <code class='inline'>repository</code>.<br><code class='inline'>secrets.*</code> — encrypted values you configured.<br><code class='inline'>steps.*</code> — outputs from earlier steps in this job.<br><code class='inline'>needs.*</code> — outputs from jobs this one depends on.<br><code class='inline'>runner.*</code> — the machine: <code class='inline'>os</code>, <code class='inline'>temp</code>."
    ]},
    {h:"Conditions with if:", p:[
      "<code class='inline'>if:</code> works on a step or a whole job. Inside <code class='inline'>if:</code> the braces are <strong>optional</strong> — it's already an expression context — which is why you'll see it written both ways."
    ], yaml:
`jobs:
  rebuild:
    if: github.event_name != 'pull_request'
    steps:
      - run: ./deploy.sh
        if: success()          # the default

      - run: ./notify-failure.sh
        if: failure()          # only when something broke

      - run: ./cleanup.sh
        if: always()           # even after a failure`
    },
    {h:"Passing values along", p:[
      "Steps talk to each other through files, not variables. Append to <code class='inline'>$GITHUB_OUTPUT</code> to publish a value, and <code class='inline'>$GITHUB_STEP_SUMMARY</code> to write Markdown onto the run's summary page — which is by far the nicest way to surface a result without digging through logs."
    ], yaml:
`- id: count
  run: echo "n=5" >> "$GITHUB_OUTPUT"

- run: echo "Found \${{ steps.count.outputs.n }} courses"

- run: echo "### All green" >> "$GITHUB_STEP_SUMMARY"`
    }
  ],
  build:{
    prompt:"This job should <b>only run on pull requests</b>, and should post a summary <b>even if an earlier step failed</b>. Toggle the two lines that achieve it.",
    lines:[
      {t:"jobs:", fixed:true},
      {t:"  verify:", fixed:true},
      {t:"    if: github.event_name == 'pull_request'", want:true},
      {t:"    if: github.ref == 'refs/heads/main'", want:false},
      {t:"    runs-on: ubuntu-latest", fixed:true},
      {t:"    steps:", fixed:true},
      {t:"      - run: npm run check:registry", fixed:true},
      {t:"      - run: ./summary.sh", fixed:true},
      {t:"        if: always()", want:true},
      {t:"        if: success()", want:false}
    ],
    hint:"`success()` is already the default, so it would change nothing."
  },
  run:{
    title:"Course registry", sub:"pull_request #12 · opened by sheikhmunim",
    jobs:[{name:"verify", steps:[
      {n:"Set up job", ms:400, log:"<span class='dim'>github.event_name = pull_request</span>\n<span class='dim'>github.actor = sheikhmunim</span>\nJob condition met — running."},
      {n:"Run npm run check:registry", ms:1100, fail:true, log:"Registry is stale — data/courses.js does not match the course files.\nRun `npm run build:registry` and commit the result.\n<span class='r'>✗ Process completed with exit code 1</span>"},
      {n:"Run ./summary.sh", ms:500, log:"<span class='y'>Ran anyway because of if: always()</span>\nWrote 3 lines to the run summary."},
      {n:"Complete job", ms:250, fail:true, log:"<span class='r'>Job failed.</span> <span class='dim'>The summary step still executed — that's the point of always().</span>"}
    ]}]
  },
  quiz:[
    {q:"A step has no `if:` at all. When does it run?",
     opts:["Always, even after failures","Only if every previous step succeeded","Only on push events","Only if explicitly needed"],
     correct:1,
     why:"The implicit default is `if: success()`. Once a step fails, later steps are skipped unless they opt in with always() or failure()."},
    {q:"When is `${{ github.event_name }}` replaced with its value?",
     opts:["By bash, at runtime","By GitHub, before the shell runs","By the checkout action","Only inside `if:` blocks"],
     correct:1,
     why:"GitHub evaluates expressions and substitutes the text before handing the command to the shell. Bash never sees the ${{ }} syntax at all."}

{
  id:4,
  title:"Permissions and secrets",
  eyebrow:"Level 5",
  tagline:"Every run gets a token. Understanding what that token can do is the difference between a workflow that works and one that quietly hands strangers write access.",
  blocks:[
    {h:"GITHUB_TOKEN", p:[
      "Every run is issued a temporary <code class='inline'>GITHUB_TOKEN</code> automatically, scoped to that repository and expiring when the run ends. You don't create it and shouldn't try to replace it for ordinary work.",
      "What it's <em>allowed</em> to do is set by the <code class='inline'>permissions</code> block. Declare the least you need."
    ], yaml:
`permissions:
  contents: write        # push commits, create tags
  issues: write          # open or comment on issues
  pull-requests: write   # comment on PRs
  # everything unlisted becomes 'none'`
    },
    {h:"Why this bites people", p:[
      "If the default is read-only and your job tries <code class='inline'>git push</code>, you get a <strong>403</strong> that looks like a credentials problem but isn't. The Ulearn registry workflow needs <code class='inline'>contents: write</code> for exactly this reason — it commits the regenerated registry back."
    ]},
    {h:"Secrets, and the fork rule", p:[
      "<code class='inline'>${{ secrets.NAME }}</code> reads an encrypted value you configured in repository, environment, or organisation settings. Secrets are masked in logs — but masking is best-effort pattern matching, not a guarantee. Never deliberately print one.",
      "<strong>Pull requests from forks get no secrets, and a read-only token.</strong> This is deliberate: otherwise anyone could open a PR whose workflow prints your credentials."
    ], note:{t:"That fork rule is exactly why the Ulearn registry workflow verifies on PRs instead of committing. A fork's run could not push back even if you asked it to.", b:"Design consequence"}},
    {h:"The dangerous escape hatch", p:[
      "<code class='inline'>pull_request_target</code> runs in the context of the <em>base</em> repository, with secrets and a writable token, while checking out untrusted PR code. Combining it with a checkout of the PR head is a well-known way to hand a stranger your repository. If you don't fully understand it, don't use it."
    ], note:{t:"pull_request_target plus `ref: github.event.pull_request.head.sha` is the classic exploitable pattern. Treat it as expert-only.", b:"Do not copy blindly", bad:true}}
  ],
  build:{
    prompt:"This job commits a regenerated file back to main and opens an issue if something looks wrong. <b>Grant exactly the permissions it needs — no more.</b>",
    lines:[
      {t:"permissions:", fixed:true},
      {t:"  contents: write", want:true},
      {t:"  issues: write", want:true},
      {t:"  packages: write", want:false},
      {t:"  actions: write", want:false},
      {t:"  id-token: write", want:false}
    ],
    hint:"It pushes a commit, and it opens an issue. That's all it does."
  },
  run:{
    title:"Course registry", sub:"push · main · rebuild",
    jobs:[{name:"rebuild", steps:[
      {n:"Set up job", ms:420, log:"Token permissions:\n  contents: <span class='g'>write</span>\n  issues:   <span class='g'>write</span>\n  <span class='dim'>metadata: read (implicit)</span>\n  <span class='dim'>everything else: none</span>"},
      {n:"Run actions/checkout@v4", ms:600, log:"<span class='g'>✓</span> Checked out main"},
      {n:"Rebuild registry", ms:800, log:"Wrote data/courses.js (5 courses)."},
      {n:"Commit if it changed", ms:1000, log:"[main a1c9f02] Rebuild course registry [skip ci]\n 1 file changed, 14 insertions(+)\n<span class='g'>✓</span> Pushed to origin/main\n<span class='dim'>Allowed by contents: write</span>"},
      {n:"Complete job", ms:250, log:"<span class='dim'>Token revoked. It existed for 4.1 seconds.</span>"}
    ]}]
  },
  quiz:[
    {q:"Your job runs `git push` and gets a 403. What's the most likely cause?",
     opts:["The token expired mid-run","`permissions: contents: write` is missing","checkout@v4 is out of date","The branch is protected against all pushes"],
     correct:1,
     why:"When the default token is read-only, any write is refused with a 403 that reads like an auth failure. Declaring contents: write is the fix."},
    {q:"A pull request arrives from someone's fork. What does its workflow get?",
     opts:["Full secrets and a write token","No secrets and a read-only token","Secrets but no token","Nothing — it won't run at all"],
     correct:1,
     why:"Fork PRs are untrusted, so GitHub withholds secrets and downgrades the token to read-only. Otherwise a malicious PR could simply print your credentials."}
  ]
},

{
  id:5,
  title:"Many jobs — needs, matrix, artifacts",
  eyebrow:"Level 6",
  tagline:"One job is a script. Several jobs is a pipeline — and that's where ordering, fan-out and passing data between isolated machines start to matter.",
  blocks:[
    {h:"needs: builds the graph", p:[
      "Jobs run in parallel by default. <code class='inline'>needs</code> declares a dependency, and that's what turns a flat list into a pipeline. It controls <strong>order only</strong> — it does not share files."
    ], yaml:
`jobs:
  test:
    runs-on: ubuntu-latest
    steps: [{ run: npm test }]

  build:
    needs: test              # waits for test to pass
    runs-on: ubuntu-latest
    steps: [{ run: npm run build }]

  deploy:
    needs: [test, build]     # waits for both
    runs-on: ubuntu-latest
    steps: [{ run: ./deploy.sh }]`
    },
    {h:"matrix: fan out", p:[
      "A matrix runs the same job many times with different values — the standard way to test across versions or platforms. Each combination is still a <em>separate machine</em>."
    ], yaml:
`strategy:
  fail-fast: false           # don't kill siblings on first failure
  matrix:
    node: [18, 20, 22]
    os: [ubuntu-latest, windows-latest]

runs-on: \${{ matrix.os }}   # 6 jobs, all in parallel`
    },
    {h:"Artifacts move files between jobs", p:[
      "Because jobs are isolated, the only way to hand a built file to the next job is to upload it and download it again."
    ], yaml:
`# in the build job
- uses: actions/upload-artifact@v4
  with:
    name: site
    path: dist/

# in the deploy job
- uses: actions/download-artifact@v4
  with:
    name: site`
    },
    {h:"concurrency stops the pile-up", p:[
      "Push three times quickly and you get three overlapping runs — which, for a workflow that commits back to your repository, is a genuine race. A <code class='inline'>concurrency</code> group serialises them."
    ], yaml:
`concurrency:
  group: registry-\${{ github.ref }}
  cancel-in-progress: false   # queue them; don't kill the running one`
    }
  ],
  build:{
    prompt:"<b>deploy</b> must wait for both <b>test</b> and <b>build</b>, and must collect the file that <b>build</b> produced. Toggle the lines that make that true.",
    lines:[
      {t:"  deploy:", fixed:true},
      {t:"    needs: [test, build]", want:true},
      {t:"    needs: test", want:false},
      {t:"    runs-on: ubuntu-latest", fixed:true},
      {t:"    steps:", fixed:true},
      {t:"      - uses: actions/download-artifact@v4", want:true},
      {t:"        with:", want:true},
      {t:"          name: site", want:true},
      {t:"      - run: ./deploy.sh", fixed:true}
    ],
    hint:"Two dependencies, and files never travel between jobs on their own."
  },
  run:{
    title:"Release pipeline", sub:"push · main · 3 jobs",
    jobs:[
      {name:"test (parallel)", steps:[
        {n:"node 18", ms:700, log:"<span class='g'>✓</span> 42 passing"},
        {n:"node 20", ms:750, log:"<span class='g'>✓</span> 42 passing"},
        {n:"node 22", ms:800, log:"<span class='g'>✓</span> 42 passing\n<span class='dim'>matrix: 3 machines, all at once</span>"}
      ]},
      {name:"build", steps:[
        {n:"Run npm run build", ms:1100, log:"Built dist/ in 1.1s"},
        {n:"Run actions/upload-artifact@v4", ms:600, log:"Uploading dist/ as 'site'\n<span class='g'>✓</span> Artifact stored"}
      ]},
      {name:"deploy", steps:[
        {n:"Waiting for test, build", ms:500, log:"<span class='dim'>needs: [test, build] — both green, proceeding</span>"},
        {n:"Run actions/download-artifact@v4", ms:550, log:"Downloaded 'site' → dist/\n<span class='g'>✓</span> Files restored onto a fresh machine"},
        {n:"Run ./deploy.sh", ms:900, log:"<span class='g'>Deployed.</span>"}
      ]}
    ]
  },
  quiz:[
    {q:"`build` has `needs: test`. Does build automatically see files that test created?",
     opts:["Yes, needs shares the workspace","No — needs is ordering only; use artifacts","Only files under dist/","Only if fail-fast is false"],
     correct:1,
     why:"needs sequences jobs but each still gets a clean machine. Moving files requires upload-artifact and download-artifact."},
    {q:"What does `fail-fast: false` change in a matrix?",
     opts:["Failed jobs retry automatically","One combination failing no longer cancels the others","The matrix runs sequentially","Failures are reported as warnings"],
     correct:1,
     why:"By default the first failing combination cancels its siblings. Turning fail-fast off lets every combination finish, so you learn whether it broke on one version or all of them."}
  ]
},

{
  id:6,
  title:"Capstone — a link checker for this site",
  eyebrow:"Level 7",
  tagline:"Everything at once, on a real problem: Ulearn's courses depend on external CDNs, and links rot silently. Let's catch it before a learner does.",
  blocks:[
    {h:"The problem worth automating", p:[
      "SQL Lab loads <code class='inline'>sql.js</code> from a CDN. Several courses pull Google Fonts. Course text links to external docs. <strong>None of that is under your control</strong>, and when one breaks, the page keeps loading and silently degrades — you find out when someone tells you.",
      "That's the shape of problem <code class='inline'>schedule</code> exists for: nobody's push causes it, so no push-triggered workflow will ever catch it."
    ]},
    {h:"The whole workflow", p:[
      "Every construct from the previous six levels appears here."
    ], yaml:
`name: Link check

on:
  schedule:
    - cron: "0 9 * * 1"       # Mondays, 09:00 UTC
  workflow_dispatch:           # and on demand

permissions:
  contents: read               # only needs to read the repo
  issues: write                # …and to report what it finds

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - id: check
        run: node scripts/check-links.mjs
        continue-on-error: true

      - name: Open an issue if anything broke
        if: steps.check.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: "Broken links detected",
              body: "The weekly link check failed. See the run log."
            })`
    },
    {h:"The two subtle bits", p:[
      "<code class='inline'>continue-on-error: true</code> lets the check fail without killing the job, so the next step still gets a chance to react. Its result lands in <code class='inline'>steps.check.outcome</code>.",
      "<code class='inline'>if: steps.check.outcome == 'failure'</code> then fires the reporting step only when there's something to report. Without <code class='inline'>continue-on-error</code>, the job would abort at the failing step and never open the issue."
    ], note:{t:"This is the pattern for any 'do something when a check fails' workflow: let it fail softly, capture the outcome, branch on it.", b:"Worth stealing"}},
    {h:"You could actually ship this", p:[
      "Write <code class='inline'>scripts/check-links.mjs</code> to pull every <code class='inline'>href</code> and <code class='inline'>src</code> out of <code class='inline'>courses/*/index.html</code>, fetch each one, and exit non-zero if any returns something other than 200. Drop this YAML in <code class='inline'>.github/workflows/</code>, hit <strong>Run workflow</strong>, and you'll have built a real piece of infrastructure for a real site."
    ]}
  ],
  build:{
    prompt:"The reporting step must fire <b>only when the check failed</b> — and the check must be allowed to fail without aborting the job. Toggle both.",
    lines:[
      {t:"      - id: check", fixed:true},
      {t:"        run: node scripts/check-links.mjs", fixed:true},
      {t:"        continue-on-error: true", want:true},
      {t:"", fixed:true},
      {t:"      - name: Open an issue", fixed:true},
      {t:"        if: steps.check.outcome == 'failure'", want:true},
      {t:"        if: always()", want:false},
      {t:"        uses: actions/github-script@v7", fixed:true}
    ],
    hint:"always() would open an issue every single Monday, even when everything is fine."
  },
  run:{
    title:"Link check", sub:"scheduled · a CDN went down",
    jobs:[{name:"links", steps:[
      {n:"Set up job", ms:420, log:"Triggered by: <span class='y'>schedule</span>\nPermissions: contents: read, issues: <span class='g'>write</span>"},
      {n:"Run actions/checkout@v4", ms:600, log:"<span class='g'>✓</span> Checked out main"},
      {n:"Run actions/setup-node@v4", ms:800, log:"<span class='g'>✓</span> Node 20.11.1"},
      {n:"Run node scripts/check-links.mjs", ms:1500, fail:true, log:"Scanning 5 courses…\n  fonts.googleapis.com/css2              <span class='g'>200</span>\n  docs.github.com/actions                <span class='g'>200</span>\n  cdnjs.cloudflare.com/…/sql-wasm.js     <span class='r'>503</span>\n<span class='r'>✗ 1 of 14 links broken</span>\n<span class='y'>continue-on-error: true — job continues</span>"},
      {n:"Open an issue if anything broke", ms:900, log:"<span class='dim'>steps.check.outcome == 'failure' → true</span>\nCreating issue…\n<span class='g'>✓</span> Opened #17 \"Broken links detected\""},
      {n:"Complete job", ms:300, log:"<span class='g'>Job succeeded.</span> <span class='dim'>The check failed; the workflow handled it. That's the difference.</span>"}
    ]}]
  },
  quiz:[
    {q:"Without `continue-on-error: true` on the check step, what happens to the issue-opening step?",
     opts:["It runs as normal","It's skipped — the job aborts at the failing step","It runs but can't authenticate","It runs twice"],
     correct:1,
     why:"A failing step ends the job, so anything after it is skipped. continue-on-error lets the job survive and lets you branch on the recorded outcome."},
    {q:"Why does this workflow need `schedule` rather than `push`?",
     opts:["Scheduled runs are faster","External links break without anyone pushing anything","push can't grant issues: write","schedule is required for github-script"],
     correct:1,
     why:"Nothing in your repository changes when a third-party CDN goes down. Only a time-based trigger can notice a failure that no commit caused."}
  ]
}
];

/* ==========================================================================
   State
   ========================================================================== */

let current = 0;
let runs = 0;
// { lessonId: { quiz:{qi:optIdx}, submitted:bool, built:bool } }
let state = {};

const KEY = 'github-actions-lab-progress';

async function load(){
  try{
    const r = await window.storage.get(KEY);
    if(r && r.value) state = JSON.parse(r.value);
  }catch(e){ state = {}; }
  LESSONS.forEach(l => { if(!state[l.id]) state[l.id] = { quiz:{}, submitted:false, built:false }; });
  render();
}
async function save(){
  try{ await window.storage.set(KEY, JSON.stringify(state)); }
  catch(e){ console.error('save failed', e); }
}

function isComplete(id){
  const s = state[id];
  if(!s || !s.submitted) return false;
  const l = LESSONS[id];
  const allRight = l.quiz.every((q, qi) => s.quiz[qi] === q.correct);
  return allRight && (!l.build || s.built);
}

function doneCount(){ return LESSONS.filter(l => isComplete(l.id)).length; }

/* ==========================================================================
   Helpers
   ========================================================================== */

function esc(s){
  return String(s).replace(/[&<>]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));
}

/** Minimal YAML colouring — good enough to read, no parser needed. */
function hl(src){
  return src.split('\n').map(line => {
    if(/^\s*#/.test(line)) return `<span class="c">${esc(line)}</span>`;
    let m = line.match(/^(\s*)(- )?([A-Za-z0-9_.\-]+)(:)(.*)$/);
    if(m) return `${m[1]}${m[2] ? `<span class="d">${m[2]}</span>` : ''}<span class="k">${esc(m[3])}</span><span class="p">:</span>${val(m[5])}`;
    m = line.match(/^(\s*)(- )(.*)$/);
    if(m) return `${m[1]}<span class="d">${m[2]}</span>${val(m[3])}`;
    return esc(line);
  }).join('\n');
}
/* Single pass, escaping each token as it's emitted. Chaining .replace() over
   already-generated HTML is the obvious approach and it's wrong: the quoted-
   string pattern happily matches into a class="…" attribute of a span the
   previous replace just inserted. */
function val(s){
  if(!s) return '';
  let tail = '';
  const ci = s.indexOf(' #');
  if(ci > -1){ tail = `<span class="c">${esc(s.slice(ci))}</span>`; s = s.slice(0, ci); }

  const re = /(\$\{\{.*?\}\})|("[^"]*")|('[^']*')/g;
  let out = '', last = 0, m;
  while((m = re.exec(s)) !== null){
    out += esc(s.slice(last, m.index));
    out += m[1]
      ? `<span class="e">${esc(m[1])}</span>`
      // A quoted string starting before an expression would otherwise swallow
      // it, and ${{ }} is the thing this course most needs visible — so keep
      // highlighting expressions inside the string too.
      : `<span class="s">${exprs(m[2] || m[3])}</span>`;
    last = m.index + m[0].length;
  }
  return out + esc(s.slice(last)) + tail;
}

function exprs(str){
  const re = /\$\{\{.*?\}\}/g;
  let out = '', last = 0, m;
  while((m = re.exec(str)) !== null){
    out += esc(str.slice(last, m.index));
    out += `<span class="e">${esc(m[0])}</span>`;
    last = m.index + m[0].length;
  }
  return out + esc(str.slice(last));
}

/* ==========================================================================
   Render
   ========================================================================== */

function renderSidebar(){
  const list = document.getElementById('lessonList');
  list.innerHTML = '';
  LESSONS.forEach(l => {
    const b = document.createElement('button');
    b.className = 'lesson-btn' + (l.id === current ? ' active' : '') + (isComplete(l.id) ? ' done' : '');
    b.innerHTML = `<span class="st">✓</span>
      <span class="lab"><span class="num">LEVEL ${l.id+1}</span><span class="ttl">${esc(l.title)}</span></span>`;
    b.onclick = () => { current = l.id; render(); window.scrollTo(0,0); };
    list.appendChild(b);
  });

  const done = doneCount();
  document.getElementById('sideFill').style.width = (done / LESSONS.length * 100) + '%';
  document.getElementById('sideTxt').textContent = `${done} / ${LESSONS.length} levels complete`;
  Progress.report(done, LESSONS.length);
}

function render(){
  renderSidebar();
  const l = LESSONS[current];
  const s = state[l.id];
  const main = document.getElementById('main');
  main.innerHTML = '';

  const head = document.createElement('div');
  head.innerHTML = `<div class="eyebrow">${esc(l.eyebrow)}</div>
    <h1>${esc(l.title)}</h1>
    <p class="tagline">${esc(l.tagline)}</p>`;
  main.appendChild(head);

  l.blocks.forEach((b, bi) => {
    const sec = document.createElement('section');
    sec.className = 'block';
    let html = `<h2><span class="idx">${String(bi+1).padStart(2,'0')}</span>${esc(b.h)}</h2>`;
    (b.p || []).forEach(p => html += `<p>${p}</p>`);
    if(b.yaml){
      html += `<div class="yaml">
        <div class="yaml-head"><span class="dot"></span>.github/workflows/example.yml</div>
        <pre>${hl(b.yaml)}</pre></div>`;
    }
    if(b.note){
      html += `<div class="note${b.note.bad ? ' bad' : ''}"><b>${esc(b.note.b)}:</b> ${esc(b.note.t)}</div>`;
    }
    sec.innerHTML = html;
    main.appendChild(sec);
  });

  if(l.build) main.appendChild(renderBuilder(l, s));
  main.appendChild(renderQuiz(l, s));
  main.appendChild(renderFoot(l));
}

/* ---------- builder ---------- */

function renderBuilder(l, s){
  const sec = document.createElement('section');
  sec.className = 'block';
  sec.innerHTML = `<h2><span class="idx">▸</span>Build it</h2>`;

  const wrap = document.createElement('div');
  wrap.className = 'builder';

  const prompt = document.createElement('div');
  prompt.className = 'builder-prompt';
  prompt.innerHTML = l.build.prompt;
  wrap.appendChild(prompt);

  const lines = document.createElement('div');
  lines.className = 'build-lines';

  const picked = new Set();
  l.build.lines.forEach((ln, i) => {
    const row = document.createElement('div');
    const optional = !ln.fixed;
    row.className = 'bline' + (optional ? ' opt' : ' fixed');
    row.innerHTML = `<span class="tick">${optional ? '○' : ''}</span><span class="txt">${ln.t ? hl(ln.t) : '&nbsp;'}</span>`;
    if(optional){
      row.onclick = () => {
        if(picked.has(i)){ picked.delete(i); row.classList.remove('on'); row.querySelector('.tick').textContent = '○'; }
        else { picked.add(i); row.classList.add('on'); row.querySelector('.tick').textContent = '●'; }
        msg.textContent = ''; msg.className = 'builder-msg';
      };
    }
    lines.appendChild(row);
  });
  wrap.appendChild(lines);

  const actions = document.createElement('div');
  actions.className = 'builder-actions';

  const checkBtn = document.createElement('button');
  checkBtn.className = 'btn';
  checkBtn.textContent = 'Check';

  const hintBtn = document.createElement('button');
  hintBtn.className = 'btn';
  hintBtn.textContent = 'Hint';

  const msg = document.createElement('span');
  msg.className = 'builder-msg';
  if(s.built){ msg.className = 'builder-msg ok'; msg.textContent = '✓ solved earlier'; }

  checkBtn.onclick = () => {
    const want = new Set(l.build.lines.map((ln,i) => ln.want === true ? i : -1).filter(i => i >= 0));
    const same = picked.size === want.size && [...want].every(i => picked.has(i));
    if(same){
      msg.className = 'builder-msg ok';
      msg.textContent = '✓ that\'s the one';
      s.built = true; save(); renderSidebar(); refreshFoot();
    } else {
      msg.className = 'builder-msg no';
      msg.textContent = picked.size === 0 ? 'nothing selected yet' : '✗ not quite — try again';
    }
  };
  hintBtn.onclick = () => { msg.className = 'builder-msg'; msg.textContent = l.build.hint; };

  actions.append(checkBtn, hintBtn, msg);
  wrap.appendChild(actions);
  sec.appendChild(wrap);

  if(l.run) sec.appendChild(renderRun(l.run));
  return sec;
}

/* ---------- run simulator ---------- */

function renderRun(cfg){
  const panel = document.createElement('div');
  panel.className = 'runpanel';

  const head = document.createElement('div');
  head.className = 'run-head';
  head.innerHTML = `<div>
      <div class="run-title">${esc(cfg.title)}</div>
      <div class="run-sub">${esc(cfg.sub)}</div>
    </div>
    <span class="run-status">not started</span>`;
  panel.appendChild(head);

  const body = document.createElement('div');
  panel.appendChild(body);

  const foot = document.createElement('div');
  foot.className = 'builder-actions';
  const runBtn = document.createElement('button');
  runBtn.className = 'btn run';
  runBtn.textContent = '▶ Commit & run';
  foot.appendChild(runBtn);
  panel.appendChild(foot);

  const status = head.querySelector('.run-status');
  const allSteps = [];

  function build(){
    body.innerHTML = '';
    allSteps.length = 0;
    cfg.jobs.forEach(job => {
      if(cfg.jobs.length > 1){
        const jn = document.createElement('div');
        jn.className = 'jobname';
        jn.textContent = job.name;
        body.appendChild(jn);
      }
      job.steps.forEach(st => {
        const el = document.createElement('div');
        el.className = 'step pending';
        el.innerHTML = `<div class="step-head">
            <span class="caret">▶</span>
            <span class="ico">○</span>
            <span class="nm">${esc(st.n)}</span>
            <span class="dur"></span>
          </div>
          <div class="step-log">${st.log}</div>`;
        el.querySelector('.step-head').onclick = () => {
          if(el.classList.contains('pending')) return;
          el.classList.toggle('open');
        };
        body.appendChild(el);
        allSteps.push({ el, st });
      });
    });
  }
  build();

  runBtn.onclick = async () => {
    runBtn.disabled = true;
    build();
    runs++;
    document.getElementById('runcount').textContent = `${runs} run${runs===1?'':'s'} triggered`;

    status.className = 'run-status running';
    status.textContent = 'in progress';

    let failed = false;
    for(const { el, st } of allSteps){
      el.classList.remove('pending');
      el.classList.add('running');
      el.querySelector('.ico').textContent = '◐';
      await new Promise(r => setTimeout(r, st.ms));
      el.classList.remove('running');
      if(st.fail){
        el.classList.add('fail');
        el.querySelector('.ico').textContent = '✗';
        el.classList.add('open');
        failed = true;
      } else {
        el.classList.add('ok');
        el.querySelector('.ico').textContent = '✓';
      }
      el.querySelector('.dur').textContent = (st.ms/1000).toFixed(1) + 's';
    }

    status.className = 'run-status ' + (failed ? 'fail' : 'ok');
    status.textContent = failed ? 'failure' : 'success';
    runBtn.disabled = false;
    runBtn.textContent = '↻ Run again';
  };

  return panel;
}

/* ---------- quiz ---------- */

function renderQuiz(l, s){
  const sec = document.createElement('section');
  sec.className = 'block';
  sec.innerHTML = `<h2><span class="idx">?</span>Quick check</h2>`;

  l.quiz.forEach((q, qi) => {
    const card = document.createElement('div');
    card.className = 'quiz-q';
    card.innerHTML = `<div class="qtext">${esc(q.q)}</div>`;

    const ul = document.createElement('ul');
    ul.className = 'opts';
    q.opts.forEach((opt, oi) => {
      const li = document.createElement('li');
      const b = document.createElement('button');
      b.textContent = opt;
      if(s.submitted){
        b.disabled = true;
        if(oi === q.correct) b.classList.add('correct');
        else if(s.quiz[qi] === oi) b.classList.add('wrong');
      } else if(s.quiz[qi] === oi){
        b.classList.add('selected');
      }
      b.onclick = () => {
        if(s.submitted) return;
        s.quiz[qi] = oi;
        save();
        render();
      };
      li.appendChild(b);
      ul.appendChild(li);
    });
    card.appendChild(ul);

    const why = document.createElement('div');
    why.className = 'why' + (s.submitted ? ' show' : '');
    why.innerHTML = `<b>Why:</b> ${esc(q.why)}`;
    card.appendChild(why);

    sec.appendChild(card);
  });

  if(!s.submitted){
    const answered = l.quiz.every((_, qi) => s.quiz[qi] !== undefined);
    const btn = document.createElement('button');
    btn.className = 'btn';
    btn.textContent = answered ? 'Submit answers' : `Answer all (${Object.keys(s.quiz).length}/${l.quiz.length})`;
    btn.disabled = !answered;
    btn.onclick = () => { s.submitted = true; save(); render(); };
    sec.appendChild(btn);
  } else {
    const allRight = l.quiz.every((q, qi) => s.quiz[qi] === q.correct);
    const again = document.createElement('button');
    again.className = 'btn';
    again.textContent = allRight ? 'Reset this check' : 'Try again';
    again.onclick = () => { s.submitted = false; s.quiz = {}; save(); render(); };
    sec.appendChild(again);
  }

  return sec;
}

/* ---------- footer ---------- */

function renderFoot(l){
  const foot = document.createElement('div');
  foot.className = 'lesson-foot';
  foot.id = 'lessonFoot';
  paintFoot(foot, l);
  return foot;
}

function paintFoot(foot, l){
  foot.innerHTML = '';
  const done = isComplete(l.id);

  const flag = document.createElement('span');
  flag.className = 'done-flag';
  if(done){
    flag.innerHTML = '<span>✓</span> Level complete';
  } else {
    flag.style.color = 'var(--faint)';
    const needs = [];
    const s = state[l.id];
    if(l.build && !s.built) needs.push('build task');
    if(!s.submitted || !l.quiz.every((q,qi)=>s.quiz[qi]===q.correct)) needs.push('quick check');
    flag.textContent = needs.length ? 'To finish: ' + needs.join(' + ') : '';
  }
  foot.appendChild(flag);

  const spacer = document.createElement('span');
  spacer.className = 'spacer';
  foot.appendChild(spacer);

  if(l.id > 0){
    const prev = document.createElement('button');
    prev.className = 'btn';
    prev.textContent = '← Previous';
    prev.onclick = () => { current = l.id - 1; render(); window.scrollTo(0,0); };
    foot.appendChild(prev);
  }
  if(l.id < LESSONS.length - 1){
    const next = document.createElement('button');
    next.className = 'btn';
    next.textContent = 'Next level →';
    next.onclick = () => { current = l.id + 1; render(); window.scrollTo(0,0); };
    foot.appendChild(next);
  }
}

function refreshFoot(){
  const foot = document.getElementById('lessonFoot');
  if(foot) paintFoot(foot, LESSONS[current]);
}

load();
</script>
